[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "catty-qq-ai"
version = "0.1.5"
description = "NoneBot2 QQ chat plugin backed by an OpenAI-compatible API."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "nonebot2[fastapi]>=2.4.0",
  "nonebot-adapter-onebot>=2.4.0",
  "httpx>=0.27.0",
  "Pillow>=10.0.0",
  "pydantic>=2.0.0",
]

[project.optional-dependencies]
build = [
  "pyinstaller>=6.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.nonebot]
plugins = ["catty_qq_ai"]
