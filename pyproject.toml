[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "catty-qq-ai"
version = "1.0.0"
description = "NoneBot2 QQ chat plugin backed by an OpenAI-compatible API."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "nonebot2[fastapi]>=2.4.0",
  "nonebot-adapter-onebot>=2.4.0",
  "httpx>=0.27.0",
  "mcp>=1.0.0",
  "Pillow>=10.0.0",
  "pydantic>=2.0.0",
  "matplotlib>=3.8.0",
]

[project.optional-dependencies]
local-training = [
  "safetensors>=0.4.0",
]
build = [
  "pyinstaller>=6.0.0",
]
# 本地 NLU 增强层 (主人 2026-05-28 确认): jieba + text2vec + HanLP + numpy
# 全部 encoder-only / 规则, 不生成, 不算 LLM. 走 hf-mirror.com 镜像下模型.
# 安装: pip install -e .[nlu]   或   pip install -r requirements.txt 后单独 pip install <pkg>
nlu = [
  "jieba==0.42.1",
  "numpy>=1.26,<2",
  "text2vec==1.3.1",
  "torch==2.2.2",
  "transformers==4.41.2",
  # Commit 3 启用 hanlp 时再补:
  #   "hanlp==2.1.0b62",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.nonebot]
plugins = ["catty_qq_ai"]
