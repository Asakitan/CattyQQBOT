[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "catty-qq-ai"
version = "1.0.0"
description = "NoneBot2 QQ chat plugin backed by an OpenAI-compatible API."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "nonebot2[fastapi]>=2.4.0",
  "nonebot-adapter-onebot>=2.4.0",
  "httpx>=0.27.0",
  # 主人 2026-05-28: NAI 走 socks5h proxy (远端国内服务器到 image.novelai.net 直连被墙).
  # httpx 不内置 SOCKS, 需要 socksio. 装上后 httpx 自动支持 socks5:// / socks5h:// proxy URL.
  "socksio>=1.0.0",
  "mcp>=1.0.0",
  "Pillow>=10.0.0",
  "pydantic>=2.0.0",
  "matplotlib>=3.8.0",
  # 主人 2026-05-28: Anthropic 原生 /v1/messages + cache_control + context_management
  # (compact-2026-01-12) 走 NewAPI SG relay 字节级透传, MAX OAuth 下 cache 静默 0
  # 但 input>150K 自动 server-side compaction 触发省 token.
  "anthropic>=0.45.0",
]

[project.optional-dependencies]
local-training = [
  "safetensors>=0.4.0",
]
build = [
  "pyinstaller>=6.0.0",
]
# 本地 NLU 增强层 (主人 2026-05-28 确认): jieba + text2vec + HanLP + numpy
# 全部 encoder-only / 规则, 不生成, 不算 LLM. 走 hf-mirror.com 镜像下模型.
# 安装: pip install -e .[nlu]   或   pip install -r requirements.txt 后单独 pip install <pkg>
nlu = [
  "jieba==0.42.1",
  "numpy>=1.26,<2",
  "text2vec==1.3.1",
  "torch==2.2.2",
  "transformers==4.41.2",
  "hanlp==2.1.0b62",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.nonebot]
plugins = ["catty_qq_ai"]
