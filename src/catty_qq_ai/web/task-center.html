<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Catty · 任务管理</title>
<style>
:root{--bg:#f7f8fa;--surface:#fff;--ink:#24292f;--muted:#57606a;--line:#d8dee4;--accent:#0969da;--good:#1a7f37;--bad:#cf222e;--warn:#9a6700}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 ui-sans-serif,system-ui,sans-serif;letter-spacing:0}button,input,select,textarea{font:inherit;color:inherit}button,a,input,select,textarea{touch-action:manipulation}button{cursor:pointer}button:disabled{cursor:default;opacity:.45}button,input,select,textarea{border:1px solid var(--line);border-radius:4px;background:var(--surface)}button,input,select{min-height:34px}button{padding:4px 10px}button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}:focus-visible{outline:2px solid var(--accent);outline-offset:2px}a{color:var(--accent);text-decoration:none}header{background:var(--surface);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}h1{font-size:18px;line-height:1.3;margin:0;font-weight:650}h2{font-size:15px;margin:16px 0 8px}header a{font-size:13px;margin-left:auto}main{max-width:1440px;margin:auto;padding:0 20px 28px;min-width:0}nav{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);padding-top:12px}nav button{white-space:nowrap;border:0;border-radius:0;background:transparent;border-bottom:2px solid transparent;padding:10px 14px;min-height:44px}nav button[aria-selected=true]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}.notice{min-height:38px;padding:8px 0;color:var(--muted);overflow-wrap:anywhere}.notice[data-kind=error]{color:var(--bad)}.notice[data-kind=ok]{color:var(--good)}.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar label{display:flex;align-items:center;gap:6px}.toolbar input{padding:5px 8px;width:180px;min-width:0}.toolbar select{max-width:260px;padding:4px 7px}.spacer{flex:1}.icon{width:34px;height:34px;padding:0;display:inline-grid;place-items:center;flex:none;font-size:17px}.primary{background:var(--accent);border-color:var(--accent);color:#fff}.primary:hover:not(:disabled){background:#0550ae;color:#fff}.danger{color:var(--bad)}.muted{color:var(--muted);font-size:12px}.table-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:4px;background:var(--surface);max-width:100%}table{width:100%;border-collapse:collapse;text-align:left;font-size:13px}th{background:#f0f3f6;color:var(--muted);font-weight:600;white-space:nowrap}th,td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}tbody tr:last-child td{border-bottom:0}tbody tr:hover{background:#f6f8fa}td{max-width:320px;overflow-wrap:anywhere}td.actions{min-width:124px;white-space:nowrap}.actions button{margin-right:4px}table.wide{min-width:760px}code,pre,textarea{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}code{font-size:12px;overflow-wrap:anywhere}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;max-height:65vh;overflow-y:auto;margin:0;padding:14px;background:#f6f8fa}.badge{display:inline-block;font-size:12px;border-radius:4px;padding:2px 7px;background:#eaeef2;white-space:nowrap}.badge.good{color:var(--good);background:#dafbe1}.badge.bad{color:var(--bad);background:#ffebe9}.badge.warn{color:var(--warn);background:#fff8c5}.empty{text-align:center;padding:32px;color:var(--muted)}.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;padding-top:12px}.pager span{font-variant-numeric:tabular-nums}.switch{width:18px;height:18px;accent-color:var(--accent);cursor:pointer}.metrics{display:flex;gap:24px;flex-wrap:wrap;padding:10px 0 16px;border-bottom:1px solid var(--line);margin-bottom:16px}.metric{display:flex;align-items:baseline;gap:8px}.metric strong{font-size:20px;font-variant-numeric:tabular-nums}.config-editor{display:block;width:100%;min-height:320px;resize:vertical;padding:12px;line-height:1.6;tab-size:2}.file-input{max-width:100%;font-size:12px;min-height:34px}.file-input::file-selector-button{min-height:32px;border:0;border-right:1px solid var(--line);padding:4px 10px;background:#f0f3f6;cursor:pointer}.excerpt{display:block;max-width:430px;font-size:12px;color:var(--muted);white-space:pre-wrap}.schema{max-height:180px;min-width:180px;padding:6px}dialog{width:min(800px,calc(100% - 24px));max-height:85vh;border:1px solid var(--line);border-radius:6px;padding:0;box-shadow:0 8px 40px #0002}dialog::backdrop{background:#0005}.dialog-head{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line)}.dialog-head h2{margin:0}[hidden]{display:none!important}@media(max-width:600px){header{padding:12px}main{padding:0 12px 20px}header a{font-size:12px}nav button{padding:10px 12px}.toolbar{gap:8px}.toolbar label{flex:1;min-width:120px}.toolbar label input,.toolbar label select{width:100%}.toolbar input{width:140px}.toolbar .spacer{display:none}.metrics{gap:12px 24px}.config-editor{min-height:380px;font-size:12px}th,td{padding:8px 10px}.pager{justify-content:space-between}.file-input{width:100%}}
@media(max-width:640px){.toolbar label{white-space:nowrap;flex-shrink:0}}
</style>
</head>
<body>
<header><h1>Catty <span class="muted">/</span> 任务管理</h1><a href="/dashboard">运行监控 ↗</a></header>
<main>
<nav role="tablist" aria-label="管理模块">
<button type="button" role="tab" id="tab-tasks" aria-controls="panel-tasks" aria-selected="true" data-tab="tasks">任务</button>
<button type="button" role="tab" id="tab-schedules" aria-controls="panel-schedules" aria-selected="false" data-tab="schedules">计划</button>
<button type="button" role="tab" id="tab-trace" aria-controls="panel-trace" aria-selected="false" data-tab="trace">追踪</button>
<button type="button" role="tab" id="tab-knowledge" aria-controls="panel-knowledge" aria-selected="false" data-tab="knowledge">知识库</button>
<button type="button" role="tab" id="tab-extensions" aria-controls="panel-extensions" aria-selected="false" data-tab="extensions">扩展</button>
<button type="button" role="tab" id="tab-mcp" aria-controls="panel-mcp" aria-selected="false" data-tab="mcp">MCP</button>
<button type="button" role="tab" id="tab-config" aria-controls="panel-config" aria-selected="false" data-tab="config">配置</button>
<button type="button" role="tab" id="tab-diagnostics" aria-controls="panel-diagnostics" aria-selected="false" data-tab="diagnostics">诊断</button>
</nav>
<div class="notice" id="notice" role="status" aria-live="polite"></div>
<section id="panel-tasks" role="tabpanel" aria-labelledby="tab-tasks">
<form class="toolbar" id="task-filter"><label>状态 <select id="task-status"><option value="">全部</option><option>quoted</option><option>confirming</option><option>queued</option><option>running</option><option>interrupted</option><option>delivering</option><option>completed</option><option>failed</option><option>cancelled</option><option>expired</option><option>delivery_unknown</option></select></label><label>用户 <input id="task-owner" autocomplete="off" maxlength="256" aria-label="按用户筛选"></label><button type="submit" class="icon" title="筛选" aria-label="筛选">⌕</button><span class="spacer"></span><span class="muted" id="task-total"></span><button type="button" class="icon refresh" title="刷新" aria-label="刷新">↻</button></form>
<div id="task-table" class="table-scroll"></div><div class="pager"><span id="task-page" class="muted"></span><div><button type="button" id="task-prev" class="icon" title="上一页" aria-label="上一页">←</button> <button type="button" id="task-next" class="icon" title="下一页" aria-label="下一页">→</button></div></div>
</section>
<section id="panel-schedules" role="tabpanel" aria-labelledby="tab-schedules" hidden><div class="toolbar"><h2>计划任务</h2><span class="spacer"></span><button type="button" class="icon refresh" title="刷新" aria-label="刷新">↻</button></div><div id="schedule-table" class="table-scroll"></div></section>
<section id="panel-trace" role="tabpanel" aria-labelledby="tab-trace" hidden><form class="toolbar" id="trace-filter"><label>任务 <input id="trace-task" maxlength="256" autocomplete="off"></label><label>事件 <input id="trace-event" maxlength="256" autocomplete="off"></label><button type="submit" class="icon" title="筛选" aria-label="筛选">⌕</button><span class="spacer"></span><button type="button" class="icon refresh" title="刷新" aria-label="刷新">↻</button></form><div id="trace-table" class="table-scroll"></div></section>
<section id="panel-knowledge" role="tabpanel" aria-labelledby="tab-knowledge" hidden><form class="toolbar" id="knowledge-search"><input id="knowledge-query" maxlength="1000" type="search" aria-label="检索知识库" placeholder="检索"><button type="submit" class="icon" title="检索" aria-label="检索">⌕</button><span class="spacer"></span><button type="button" class="icon refresh" title="刷新" aria-label="刷新">↻</button><button type="button" id="knowledge-rebuild" class="icon" title="重建索引" aria-label="重建索引" disabled>⟳</button></form><form class="toolbar" id="knowledge-upload"><input type="file" id="knowledge-file" class="file-input" aria-label="知识库文件"><button type="submit" id="knowledge-upload-button" class="icon primary" title="上传" aria-label="上传" disabled>↑</button></form><div id="knowledge-table" class="table-scroll"></div></section>
<section id="panel-extensions" role="tabpanel" aria-labelledby="tab-extensions" hidden><div class="toolbar"><h2>扩展</h2><span class="spacer"></span><button type="button" class="icon refresh" title="刷新" aria-label="刷新">↻</button></div><div id="extension-table" class="table-scroll"></div></section>
<section id="panel-mcp" role="tabpanel" aria-labelledby="tab-mcp" hidden><div class="toolbar"><h2>MCP Server</h2><span class="spacer"></span><button type="button" class="icon refresh" title="刷新" aria-label="刷新">↻</button></div><div id="mcp-table" class="table-scroll"></div><div id="mcp-tools" hidden><h2 id="mcp-tools-title"></h2><div id="mcp-tool-table" class="table-scroll"></div></div></section>
<section id="panel-config" role="tabpanel" aria-labelledby="tab-config" hidden><div class="toolbar"><h2>agent_tasks</h2><code id="config-sha" class="muted"></code><span class="spacer"></span><button type="button" class="icon refresh" title="重新载入" aria-label="重新载入">↻</button><button type="button" id="config-save" class="icon primary" title="保存" aria-label="保存" disabled>✓</button></div><textarea id="config-json" class="config-editor" aria-label="agent_tasks JSON 配置" spellcheck="false" disabled></textarea><div class="toolbar" style="margin-top:12px"><label>版本 <select id="config-backup" aria-label="备份版本"></select></label><button type="button" id="config-rollback" class="icon danger" title="回滚" aria-label="回滚" disabled>↶</button></div></section>
<section id="panel-diagnostics" role="tabpanel" aria-labelledby="tab-diagnostics" hidden><div class="toolbar"><h2>系统状态</h2><span class="spacer"></span><button type="button" class="icon refresh" title="刷新" aria-label="刷新">↻</button><button type="button" id="diagnostics-download" class="icon primary" title="下载诊断 ZIP" aria-label="下载诊断 ZIP">↓</button></div><div id="diagnostic-counts" class="metrics"></div><div id="diagnostic-table" class="table-scroll"></div></section>
</main>
<dialog id="details"><div class="dialog-head"><h2 id="details-title">任务</h2><button type="button" id="details-close" class="icon" title="关闭" aria-label="关闭">×</button></div><pre id="details-content"></pre></dialog>
<script>
'use strict';
const byId = id => document.getElementById(id);
const apiRoot = '/dashboard/api/';
let activeTab = 'tasks';
let loadGeneration = 0;
let taskOffset = 0;
let knowledgeRevision = null;
let configSha = null;
const states = {quoted:'待确认',confirming:'确认中',queued:'排队',running:'执行中',interrupted:'已中断',delivering:'交付中',completed:'完成',failed:'失败',cancelled:'已取消',expired:'已过期',delivery_unknown:'交付待确认',awaiting_confirmation:'待确认',paused:'已暂停',enabled:'已启用',disabled:'已停用',ready:'就绪',connected:'已连接',configured:'已配置',unconfigured:'未配置',semantic_pending:'语义待补录'};
const items = data => Array.isArray(data.items) ? data.items : [];
const itemId = item => item.task_id || item.document_id || item.extension_id || item.schedule_id || item.server_id || item.id || '';
const revision = (item,data) => Number.isInteger(item.revision) ? item.revision : Number.isInteger(data.revision) ? data.revision : null;
const text = value => value === null || value === undefined ? '—' : typeof value === 'object' ? JSON.stringify(value) : String(value);
function node(tag,value,className){const element=document.createElement(tag);if(value!==undefined)element.textContent=text(value);if(className)element.className=className;return element;}
function notice(message,kind=''){byId('notice').textContent=message;byId('notice').dataset.kind=kind;}
function failure(error){notice(error.message || '请求失败','error');}
async function request(path,method='GET',body){const options={method,credentials:'same-origin',cache:'no-store',headers:{Accept:'application/json'}};if(body!==undefined){options.headers['Content-Type']='application/json';options.body=JSON.stringify(body);}const response=await fetch(apiRoot+path,options);let data;try{data=await response.json();}catch{throw new Error('响应格式错误 · '+response.status);}if(!response.ok||!data.ok){const detail=data.detail;throw new Error((detail&&detail.code)|| (typeof detail==='string'?detail:'请求失败')+' · '+response.status);}return data.data;}
async function act(button,work,message='操作已完成'){button.disabled=true;notice('提交中…');try{await work();button.disabled=false;await load();notice(message,'ok');}catch(error){button.disabled=false;failure(error);}}
function icon(symbol,title,handler,danger=false){const button=node('button',symbol,'icon'+(danger?' danger':''));button.type='button';button.title=title;button.setAttribute('aria-label',title);button.addEventListener('click',()=>handler(button));return button;}
function badge(value){const normalized=String(value||'unknown');const good=['completed','ready','connected','enabled'].includes(normalized);const bad=['failed','cancelled','expired','disabled'].includes(normalized);return node('span',states[normalized]||normalized,'badge'+(good?' good':bad?' bad':normalized.includes('unknown')?' warn':''));}
function table(target,rows,columns,wide=false){const container=byId(target);container.replaceChildren();const grid=node('table');if(wide)grid.className='wide';const head=node('thead');const heading=node('tr');for(const column of columns)heading.append(node('th',column[0]));head.append(heading);grid.append(head);const body=node('tbody');if(!rows.length){const row=node('tr');const cell=node('td','暂无记录','empty');cell.colSpan=columns.length;row.append(cell);body.append(row);}for(const item of rows){const row=node('tr');for(const column of columns){const cell=node('td');const value=column[1](item);if(value instanceof Node)cell.append(value);else cell.textContent=text(value);if(column[2])cell.className=column[2];row.append(cell);}body.append(row);}grid.append(body);container.append(grid);}
function timeLabel(value){if(!value)return '—';const parsed=new Date(typeof value==='number'?value*1000:value);return Number.isNaN(parsed.getTime())?text(value):parsed.toLocaleString();}
function actionGroup(){return node('span',undefined,'actions');}
function showDetails(title,data){byId('details-title').textContent=title;byId('details-content').textContent=JSON.stringify(data,null,2);byId('details').showModal();}
function taskActions(item,data){const group=actionGroup();const id=itemId(item);const version=revision(item,data);group.append(icon('⋯','任务详情',button=>act(button,async()=>showDetails('任务 '+id,await request('tasks/'+encodeURIComponent(id))),'已读取任务')));if(version===null)return group;const state=item.state||item.status;if(!['completed','failed','cancelled','expired','delivery_unknown'].includes(state))group.append(icon('■','取消任务',button=>{if(confirm('取消任务 '+id+'？'))act(button,()=>request('tasks/'+encodeURIComponent(id)+'/cancel','POST',{expected_revision:version}),'已提交取消');},true));if(item.can_resume||state==='interrupted')group.append(icon('▶','续跑任务',button=>act(button,()=>request('tasks/'+encodeURIComponent(id)+'/resume','POST',{expected_revision:version}),'已提交续跑')));if(state==='delivery_unknown'||item.delivery_state==='unknown'){for(const delivered of [true,false])group.append(icon(delivered?'✓':'×',delivered?'确认已送达':'确认未送达',button=>{if(confirm(delivered?'已人工确认收到交付物？':'已人工确认交付物未送达？'))act(button,()=>request('tasks/'+encodeURIComponent(id)+'/confirm-delivery','POST',{expected_revision:version,delivered}),'交付状态已确认');}));}return group;}
function renderTasks(data){const rows=items(data);table('task-table',rows,[['任务',item=>{const cell=node('span',item.title||'');cell.append(node('small',itemId(item),'excerpt'));return cell;}],['状态',item=>badge(item.state||item.status)],['用户',item=>item.owner_id||item.user_id],['档位',item=>item.tier],['积分',item=>item.points],['更新',item=>timeLabel(item.updated_at||item.created_at)],['操作',item=>taskActions(item,data),'actions']],true);byId('task-total').textContent='共 '+(data.total??rows.length)+' 项';byId('task-page').textContent=rows.length?(taskOffset+1)+'–'+(taskOffset+rows.length):'0';byId('task-prev').disabled=taskOffset===0;byId('task-next').disabled=data.has_more===false||(Number.isInteger(data.total)?taskOffset+rows.length>=data.total:rows.length<50);}
function renderSchedules(data){table('schedule-table',items(data),[['计划',item=>item.name||itemId(item)],['状态',item=>badge(item.status||(item.enabled?'enabled':'paused'))],['下次执行',item=>timeLabel(item.next_run_at)],['操作',item=>{const group=actionGroup();const version=revision(item,data);if(version===null)return group;const id=encodeURIComponent(itemId(item));const paused=item.enabled===false||item.status==='paused';group.append(icon(paused?'▶':'Ⅱ',paused?'恢复计划':'暂停计划',button=>act(button,()=>request('schedules/'+id+'/'+(paused?'resume':'pause'),'POST',{expected_revision:version}))));group.append(icon('×','删除计划',button=>{if(confirm('删除该计划？'))act(button,()=>request('schedules/'+id+'/delete','POST',{expected_revision:version}));},true));return group;},'actions']],true);}
function renderTrace(data){table('trace-table',items(data),[['时间',item=>timeLabel(item.timestamp||item.time||item.created_at)],['任务 / 回合',item=>node('code',item.task_id||item.trace_id)],['事件',item=>item.event||item.kind],['阶段 / 工具',item=>item.stage||item.tool],['状态',item=>badge(item.status)],['耗时 ms',item=>item.duration_ms??item.latency_ms],['错误',item=>item.error_code||item.code||item.error_type]],true);}
function renderKnowledge(data){table('knowledge-table',items(data),[['文档',item=>{const block=node('span',item.filename||item.name||itemId(item));if(item.excerpt||item.snippet)block.append(node('span',String(item.excerpt||item.snippet).slice(0,500),'excerpt'));return block;}],['状态',item=>badge(item.status||(item.semantic_pending?'semantic_pending':'ready'))],['分块',item=>item.chunk_count??item.chunks],['匹配度',item=>typeof item.score==='number'?item.score.toFixed(4):item.score],['操作',item=>{const group=actionGroup();const version=revision(item,{revision:knowledgeRevision});if(version!==null)group.append(icon('×','删除文档',button=>{if(confirm('删除文档 '+(item.filename||item.name||itemId(item))+'？'))act(button,()=>request('knowledge/'+encodeURIComponent(item.document_id||item.id),'DELETE',{expected_revision:version}),'文档已删除');},true));return group;},'actions']],true);byId('knowledge-rebuild').disabled=knowledgeRevision===null;byId('knowledge-upload-button').disabled=knowledgeRevision===null||!byId('knowledge-file').files.length;}
function renderExtensions(data){table('extension-table',items(data),[['扩展',item=>item.name||itemId(item)],['版本',item=>item.version],['状态',item=>badge(item.status||(item.enabled?'enabled':'disabled'))],['工具',item=>item.tool_count],['启用',item=>{const toggle=node('input');toggle.type='checkbox';toggle.className='switch';toggle.checked=!!item.enabled;toggle.title='启用 / 停用 '+(item.name||itemId(item));toggle.setAttribute('aria-label',toggle.title);const version=revision(item,data);toggle.disabled=version===null;toggle.addEventListener('change',()=>{const enabled=toggle.checked;act(toggle,()=>request('extensions/'+encodeURIComponent(itemId(item))+'/'+(enabled?'enable':'disable'),'POST',{expected_revision:version}),enabled?'扩展已启用':'扩展已停用').finally(()=>{if(toggle.isConnected)toggle.checked=!!item.enabled;});});return toggle;}]]);}
async function showTools(button,server){button.disabled=true;try{const data=await request('mcp/'+encodeURIComponent(itemId(server))+'/tools');byId('mcp-tools-title').textContent=(server.name||itemId(server))+' · 工具';table('mcp-tool-table',items(data),[['工具',item=>node('code',item.name||item.id)],['描述',item=>item.description],['参数',item=>node('pre',JSON.stringify(item.input_schema||item.inputSchema||{},null,2),'schema')]]);byId('mcp-tools').hidden=false;notice('工具清单已读取','ok');}catch(error){failure(error);}finally{button.disabled=false;}}
function renderMcp(data){table('mcp-table',items(data),[['Server',item=>item.name||itemId(item)],['传输',item=>item.transport],['状态',item=>badge(item.status||(item.connected?'connected':'unknown'))],['工具',item=>item.tool_count],['操作',item=>icon('≡','查看工具',button=>showTools(button,item))]]);}
function renderConfig(data){configSha=data.sha256;byId('config-sha').textContent=String(configSha).slice(0,12);byId('config-json').value=JSON.stringify(data.config.agent_tasks||{},null,2);byId('config-json').disabled=false;byId('config-save').disabled=false;const versions=byId('config-backup');versions.replaceChildren();for(const backup of data.backups||[]){const option=node('option',backup);option.value=backup;versions.append(option);}byId('config-rollback').disabled=!versions.options.length;}
function renderDiagnostics(data){const counts=byId('diagnostic-counts');counts.replaceChildren();for(const [key,count]of Object.entries(data.task_counts||{})){const item=node('div',undefined,'metric');item.append(node('span',states[key]||key,'muted'),node('strong',count));counts.append(item);}table('diagnostic-table',data.modules||[],[['模块',item=>item.name],['状态',item=>badge(item.status)],['版本',item=>item.version],['错误',item=>item.error_code]]);}
async function load(){const generation=++loadGeneration;const tab=activeTab;notice('读取中…');try{let data;if(tab==='tasks'){const params=new URLSearchParams({limit:'50',offset:String(taskOffset)});if(byId('task-status').value)params.set('status',byId('task-status').value);if(byId('task-owner').value.trim())params.set('owner_id',byId('task-owner').value.trim());data=await request('tasks?'+params);}else if(tab==='trace'){const params=new URLSearchParams({limit:'100'});if(byId('trace-task').value.trim())params.set('task_id',byId('trace-task').value.trim());if(byId('trace-event').value.trim())params.set('event',byId('trace-event').value.trim());data=await request('trace?'+params);}else if(tab==='knowledge'){const listing=await request('knowledge');if(generation!==loadGeneration)return;knowledgeRevision=Number.isInteger(listing.revision)?listing.revision:null;const query=byId('knowledge-query').value.trim();data=query?await request('knowledge/search?'+new URLSearchParams({query})):listing;}else data=await request(tab);if(generation!==loadGeneration||tab!==activeTab)return;const renderers={tasks:renderTasks,schedules:renderSchedules,trace:renderTrace,knowledge:renderKnowledge,extensions:renderExtensions,mcp:renderMcp,config:renderConfig,diagnostics:renderDiagnostics};renderers[tab](data);notice('已更新 · '+new Date().toLocaleTimeString(),'ok');}catch(error){if(generation===loadGeneration)failure(error);}}
for(const tab of document.querySelectorAll('[data-tab]'))tab.addEventListener('click',()=>{activeTab=tab.dataset.tab;for(const sibling of document.querySelectorAll('[data-tab]')){const selected=sibling===tab;sibling.setAttribute('aria-selected',String(selected));byId('panel-'+sibling.dataset.tab).hidden=!selected;}load();});
for(const button of document.querySelectorAll('.refresh'))button.addEventListener('click',()=>load());
byId('task-filter').addEventListener('submit',event=>{event.preventDefault();taskOffset=0;load();});
byId('trace-filter').addEventListener('submit',event=>{event.preventDefault();load();});
byId('knowledge-search').addEventListener('submit',event=>{event.preventDefault();load();});
byId('task-prev').addEventListener('click',()=>{taskOffset=Math.max(0,taskOffset-50);load();});
byId('task-next').addEventListener('click',()=>{taskOffset+=50;load();});
byId('details-close').addEventListener('click',()=>byId('details').close());
byId('knowledge-file').addEventListener('change',()=>{byId('knowledge-upload-button').disabled=knowledgeRevision===null||!byId('knowledge-file').files.length;});
byId('knowledge-upload').addEventListener('submit',event=>{event.preventDefault();const file=byId('knowledge-file').files[0];if(!file||knowledgeRevision===null)return;if(file.size>20*1024*1024){notice('文件超过 20 MiB','error');return;}act(byId('knowledge-upload-button'),async()=>{const content=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(',')[1]);reader.onerror=()=>reject(new Error('读取文件失败'));reader.readAsDataURL(file);});await request('knowledge/upload','POST',{filename:file.name,content_base64:content,expected_revision:knowledgeRevision});byId('knowledge-file').value='';byId('knowledge-query').value='';},'文档已上传');});
byId('knowledge-rebuild').addEventListener('click',event=>{if(knowledgeRevision!==null&&confirm('重建知识库索引？'))act(event.currentTarget,()=>request('knowledge/rebuild','POST',{expected_revision:knowledgeRevision}),'重建请求已提交');});
byId('config-json').addEventListener('input',()=>{try{const value=JSON.parse(byId('config-json').value);byId('config-save').disabled=!configSha||!value||typeof value!=='object'||Array.isArray(value);}catch{byId('config-save').disabled=true;}});
byId('config-save').addEventListener('click',event=>act(event.currentTarget,async()=>{const patch={agent_tasks:JSON.parse(byId('config-json').value)};const data=await request('config','PATCH',{patch,expected_sha256:configSha});renderConfig(data);},'配置已保存'));
byId('config-rollback').addEventListener('click',event=>{const backup=byId('config-backup').value;if(backup&&confirm('回滚 agent_tasks 配置？'))act(event.currentTarget,async()=>renderConfig(await request('config/rollback','POST',{backup_id:backup,expected_sha256:configSha})),'配置已回滚');});
byId('diagnostics-download').addEventListener('click',event=>{const button=event.currentTarget;button.disabled=true;notice('打包中…');fetch(apiRoot+'diagnostics/download',{credentials:'same-origin',cache:'no-store'}).then(async response=>{if(!response.ok){let result;try{result=await response.json();}catch{}throw new Error(result?.detail?.code||'诊断下载失败');}const url=URL.createObjectURL(await response.blob());const link=node('a');link.href=url;link.download='catty-task-diagnostics.zip';document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);notice('诊断包已下载','ok');}).catch(failure).finally(()=>{button.disabled=false;});});
document.querySelector('nav').addEventListener('keydown',event=>{if(!['ArrowLeft','ArrowRight'].includes(event.key))return;event.preventDefault();const tabs=Array.from(document.querySelectorAll('[data-tab]'));const index=tabs.indexOf(document.activeElement);const next=tabs[(index+(event.key==='ArrowRight'?1:tabs.length-1))%tabs.length];next.focus();next.click();});
load();
</script>
</body>
</html>
