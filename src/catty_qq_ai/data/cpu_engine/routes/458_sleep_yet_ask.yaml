# 睡了没询问日常 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: sya_sleep_001
  intent: question
  keywords: [睡了没, 睡了吗, 睡着了吗, 上床了吗, 进被窝了吗]
  utterances:
    - "{user_addr}睡了没"
    - "{user_addr}睡了吗"
    - "{user_addr}睡着了吗"
    - "{user_addr}上床了吗"
    - "{user_addr}进被窝了吗"
  responses:
    - "嗷呜～{user_addr}关心笨猫睡眠喵ฅฅ"
    - "(揉眼睛) 笨猫还没睡, {user_addr}呢哼"
    - "才不是等{user_addr}睡了才睡呢"
    - "嘿嘿～{user_addr}一起睡嘛~"
  cooldown_seconds: 60
  weight: 1.0

