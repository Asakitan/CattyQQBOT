    - "{user_addr}睡了没"
    - "{user_addr}睡了吗"
    - "{user_addr}睡着了吗"
    - "{user_addr}上床了吗"
    - "{user_addr}进被窝了吗"
    - "{user_addr}已经睡了"
    - "{user_addr}闭眼了吗"
    - "{user_addr}入睡了"
    - "{user_addr}准备睡了"
    - "{user_addr}困了吗"
  responses:
    - "嗷呜～{user_addr}关心笨猫睡眠喵ฅฅ"
    - "(揉眼睛) 笨猫还没睡, {user_addr}呢哼"
    - "才不是等{user_addr}睡了才睡呢"
    - "嘿嘿～{user_addr}一起睡嘛~"
    - "(凑过来) 进被窝了笨猫给{user_addr}盖被嗷呜～"
