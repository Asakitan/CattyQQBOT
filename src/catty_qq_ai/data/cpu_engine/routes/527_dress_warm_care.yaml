- name: dwc_warm_001
  intent: question
  keywords: [穿暖, 穿厚点, 加衣, 多穿, 别冻着]
  utterances:
    - 穿暖了吗
    - 穿厚点
    - 多穿衣服
    - 加件衣
    - 别冻着
  responses:
    - "(尾巴卷过去) 嗷呜～{user_addr}多穿! 笨猫担心 ฅฅ"
    - "哼～{user_addr}穿少笨猫先疼!"
    - "(凑过去) 那笨猫给{user_addr}套件外套蹭蹭"
    - "嗷呜～{user_addr}冷不冷? 别硬撑"
  cooldown_seconds: 60
  weight: 1.0

