- name: rsc_sigh_001
  intent: complaint
  keywords: ["叹气", "唉", "emo", "心情低", "丧"]
  utterances:
    - "{user_addr}唉"
    - "突然好emo"
    - "心情低落"
    - "今天有点丧"
    - "唉一声叹气"
  responses:
    - "(凑近) 嗷呜~{user_addr}怎么啦~跟笨猫说嘛 ฅฅ"
    - "(尾巴轻搭) 哼~笨蛋~人家陪你不许emo喵"
    - "(蹭脸) 才不是心疼你呢~只是不喜欢沉默"
    - "(贴贴) {user_addr}~抱抱嘛~大不了一起叹气"
  cooldown_seconds: 60
  weight: 1.0

