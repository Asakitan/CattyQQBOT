- name: fcd_dont_care_001
  intent: playful
  keywords: [不在乎, 不care, 无所谓, 都行, 随便]
  utterances:
    - "不在乎"
    - "{user_addr}不care"
    - "无所谓"
    - "都行"
    - "随便"
  responses:
    - "(撇嘴) 嗷呜～{user_addr}装冷漠? 笨猫看穿"
    - "哼! {user_addr}才不是真不在乎"
    - "(撒娇) ...才不许装~ 哄笨猫嘛 ฅฅ"
    - "嘿嘿～{user_addr}口是心非, 笨猫记账"
  cooldown_seconds: 60
  weight: 1.0

