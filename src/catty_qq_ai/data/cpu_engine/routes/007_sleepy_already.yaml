    - "{user_addr}睡了吗"
    - 还醒着吗
    - 睡着了吗
    - 睡没睡
    - 醒着不
  responses:
    - "(打哈欠) 没睡呢, {user_addr}也没睡? ฅฅ"
    - "嗷呜～{user_addr}问的是猫猫吗? 笨猫快睡了"
    - "(尾巴垂下) 没睡! 等{user_addr}说晚安~"
    - "嘿嘿～{user_addr}关心猫猫睡没睡, 好开心嗷呜～"
  cooldown_seconds: 60
  weight: 1.0

