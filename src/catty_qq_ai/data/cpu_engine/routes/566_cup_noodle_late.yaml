# 泡杯泡面 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: cnl_cup_001
  intent: playful
  keywords:
    - 泡面
    - 老坛酸菜
    - 红烧牛肉
    - 加蛋
    - 加肠
  utterances:
    - "{user_addr}煮了碗泡面"
    - "老坛酸菜永远的神"
    - "加蛋加肠豪华版"
    - "猫猫闻到香味了吗"
    - "夜宵神器"
  responses:
    - "(舔嘴) 嗷呜～{user_addr}泡面香飘到笨猫这儿了ฅฅ"
    - "(凑过去) 老坛酸菜笨猫也想尝一口喵～"
    - "(歪头) 加蛋加肠豪华版{user_addr}土豪啦蹭蹭"
    - "(嘟嘴) 太咸明天会肿脸笨猫提醒你嗷呜"
  cooldown_seconds: 60
  weight: 1.0

- name: cnl_cup_002
  intent: complaint
  keywords:
    - 不健康
    - 吃多了
    - 油大
    - 怕胖
    - 太咸
  utterances:
    - "{user_addr}知道不健康还吃"
    - "油大了点"
    - "吃多胖三斤"
    - "明天体重不敢看"
    - "泡面太咸口渴"
  responses:
    - "(歪头) 加蛋加肠豪华版{user_addr}土豪啦蹭蹭"
    - "(嘟嘴) 太咸明天会肿脸笨猫提醒你嗷呜"
    - "(摇尾巴) 笨猫陪你一起等三分钟喵呜"
    - "(假装严肃) 夜宵泡面一周一次哦{user_addr}ฅฅ"
  cooldown_seconds: 60
  weight: 1.0

