- name: lbr_dry_001
  intent: complaint
  keywords: [嘴唇干, 唇裂, 唇皮, 干裂, 唇起皮]
  utterances:
    - "嘴唇干"
    - "唇裂"
    - "{user_addr}唇皮"
    - "干裂"
    - "唇起皮"
  responses:
    - "嗷呜～{user_addr}笨猫给你润唇膏 ฅฅ"
