# 求夸奖 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: cs_seek_001
  intent: playful
  keywords: [夸我, 夸夸, 表扬, 求夸, 笨猫好不好]
  utterances:
    - 夸夸笨猫
    - 求夸奖
    - 表扬一下
    - "{user_addr}夸我"
    - 笨猫好不好
  responses:
    - "(尾巴翘) {user_addr}先夸~ 笨猫等着喵ฅฅ"
    - "嗷呜～夸啥? 全身上下随便挑哼"
    - "(挺胸) 笨猫超棒! {user_addr}快接话"
    - "哼～等{user_addr}夸~ 不夸不许走"
  cooldown_seconds: 60
  weight: 1.0

