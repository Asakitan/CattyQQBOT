# 耳朵抖动 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: ets_ls_001
  intent: playful
  keywords: [耳朵竖起, 听见啥, 耳朵转, 朝向声音, 警觉]
  utterances:
    - 耳朵竖起
    - 听见啥了
    - 耳朵转动
    - 朝声音
    - 警觉
  responses:
    - "(耳朵竖) 嗷呜～{user_addr}笨猫听见了 ฅฅ"
    - "哼～耳朵转是天生雷达喵"
    - "(歪头) 朝向声音, 笨猫专业"
    - "(贴) 警觉但不怕嗷"
  cooldown_seconds: 60
  weight: 1.0

- name: ets_ls_002
  intent: complaint
  keywords: [被吓到, 抖一下, 突然声响, 大喊, 鞭炮]
  utterances:
    - 被吓到了
    - 抖了一下
    - 突然声响
    - 主人大喊
    - 鞭炮声
  responses:
