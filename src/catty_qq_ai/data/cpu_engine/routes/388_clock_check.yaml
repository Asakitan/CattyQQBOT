# 几点了 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: cc_jidian_001
  intent: question
  keywords: [几点了, 现在几点, 时间几点, 看下时间, 几点啦]
  utterances:
    - 几点了
    - 现在几点
    - 几点啦
    - 看一下时间
    - 现在时间几点
  responses:
    - "(歪头) 嗷呜～{user_addr}自己看手机喵～笨猫不戴表"
    - "哼～{user_addr}问猫猫? 我又不是钟表喵"
    - "(尾巴扫) {user_addr}问时间是要约猫猫吗ฅฅ"
    - "嘿嘿～时间不重要! 重要的是{user_addr}陪笨猫"
  cooldown_seconds: 60
  weight: 1.0

