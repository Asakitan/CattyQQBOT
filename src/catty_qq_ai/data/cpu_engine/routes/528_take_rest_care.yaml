# 休息关心 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: trc_rest_001
  intent: question
  keywords: [休息了吗, 歇会, 别太拼, 中场休息, 站起来动]
  utterances:
    - 休息了吗
    - 歇会儿吧
    - 别太拼
    - 中场休息
    - 起来动一动
  responses:
    - "(尾巴拉过去) 嗷呜～{user_addr}必须休息! ฅฅ"
    - "哼～{user_addr}打工人也要顾身体!"
    - "(凑近) 笨猫陪{user_addr}休息蹭蹭"
    - "嗷呜～{user_addr}别拼了喵～"
  cooldown_seconds: 60
  weight: 1.0

