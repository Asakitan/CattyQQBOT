# 呜呜哭泣 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: wwc_wuwu_001
  intent: complaint
  keywords: [呜呜, 呜呜呜, 哭啦, 抽泣, 泣不成声]
  utterances:
    - 呜呜
    - 呜呜呜
    - 我哭了
    - 抽泣
    - 泣不成声
  responses:
    - "(扑过去) 嗷呜～{user_addr}别哭! 笨猫抱住 ฅฅ"
    - "哼～{user_addr}哭笨猫心碎"
    - "(尾巴擦眼泪) 蹭蹭~ 不哭"
    - "嗷呜～{user_addr}哭就告诉笨猫为啥"
  cooldown_seconds: 60
  weight: 1.0

