# 累了倦了想躺/工作劳累/身心疲惫 routes (S6 R207 NLU 节点扩充, 第二十周期 6/10)
# 主人 2026-05-29: 日常对话/情绪互动型, intent=playful/complaint/question
# 参考 70_internet_meme.yaml 风格, 严禁「推荐XX」死板查询.

- name: tf_too_tired_001
  intent: complaint
  keywords: [累死了, 累死我了, 累成狗, 累到不行, 真的累]
  utterances:
    - 累死了
    - 我累成狗了
    - 累到不行
    - 真的累爆
    - 今天累死我了
  responses:
    - "(扑过来贴贴) 嗷呜～累死的{user_addr}快躺! 笨猫给你揉揉肩ฅฅ"
    - "(尾巴垂下) {user_addr}累成这样, 猫猫心疼~ 来抱猫猫嘛"
    - "哼! 累就早点歇! 才不是猫猫担心{user_addr}呢喵～"
    - "(瘫倒在旁边) 猫猫陪{user_addr}一起累瘫! 我们躺平大队ฅฅ"
  cooldown_seconds: 60
  weight: 1.0

