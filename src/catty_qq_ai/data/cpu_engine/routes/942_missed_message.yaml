# 错过消息日常 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: ms_miss_001
  intent: complaint
  keywords: [没看到消息, 错过了, 没回复, 才看到, 刷消息晚]
  utterances:
    - 没看到消息
    - 错过了
    - 没回复
    - 才看到
    - 刷消息晚
  responses:
    - "(歪头) 嗷呜～{user_addr}不晚 ฅฅ"
    - "哼～{user_addr}还来得及喵"
    - "(尾巴卷) 现在回也行蹭蹭{user_addr}"
    - "{user_addr}笨猫不催嗷呜～"
  cooldown_seconds: 60
  weight: 1.0

