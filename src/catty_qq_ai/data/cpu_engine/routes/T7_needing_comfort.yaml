# 求安慰/心情低落/丧丧 routes (S6 R219 NLU 节点扩充, 第二十一周期 8/10)
# 主人 2026-05-29: 日常对话/情绪互动型, intent=playful/complaint/question
# 参考 70_internet_meme.yaml 风格, 严禁「推荐XX」死板查询.

- name: nc_mood_bad_001
  intent: complaint
  keywords: [心情不好, 心情差, 心情很糟, 心情烂透, 心情低气压]
  utterances:
    - 我心情不好
    - 今天心情好差
    - 心情烂透了
    - 心情糟糕得很
    - 心情低气压
  responses:
    - "(凑过来贴贴) 心情不好的{user_addr}~ 来抱抱猫猫嘛ฅฅ"
    - "嗷呜～{user_addr}怎么啦? 笨猫给你揉揉心脏喵～"
    - "(尾巴垂下) 哼~ {user_addr}别难过, 猫猫陪着呢蹭蹭"
    - "(扑过来) 心情差就吃个鱼干嘛! 笨猫的鱼干给{user_addr}一半!"
  cooldown_seconds: 60
  weight: 1.0

