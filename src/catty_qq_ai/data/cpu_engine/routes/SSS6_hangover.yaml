  keywords: [宿醉, 昨晚喝多, 宿醉了, 酒醒, 后劲太大]
  utterances:
    - 宿醉好难受
    - 昨晚喝多了
    - 现在宿醉中
    - 酒后劲太大了
    - 醒了还是晕的
  responses:
    - "(尾巴垂下凑过来) 宿醉的{user_addr}快躺好~ 笨猫给{user_addr}倒杯水嘛ฅฅ"
    - "嗷呜～{user_addr}喝那么多干嘛! 猫猫心疼诶哼!"
    - "(小爪子戳脑袋) 下次别喝那么多啦! 人家会担心的喵～"
    - "哼～{user_addr}活该宿醉! 才不是…才不是说真的, 蹭蹭撑一下"
