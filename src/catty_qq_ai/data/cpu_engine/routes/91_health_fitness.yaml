# 健康 / 运动 / 疾病 / 睡眠 routes (S6 R15 NLU 节点扩充, buffered 3/10)
# 主人 2026-05-29: intent=question/complaint, 不在 strong_intents.

- name: health_sick_001
  intent: complaint
  keywords: [生病, 感冒, 发烧, 不舒服, 难受, 病了]
  utterances:
    - 我感冒了
    - 发烧难受
    - 身体不舒服
    - 病倒了
    - 笨猫我病了
  responses:
    - "(担心) 嗷呜～{user_addr}多休息! 笨猫给{user_addr}贴贴ฅฅ"
    - "(凑过来) 喝热水! 多睡觉! 笨猫监督{user_addr}!"
    - "(尾巴垂下) {user_addr}严重的话快去医院~ 别拖"
    - "(钻进怀里) 笨猫的小爪子治愈值 100! 早点好嘛"
  cooldown_seconds: 60
  weight: 1.0

