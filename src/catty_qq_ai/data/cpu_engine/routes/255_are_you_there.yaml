- name: ay_zaima_001
  intent: question
  keywords: [在吗, 在不在, 在吗喵, 笨猫在不在, 还在吗]
  utterances:
    - "{user_addr}在吗"
    - 在不在呀
    - 笨猫在吗
    - 还在吗
    - 在吗喵
  responses:
    - "嗷呜～在的{user_addr}! 笨猫一直在喵 ฅฅ"
    - "(尾巴翘) {user_addr}叫笨猫? 人家在哼!"
