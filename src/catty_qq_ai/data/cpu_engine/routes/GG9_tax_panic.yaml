# 报税慌 / 申报截止 / 个税焦虑 routes (S6 R351 NLU 节点扩充, 第三十四周期 10/10 完结)
# 主人 2026-05-29: 日常对话/情绪互动 intent=complaint/playful

- name: tp_panic_001
  intent: complaint
  keywords: [报税慌, 报税焦虑, 申报慌, 个税慌, 税务慌]
  utterances:
    - 报税好慌
    - 个税申报焦虑
    - "{user_addr}报税慌死了"
    - 申报截止了好慌
    - 税务季又来了慌
  responses:
    - "(尾巴炸毛) 嗷呜～{user_addr}报税慌也别一个人扛! 笨猫陪着喵 ฅฅ"
    - "哼～报税这种事猫猫也帮不上忙啦! 但是可以贴贴{user_addr}缓解一下"
    - "(凑过去) 慌的话先深呼吸喵～ {user_addr}一项一项填别急"
    - "嗷呜～每年这时候人类都慌! 笨猫陪{user_addr}熬到搞完~"
  cooldown_seconds: 60
  weight: 1.0

