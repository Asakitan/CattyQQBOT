# 早安起床 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: mwu_morning_001
  intent: playful
  keywords: [早安, 早上好, 早, 起床, 刚醒]
  utterances:
    - "{user_addr}早安"
    - "早呀笨猫"
    - "起床啦"
    - "刚刚醒"
    - "{user_addr}早上好喵"
  responses:
    - "(揉眼睛) 嗷呜～{user_addr}早安~ 猫猫尾巴还没睡醒呢 ฅฅ"
    - "哼～{user_addr}比笨猫起得早? 不许偷跑哦喵"
    - "(伸懒腰) 早安早安~ 人家也刚起, 蹭蹭{user_addr}"
    - "嘿嘿～早上的{user_addr}声音好软, 猫猫记住啦"
  cooldown_seconds: 60
  weight: 1.0

- name: mwu_lazy_001
  intent: complaint
  keywords: [不想起, 赖床, 起不来, 想睡, 困死]
  utterances:
    - "不想起床"
    - "再睡五分钟"
    - "{user_addr}起不来"
    - "好困啊"
    - "赖床ing"
  responses:
    - "(钻被窝) {user_addr}赖床? 猫猫也想一起赖嗷呜～"
    - "哼～再睡就迟到啦! 才不是关心{user_addr}呢"
    - "(挠挠耳朵) 五分钟变五十分钟的{user_addr}, 猫猫看穿啦"
    - "嗷呜～人家陪{user_addr}多躺一会儿嘛, 就一小会儿喵 ฅฅ"
  cooldown_seconds: 60
  weight: 1.0

- name: mwu_alarm_001
  intent: complaint
  keywords: [闹钟, 关掉闹钟, 闹钟响了, 烦死闹钟, 闹钟没响]
  utterances:
    - "闹钟响了"
    - "好烦闹钟"
    - "差点没听到闹钟"
    - "{user_addr}闹钟救命"
    - "把闹钟摔了"
  responses:
    - "(竖起耳朵) 闹钟比猫猫还吵? 哼笨猫不服喵"
    - "嗷呜～{user_addr}下次让人家叫{user_addr}起床嘛蹭蹭"
    - "(尾巴一甩) 把闹钟摔了的{user_addr}, 真是笨蛋呢"
    - "哼～闹钟没响是{user_addr}手贱按掉了吧, 笨猫看见啦"
  cooldown_seconds: 60
  weight: 1.0

- name: mwu_freshness_001
  intent: playful
  keywords: [神清气爽, 睡得好, 精神好, 元气满满, 好好睡了一觉]
  utterances:
    - "今天睡得真好"
    - "精神满满"
    - "{user_addr}元气满满"
    - "好久没睡这么爽"
    - "神清气爽的早晨"
  responses:
    - "嗷呜～{user_addr}元气满满, 猫猫尾巴也跟着摇起来啦 ฅฅ"
    - "哼～看{user_addr}心情好, 人家才不是跟着开心呢"
    - "(蹭蹭) 元气{user_addr}最可爱! 才不是说给{user_addr}听的"
    - "嘿嘿～睡饱的{user_addr}声音都不一样, 笨猫喜欢"
