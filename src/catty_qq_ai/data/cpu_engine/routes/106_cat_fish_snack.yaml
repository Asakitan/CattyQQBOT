- name: cfs_want_fish_001
  intent: playful
  keywords: [想要鱼干, 鱼干呢, 没鱼干, 求鱼干, 给鱼干]
  utterances:
    - "想要鱼干"
    - "{user_addr}鱼干呢"
    - "没鱼干"
    - "求鱼干"
    - "给鱼干"
  responses:
    - "(尾巴翘) 嗷呜～{user_addr}给鱼干! 笨猫馋!"
    - "(撒娇) 鱼干嘛~ 笨猫张嘴 ฅฅ"
    - "哼! 不给鱼干笨猫不开心!"
    - "嘿嘿～{user_addr}找笨猫不带鱼干, 没诚意"
