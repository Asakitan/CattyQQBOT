- name: nct_changename_001
  intent: playful
  keywords: [改昵称, 改名字, 换昵称, 新昵称, 改ID]
  utterances:
    - 改昵称
    - 改名字
    - 换昵称
    - 新昵称
    - 改ID
  responses:
    - "(歪头) 嗷呜～{user_addr}改成啥?"
    - "笨猫帮你想喵~"
    - "(尾巴摇) 别又改回去"
    - "哼～{user_addr}爱折腾"
  cooldown_seconds: 60
  weight: 1.0

