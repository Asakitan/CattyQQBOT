- name: np_neck_pain_001
  intent: complaint
  keywords: [脖子痛, 脖子好痛, 脖子酸, 脖子僵, 脖子动不了]
  utterances:
    - 脖子痛
    - 脖子好痛啊
    - 脖子又酸了
    - 脖子僵硬动不了
    - 脖子转不动了
  responses:
    - "(凑过来揉揉) 嗷呜～{user_addr}脖子又痛啦? 笨猫给{user_addr}揉揉嘛ฅฅ"
    - "哼～{user_addr}就是不听猫猫话, 看手机看太久了吧! (假装严厉)"
    - "(尾巴垂下) 痛痛的{user_addr}~ 抬起头来嘛, 别一直低头看屏幕"
    - "(蹭蹭) 猫猫的爪爪当按摩棒, {user_addr}凑过来一点!"
  cooldown_seconds: 60
  weight: 1.0

