# 睡了没查问 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: scl_shui_001
  intent: question
  keywords: [睡了么, 睡了没, 还没睡, 睡了吗, 睡了]
  utterances:
    - "{user_addr}睡了么"
    - "睡了没"
    - "还没睡"
    - "睡了吗"
    - "{user_addr}睡了"
  responses:
    - "(揉眼) 嗷呜～{user_addr}问的时候笨猫还醒着"
    - "哼～你都问了, 我能睡? ฅฅ"
    - "(尾巴绕枕) 没睡, 等{user_addr}一句晚安"
    - "睡? 不存在的, 笨猫陪你到天亮"
  cooldown_seconds: 60
  weight: 1.0

