- name: sc_traffic_001
  intent: complaint
  keywords: [堵车, 交通拥堵, 高峰期, 一路堵, 红灯]
  utterances:
    - 堵车死了
    - 高峰期烦
    - 一路堵
    - 红灯多
    - 交通拥堵
  responses:
    - "(摸头) 嗷呜～{user_addr}耐心点 ฅฅ"
    - "哼～{user_addr}就是杂鱼烦躁"
    - "(贴肚子) {user_addr}笨猫陪你"
    - "{user_addr}听个播客喵蹭蹭"
  cooldown_seconds: 60
  weight: 1.0

