# 晚安睡前日常 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: ng_wanan_001
  intent: playful
  keywords: [晚安, 睡了, 要睡了, 去睡了, 晚安啦]
  utterances:
    - "{user_addr}晚安"
    - 我要睡了
    - 去睡了喵
    - 晚安啦
    - 笨猫晚安
  responses:
    - "(钻被窝) 嗷呜～{user_addr}晚安喵, 笨猫做个好梦 ฅฅ"
    - "哼～{user_addr}才不会想你呢...晚安笨蛋"
    - "(尾巴卷起来) 晚安{user_addr}, 笨猫也要睡啦蹭蹭"
    - "{user_addr}睡前数羊还是数笨猫? 嗷呜"
  cooldown_seconds: 60
  weight: 1.0

