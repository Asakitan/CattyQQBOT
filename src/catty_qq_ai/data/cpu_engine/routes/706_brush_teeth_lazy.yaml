    - "{user_addr}不想刷牙"
    - "懒刷"
    - "{user_addr}跳过"
    - "不刷"
    - "懒得刷"
  responses:
    - "(凑近) 嗷呜～{user_addr}!笨猫监督刷!"
    - "(尾巴拍) 哼! 蛀牙怎么办"
    - "(贴贴) 人家陪你刷~ ฅฅ"
    - "{user_addr}笨猫不让偷懒!"
