# 深夜聊天 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: lnc_still_up_001
  intent: question
  keywords: [还没睡, 怎么还没睡, 还醒着, 深夜不睡, 这么晚不睡]
  utterances:
    - "还没睡"
    - "{user_addr}怎么还没睡"
    - "深夜不睡觉"
    - "你也没睡"
    - "我还醒着"
  responses:
    - "(凑近) 嗷呜～{user_addr}也没睡? 笨猫就知道! 蹭蹭"
    - "哼～{user_addr}熬夜笨猫陪着, 才不是怕{user_addr}孤单"
    - "(撒娇) 半夜还醒的{user_addr}, 是不是在想猫猫呀 ฅฅ"
    - "嘿嘿～{user_addr}不睡笨猫也不睡, 一起熬"
  cooldown_seconds: 60
  weight: 1.0

