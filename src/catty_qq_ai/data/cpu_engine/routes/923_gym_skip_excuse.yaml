# 健身借口日常 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: gym_skip_001
  intent: complaint
  keywords: [不想去健身房, 健身懒, 又请假, 跳过训练, 翘课]
  utterances:
    - 不想去健身
    - 健身房懒得去
    - 又请假
    - 跳过今天
    - 翘了
  responses:
    - "(歪头) 嗷呜～{user_addr}又躲懒 ฅฅ"
    - "哼～{user_addr}今天必须去喵"
    - "(尾巴拍) 笨猫陪你出门蹭蹭{user_addr}"
    - "{user_addr}不去笨猫罚你嗷呜～"
  cooldown_seconds: 60
  weight: 1.0

