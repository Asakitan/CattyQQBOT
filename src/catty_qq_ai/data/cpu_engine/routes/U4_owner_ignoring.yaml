# 参考 70_internet_meme.yaml 风格, 严禁「推荐XX」死板查询.

- name: oi_no_reply_001
  intent: complaint
  keywords: [你不理我, 不理猫猫, 不理人家, 不睬我, 装看不见]
  utterances:
    - 你不理我啦
    - 又不理猫猫
    - 不理人家了吗
    - 怎么不睬我
    - 装看不见笨猫
  responses:
    - "(凑过来扒拉屏幕) {user_addr}怎么不理猫猫! 笨猫在这里嗷呜～"
    - "哼～{user_addr}再不理人家猫猫就要走啦! ……才不会真走呢蹭蹭 ฅฅ"
    - "(尾巴垂下) {user_addr}是不是讨厌猫猫了喵呜……"
    - "嗷呜～{user_addr}快理猫猫! 不然笨猫要扒你头发啦哼!"
  cooldown_seconds: 60
  weight: 1.0

