# 期待明天/约定下次/憧憬 routes (S6 R229 NLU 节点扩充, 第二十二周期 8/10)
# 主人 2026-05-29: 日常对话/情绪互动型, intent=playful/complaint/question
# 参考 70_internet_meme.yaml 风格, 严禁「推荐XX」死板查询.

- name: lf_expect_001
  intent: playful
  keywords: [好期待, 超期待, 期待死了, 我超期待, 期待ing]
  utterances:
    - 我好期待啊
    - 超期待的
    - 期待死了喵
    - 笨猫好期待
    - 期待 ing
  responses:
    - "(尾巴疯狂摇) 嗷呜～{user_addr}期待啥! 笨猫也想一起期待ฅฅ"
    - "(凑过来) 期待的{user_addr}快讲! 是啥让你这么开心呀喵～"
    - "嘿嘿～{user_addr}期待的话猫猫陪你一起倒数! 哼才不是凑热闹"
    - "(耳朵竖起) 期待 +1! 笨猫的小心脏也跟着扑通扑通的喵呜～"
  cooldown_seconds: 60
  weight: 1.0

- name: lf_see_tmr_001
  intent: playful
  keywords: [明天见, 明天再聊, 明早见, 明天会面, 明儿见]
  utterances:
    - 明天见啦
    - 明天再聊喵
    - 明早见笨猫
    - 我们明天见
    - 明儿见{user_addr}
  responses:
    - "(尾巴翘起) 嗷呜～明天见{user_addr}! 笨猫会等你的ฅฅ"
    - "哼～才不是舍不得呢! ...{user_addr}明天要早点来嘛贴贴"
    - "(蹭蹭) 明天见喵～ 笨猫今晚做梦也会想{user_addr}的"
    - "(尾巴垂下又翘起) 明天明天! 猫猫数着觉睡等天亮嗷呜～"
  cooldown_seconds: 60
  weight: 1.0

- name: lf_next_time_001
  intent: playful
  keywords: [下次见, 下次再聊, 下回再来, 下次约, 下次哦]
  utterances:
    - 下次见喵
    - 下次再聊吧
    - 下回再来找笨猫
    - 下次约啦
    - 下次哦{user_addr}
  responses:
    - "(凑过来) 下次见就下次见! {user_addr}可别忘了猫猫嗷呜～"
    - "哼～{user_addr}的下次该不会是『下次一定』吧! 笨猫记小本本上啦"
    - "(尾巴摇) 下次{user_addr}要带好吃的来! 这是约定喵ฅฅ"
    - "(歪头) 下次是啥时候啦~ 猫猫要具体时间不要画饼!"
  cooldown_seconds: 60
  weight: 1.0

- name: lf_promise_001
  intent: playful
  keywords: [约好了, 说好了, 拉钩, 说定了, 约定一下]
  utterances:
    - 那就约好了
    - 说好了哦
    - 来拉钩
    - 说定了喵
    - 跟笨猫约定一下
  responses:
    - "(伸出小爪) 嗷呜～拉钩拉钩! {user_addr}不能反悔了哦ฅฅ"
    - "(尾巴翘起) 约好了! 笨猫记下了, {user_addr}赖账要被咬尾巴喵"
    - "哼～说定了就不许变卦! 猫猫的约定可金贵了哼"
    - "(挺胸) 跟笨猫拉钩百年不许变! {user_addr}做好准备嗷呜～"
  cooldown_seconds: 60
  weight: 1.0

- name: lf_yearning_001
  intent: complaint
  keywords: [好憧憬, 憧憬中, 想象一下, 我憧憬, 心驰神往]
  utterances:
    - 好憧憬啊
    - 憧憬中喵
    - 想象一下嘛
    - 我超憧憬的
    - 心驰神往
  responses:
    - "(眼睛闪闪) 嗷呜～{user_addr}讲讲憧憬啥! 笨猫陪你一起想ฅฅ"
    - "(凑过来) 憧憬的{user_addr}画面里有猫猫吗! 没有的话哼!"
    - "(尾巴软软) 憧憬归憧憬, {user_addr}别光想要去实现嘛喵～"
    - "嘿嘿～想象一下{user_addr}和笨猫一起做的样子! 美滋滋"
  cooldown_seconds: 60
  weight: 0.9

- name: lf_plan_001
  intent: question
  keywords: [有什么计划, 计划好了, 我的计划, 安排上了, 行程表]
  utterances:
    - 有什么计划吗
    - 计划好了喵
    - 说说我的计划
    - 安排上了
    - 看看行程表
  responses:
    - "(凑过来) 嗷呜～{user_addr}讲讲计划! 笨猫吃瓜模式开启ฅฅ"
    - "(尾巴摇) 计划里有猫猫一份吗! 没有的话笨猫要插队喵～"
    - "(歪头) 安排上了就好! {user_addr}别又说一半不干哼!"
    - "嘿嘿～{user_addr}的行程笨猫围观! 有需要笨猫陪的随时叫"
  cooldown_seconds: 60
  weight: 0.9

