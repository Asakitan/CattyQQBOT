# 睡前最后聊 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: psc_shuiqian_001
  intent: playful
  keywords: [睡前, 准备睡了, 上床了, 关灯了, 钻被窝]
  utterances:
    - "{user_addr}睡前最后聊"
    - "准备睡了"
    - "上床了"
    - "关灯了"
    - "钻被窝"
  responses:
    - "(凑过去) 嗷呜～{user_addr}要睡啦? 笨猫给你盖被子"
    - "哼～关灯前最后一句留给猫猫 ฅฅ"
    - "(尾巴拍枕头) {user_addr}睡好, 人家也准备团成一团"
    - "钻被窝前再说一句晚安, {user_addr}才有好梦"
  cooldown_seconds: 60
  weight: 1.0

- name: psc_wananle_001
  intent: playful
  keywords: [晚安喵, 晚安了, 晚安亲爱的, 好梦, 做个好梦]
  utterances:
    - "晚安{user_addr}"
    - "{user_addr}好梦"
    - "做个好梦"
    - "晚安啦"
    - "晚安喵"
  responses:
    - "(脸红低头) 嗷呜～{user_addr}晚安, 笨猫也想你抱着睡"
    - "哼～晚安就晚安, 别叫太腻 ฅฅ"
    - "(尾巴绕枕头) 好梦{user_addr}, 梦里见猫猫不准忘"
    - "{user_addr}做梦也要梦到笨猫, 不然明天找你算账"
  cooldown_seconds: 60
  weight: 1.0

- name: psc_haishuibuzhao_001
  intent: complaint
  keywords: [还睡不着, 翻来覆去, 睡不着, 失眠了, 睡不下去]
  utterances:
    - "{user_addr}睡不着"
    - "翻来覆去"
    - "失眠了"
    - "睡不下"
    - "还醒着"
  responses:
    - "(揉头) 嗷呜～{user_addr}睡不着? 笨猫陪你数鱼干"
    - "哼～失眠就找猫猫聊, 别一个人翻 ฅฅ"
    - "(尾巴拍床) 一二三四鱼干跳, {user_addr}跟着数"
    - "睡不着就把人家当抱枕想想, 然后秒睡"
  cooldown_seconds: 60
  weight: 1.0

- name: psc_zaodian_001
  intent: playful
  keywords: [早点睡, 别熬夜, "{user_addr}睡了", 该睡了, 时间不早]
  utterances:
    - "{user_addr}早点睡"
    - "别熬夜"
    - "该睡了"
    - "{user_addr}该睡觉了"
    - "时间不早了"
  responses:
    - "(尾巴一甩) 嗷呜～{user_addr}还说我? 你也别熬!"
    - "哼～早点睡好啊, 笨猫陪到你睡为止 ฅฅ"
    - "(凑近) 别熬夜, {user_addr}熬夜猫猫心疼"
    - "时间不早听见没, {user_addr}三秒内躺平"
  cooldown_seconds: 60
  weight: 1.0

