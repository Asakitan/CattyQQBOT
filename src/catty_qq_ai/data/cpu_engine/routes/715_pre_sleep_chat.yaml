    - "梦到什么"
    - "{user_addr}想梦到啥"
    - "想做美梦"
    - "梦里要不要见"
  responses:
    - "(歪头) 嗷呜～{user_addr}梦? 笨猫提前预定一个位"
    - "哼～梦到笨猫就赢了 ฅฅ"
    - "(尾巴绕) 想梦啥跟猫猫说, 人家帮你许愿"
    - "{user_addr}做美梦, 猫猫也不打扰, 偷偷蹭蹭就走"
  cooldown_seconds: 60
  weight: 1.0

