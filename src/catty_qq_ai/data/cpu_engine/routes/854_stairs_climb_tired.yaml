# 爬楼梯累 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: str_climb_001
  intent: complaint
  keywords: [爬楼好累, 爬不动, 腿酸, 喘不过气, 一层楼歇]
  utterances:
    - "爬楼累死"
    - "爬不动"
    - "腿酸"
    - "喘不过气"
    - "{user_addr}爬楼累"
  responses:
    - "(扑过来) 嗷呜～{user_addr}累瘫? 笨猫给你揉腿ฅฅ"
    - "(尾巴绕) 哼～平时不锻炼吧, 笨猫陪你练"
    - "(凑近) 主人喘口气慢慢爬"
    - "(贴贴) 笨猫给你打气加油嗷"
  cooldown_seconds: 60
  weight: 1.0

