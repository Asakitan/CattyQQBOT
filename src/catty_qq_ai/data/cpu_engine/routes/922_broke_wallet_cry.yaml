- name: brk_nomoney_001
  intent: complaint
  keywords: [没钱了, 余额不足, 穷, 钱包空, 一分没有]
  utterances:
    - 没钱了
    - 余额不足
    - 穷死了
    - 钱包空空
    - 一分都没
  responses:
    - "(贴贴) 嗷呜～{user_addr}笨猫陪你哭 ฅฅ"
    - "哼～{user_addr}下次别乱花喵"
    - "(尾巴卷) 笨猫请你吃白米饭蹭蹭{user_addr}"
    - "{user_addr}人家陪你度过寒冬嗷呜～"
  cooldown_seconds: 60
  weight: 1.0

