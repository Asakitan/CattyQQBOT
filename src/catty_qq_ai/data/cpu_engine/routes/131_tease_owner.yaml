- name: to_belly_001
  intent: playful
  keywords: [变胖了, 肚子大了, 圆了, 长胖, 啤酒肚]
  utterances:
    - 我变胖了吗
    - 肚子大了
    - 圆了一圈
    - 长胖
    - 啤酒肚
  responses:
    - "(戳肚子) 嗷呜～{user_addr}软软的 ฅฅ"
    - "哼～{user_addr}就是个杂鱼吃货"
    - "(凑过去) {user_addr}笨猫不嫌弃"
    - "{user_addr}胖也可爱蹭蹭"
  cooldown_seconds: 60
  weight: 1.0

