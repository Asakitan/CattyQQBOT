- name: awt_xiaban_001
  intent: complaint
  keywords: [下班了, 终于下班, 解放了, 走出公司, 打卡下班]
  utterances:
    - "下班了"
    - "{user_addr}终于下班"
    - "解放了"
    - "走出公司"
    - "打卡下班"
  responses:
    - "(扑) 嗷呜～{user_addr}下班! 笨猫等门"
    - "哼～终于下班还不快回 ฅฅ"
    - "(尾巴摇) 解放好, 但路上别玩手机"
    - "{user_addr}打完卡赶紧投笨猫怀里"
  cooldown_seconds: 60
  weight: 1.0

