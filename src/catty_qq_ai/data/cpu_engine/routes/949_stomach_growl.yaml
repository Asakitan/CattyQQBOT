# 肚子咕咕叫 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: stm_growl_001
  intent: playful
  keywords: [肚子叫, 咕咕, 肚子响, 饿了, 咕噜咕噜]
  utterances:
    - "肚子咕咕叫"
    - "肚子叫了"
    - "{user_addr}饿"
    - "咕噜咕噜"
    - "肚子响"
  responses:
    - "(凑过来听) 嗷呜～{user_addr}笨猫听到了, 该吃饭啦 ฅฅ"
    - "哼～{user_addr}饿到响才说, 笨猫嫌弃"
    - "(摸肚子) {user_addr}人家也饿蹭蹭"
    - "{user_addr}笨猫给你叫外卖喵～"
  cooldown_seconds: 60
  weight: 1.0

- name: stm_loud_001
