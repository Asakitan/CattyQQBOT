  keywords: [早晨咖啡, 第一杯, 续命咖啡, 早上咖啡, 起床咖啡]
  utterances:
    - "{user_addr}早晨咖啡"
    - "第一杯"
    - "{user_addr}续命咖啡"
    - "早咖啡"
    - "起床喝一杯"
