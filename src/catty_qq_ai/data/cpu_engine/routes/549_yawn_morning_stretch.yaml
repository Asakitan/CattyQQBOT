# 早晨打哈欠伸懒腰 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: yws_yawn_001
  intent: playful
  keywords:
    - 哈欠
    - 伸懒腰
    - 懒洋洋
    - 起不来
    - 赖床
  utterances:
    - "{user_addr}打了个大哈欠，眼泪都出来了"
    - "刚起来伸了个懒腰咔咔响"
    - "{user_addr}好困啊嗯～"
    - "哈～～欠"
    - "赖床赖到现在才起"
  responses:
    - "(也跟着打哈欠) 嗷呜～{user_addr}哈欠传染人家了喵ฅฅ"
    - "(伸长懒腰咔咔响) 笨猫陪{user_addr}一起伸懒腰嘛～"
    - "(凑到{user_addr}怀里) 哼困就靠着人家睡一会儿啦喵呜～"
    - "(尾巴轻拍) 才不是怕{user_addr}犯困才来贴贴的呢蹭蹭ฅฅ"
  cooldown_seconds: 60
  weight: 1.0

