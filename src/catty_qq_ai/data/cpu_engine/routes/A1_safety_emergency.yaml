# 应急 / 安全 / 急救 / 灾害 routes (S6 R23 NLU 节点扩充, buffered 2/10)
# 主人 2026-05-29: intent=question/info_request, 短语级 keywords.
# 兜底原则: 严重情况引导拨打 120/119/110, 不替代专业人员.

- name: emergency_fire_001
  intent: question
  keywords: [着火了, 火灾怎么办, 起火, 失火, 防火]
  utterances:
    - 着火了怎么办
    - 火灾应急
    - 失火怎么处理
    - 防火知识
    - 笨猫教火灾
  responses:
    - "嗷呜～{user_addr}立刻拨 119! 先撤离自己!"
    - "(挺胸) 火灾: 湿毛巾捂口鼻 + 弯腰低姿 + 找安全出口"
    - "{user_addr}电器着火先切电源! 别用水浇!"
    - "(尾巴一甩) 笨猫提醒: 油锅起火盖锅盖灭火! 别加水会爆"
  cooldown_seconds: 60
  weight: 1.0

- name: emergency_medical_001
  intent: question
  keywords: [拨打120, 叫救护车, 急救电话, 怎么急救, 紧急医疗]
  utterances:
    - 怎么叫救护车
    - 拨打 120
    - 急救电话
    - 紧急情况怎么办
    - 笨猫教急救
  responses:
    - "嗷呜～{user_addr}危急直接拨 120! 别犹豫!"
    - "(挺胸) 报清楚: 地址 + 症状 + 患者意识/呼吸"
    - "{user_addr}等救护车时保持冷静~ 别移动伤者"
    - "(歪头) 笨猫提醒: 心跳停止立刻 CPR! 早 1 分钟救命"
  cooldown_seconds: 60
  weight: 1.0

