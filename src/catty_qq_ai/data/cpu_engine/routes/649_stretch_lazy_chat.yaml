  responses:
    - "(小爪子捶背) 嗷呜~{user_addr}让笨猫捶捶,力度够不够 ฅฅ"
    - "(转转脖子陪着) 哼~久坐就是这样啦~人家早就提醒过你了喵"
    - "(尾巴帮揉) 笨蛋{user_addr}~起来走两步啦,不然真的废掉"
    - "(凑近) 才不是心疼你呢~只是讨厌看你佝偻着哼"
