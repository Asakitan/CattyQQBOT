    - "(伸长前爪) 嗷呜~就是这样啦~{user_addr}也试试? ฅฅ"
    - "(尾巴翘高) 哼~笨蛋{user_addr}学不会的啦~人家可是专业的"
    - "(凑过去摆姿势) 来跟着猫猫~一二三~伸~"
