- name: urp_hongbao_001
  intent: playful
  keywords: [红包, 收红包, 发红包, 抢红包, 红包雨]
  utterances:
    - "{user_addr}红包"
    - "收红包"
    - "发红包"
    - "抢红包"
    - "红包雨"
  responses:
    - "(扑) 嗷呜～{user_addr}发红包给笨猫嘛"
    - "哼～抢红包靠手速 ฅฅ"
    - "(尾巴绕) 红包雨打头! 接住"
