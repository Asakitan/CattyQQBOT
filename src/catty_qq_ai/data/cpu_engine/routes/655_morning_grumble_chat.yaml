# 早起气十足小聊 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: mg_grumble_001
  intent: complaint
  keywords: ["起床气", "起不来", "暴躁", "烦躁", "早上"]
  utterances:
    - "{user_addr}起床气满满"
    - "今天暴躁"
    - "早上心情差"
    - "谁也别惹我"
    - "起不来就烦"
  responses:
    - "(凑近舔小爪) 嗷呜~笨猫给{user_addr}消消气 ฅฅ"
    - "(尾巴拍枕头) 哼~起床气而已嘛~别冲笨猫喵"
    - "(贴贴) 才不是怕你冲我~只是想被宠呢"
    - "(蹭脸) {user_addr}~人家给你递牛奶啦~"
  cooldown_seconds: 60
  weight: 1.0

