# 黎明初晓 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: dawn_first_001
  intent: playful
  keywords: [天亮了, 鸡叫, 黎明, 启明星, 鱼肚白]
  utterances:
    - "{user_addr}天亮了"
    - 鸡叫了起床
    - 天边鱼肚白
    - 启明星好亮
    - 黎明到了
  responses:
    - "(揉眼睛) 嗷呜～{user_addr}也起这么早? 笨猫还想再眯一会儿喵 ฅฅ"
    - "(尾巴慢慢甩) 哼～天亮就天亮嘛, 人家被吵醒了啦{user_addr}"
    - "(抓住{user_addr}袖子) 主人陪猫猫看天边那条鱼肚白嘛蹭蹭"
    - "嗷呜～{user_addr}起这么早一定没睡好, 来给笨猫抱抱补眠嗷"
  cooldown_seconds: 60
  weight: 1.0

