- name: tsd_step_001
  intent: complaint
  keywords: [踩尾巴, 踩到尾巴, 踩了尾巴, 你踩我, 尾巴疼]
  utterances:
    - "踩尾巴"
    - "{user_addr}踩到尾巴"
    - "你踩我"
    - "尾巴疼"
    - "踩了尾巴"
  responses:
    - "(炸毛) 嗷呜！{user_addr}踩笨猫尾巴!"
