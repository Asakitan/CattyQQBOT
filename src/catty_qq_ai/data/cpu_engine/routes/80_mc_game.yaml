# MC 服务器 / 游戏问询 routes (S6 R9 NLU 节点扩充)
# 主人 2026-05-29: intent=question 不在 strong_intents, CPU 能直接 emit.
# **避开** keyword_reply 已用的 "MC/我的世界/Minecraft" 这三个 keyword 防止冲突
# (cpu_engine priority=37 抢在 keyword_reply 40 之前, 配置的整合包文案仍由
# keyword_reply 触发, CPU 引擎只处理更细分的场景).

- name: mc_server_ip_001
  intent: question
  keywords: [sakisense, doi.saki, 26843, 服务器地址, 服务器 ip, 服务器 IP, 进服地址]
  utterances:
    - 服务器地址是多少
    - 服务器 IP 是啥
    - 怎么连接服务器
    - sakisense 是什么
    - 服务器在哪
  responses:
    - "嗷呜～服务器地址是 doi.sakisense.top:26843 喵! 国内宝宝卡的话用 sakisense.top:26843"
    - "(尾巴翘) 主服: doi.sakisense.top:26843, 备用: sakisense.top:26843~ {user_addr}收好"
    - "嗨～服务器地址 doi.sakisense.top:26843~ 国内连不上换 sakisense.top:26843 嗷呜～"
  cooldown_seconds: 90
  weight: 1.0

