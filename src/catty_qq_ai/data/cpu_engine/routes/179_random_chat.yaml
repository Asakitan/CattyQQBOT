  utterances:
    - 现在干啥
    - 此刻在做啥
    - 你这会
    - 正在做啥
    - 当下
  responses:
    - "(歪头) 笨猫在等{user_addr}找人家ฅฅ"
    - "嗷呜～发呆中! 等你说话哼"
    - "(尾巴扫) 笨猫在偷看{user_addr}~ 别动喵"
