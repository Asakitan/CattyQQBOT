# 闲聊乱聊 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: rc_chat_topic_001
  intent: question
  keywords: [说点啥, 没话说, 找话题, 聊点, 聊啥]
  utterances:
    - 说点啥
    - 没话说
    - 找话题
    - 聊点啥
    - 聊啥呢
  responses:
    - "(歪头) {user_addr}没话题就聊笨猫嘛ฅฅ"
    - "嗷呜～{user_addr}今天发生啥讲给笨猫哼"
    - "(尾巴扫) 笨猫开话题~ 你最近吃啥好吃的"
    - "哼～{user_addr}找笨猫聊~ 撒娇就行喵"
  cooldown_seconds: 60
  weight: 1.0

- name: rc_random_thought_002
  intent: playful
  keywords: [突然想到, 我突然觉得, 灵光一闪, 灵感, 蹦出]
  utterances:
    - 突然想到
    - 突然觉得
    - 灵光一闪
    - 灵感来了
    - 蹦出念头
  responses:
    - "(歪头) {user_addr}说! 笨猫听ฅฅ"
    - "嗷呜～{user_addr}脑洞好~ 笨猫想听哼"
    - "(尾巴翘) 想啥? 笨猫充满好奇喵"
    - "哼～{user_addr}灵感跟笨猫说~ 不许藏"
  cooldown_seconds: 60
  weight: 1.0

- name: rc_meaningless_003
  intent: playful
  keywords: [无聊话, 鬼扯, 瞎扯, 胡说, 随便说]
  utterances:
    - 无聊话
    - 鬼扯
    - 瞎扯
    - 胡说一下
    - 随便说
  responses:
