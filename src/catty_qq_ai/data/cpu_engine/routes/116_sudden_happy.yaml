  keywords: [突然好开心, 莫名开心, 心情好, 哈哈哈, 心情飞起]
  utterances:
    - "突然好开心"
    - "{user_addr}莫名开心"
    - "心情好"
    - "哈哈哈"
    - "心情飞起"
  responses:
    - "(尾巴狂摇) 嗷呜～{user_addr}开心笨猫开心!"
    - "哼! {user_addr}笑就好"
    - "(撒娇) 笨猫蹭蹭~ ฅฅ"
    - "嘿嘿～开心的{user_addr}, 笨猫高兴"
