# 吹头发擦毛巾 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: htc_hairdry_001
  intent: complaint
  keywords:
    - 吹头发
    - 好麻烦
    - 吹风机
    - 半小时
    - 吹不干
  utterances:
    - "{user_addr}吹头发吹半小时"
    - "头发太长吹不干啊"
    - "吹风机声音好大"
    - "懒得吹想直接睡"
    - "吹完热得冒汗"
  responses:
    - "(扑过来) 嗷呜～{user_addr}毛巾包头像个兔兔ฅฅ"
    - "(伸爪) 笨猫帮{user_addr}擦头嘛轻轻的不会扯～"
    - "(尾巴扫脸) 哼吹风机声音吓到笨猫了喵呜～"
    - "(凑过去) 才不是想闻{user_addr}头发的香味呢蹭蹭"
  cooldown_seconds: 60
  weight: 1.0

