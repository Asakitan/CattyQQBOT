- name: sec_bump_001
  intent: complaint
  keywords: [撞到, 撞了人, 撞墙, 撞门, 撞柱子]
  utterances:
    - 撞到人
    - 撞门了
    - 撞柱子
    - 撞墙
    - 撞了一下
  responses:
    - "(担心) 嗷呜～{user_addr}疼吗! 笨猫吹吹ฅฅ"
    - "哼～{user_addr}走路不看! 笨猫罚"
