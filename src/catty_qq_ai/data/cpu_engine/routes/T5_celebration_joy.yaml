# 参考 70_internet_meme.yaml 风格, 严禁「推荐XX」死板查询.

- name: cj_birthday_001
  intent: playful
  keywords: [生日快乐, 我生日, 今天生日, 过生日, 生日到了]
  utterances:
    - 今天我生日
    - 笨猫生日快乐
    - 我过生日啦
    - 生日到了喵
    - 今天是我生日
  responses:
    - "(扑过来) 嗷呜～{user_addr}生日快乐! 猫猫给你唱生日歌喵～ฅฅ"
    - "(尾巴疯狂摇) 生日!? {user_addr}怎么不早说! 笨猫蛋糕都没准备!"
    - "嘿嘿～{user_addr}生日要许愿哦~ 猫猫陪你吹蜡烛嗷呜!"
    - "哼～{user_addr}生日老娘当然要记得! 才不是临时记起来呢, 抱抱!"
  cooldown_seconds: 60
  weight: 1.0

