# 参考 70_internet_meme.yaml 风格, 严禁「推荐XX」死板查询.

- name: wc_too_hot_001
  intent: complaint
  keywords: [太热了, 好热啊, 热爆了, 热得不行, 这天气太热]
  utterances:
    - 今天太热了
    - 好热啊喵
    - 热得不行
    - 热爆了
    - 这天气太热啦
  responses:
    - "(瘫倒) 嗷呜～{user_addr}热成狗了吗! 笨猫陪你一起瘫地板ฅฅ"
    - "热! 笨猫的猫毛都热塌了! {user_addr}快开空调嘛喵～"
    - "(尾巴垂下) 热的{user_addr}先吃个冰棒~ 猫猫蹭一口"
    - "哼～{user_addr}才知道夏天的可怕! 笨猫已经摊成毛毯了嗷呜"
  cooldown_seconds: 60
  weight: 1.0

