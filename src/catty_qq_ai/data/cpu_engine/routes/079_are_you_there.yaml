    - "{user_addr}怎么不理我"
    - "没回我"
    - "不说话了"
    - "沉默"
  responses:
    - "(凑过来) 嗷呜～{user_addr}不理猫猫? 笨猫委屈"
    - "哼～{user_addr}才是不说话的那个! 笨猫一直在"
    - "(撒娇) 别误会嘛~ 人家刚才在打盹 ฅฅ"
    - "嘿嘿～{user_addr}要笨猫主动? 哼, 偶尔好啦"
  cooldown_seconds: 60
  weight: 1.0

- name: ayt_call_back_001
