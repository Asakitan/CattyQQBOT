    - "哼～{user_addr}急了才找猫猫? 才不是计较呢"
    - "(凑近) 别慌! 笨猫陪{user_addr}解决, 蹭蹭"
    - "嘿嘿～紧急时候找笨猫, {user_addr}还是信任人家的"
