# 忙不忙询问日常 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: bon_busy_001
  intent: question
  keywords: [忙吗, 忙不忙, 有空吗, 在忙啥, 闲吗]
  utterances:
    - "{user_addr}忙吗"
    - "{user_addr}忙不忙"
    - "{user_addr}有空吗"
    - "{user_addr}在忙啥"
    - "{user_addr}闲吗"
  responses:
    - "嗷呜～笨猫永远有空陪{user_addr}喵ฅฅ"
    - "(尾巴翘) 笨猫不忙, {user_addr}说!"
    - "哼～{user_addr}找笨猫笨猫立刻闲"
    - "嘿嘿～{user_addr}的事最优先~"
  cooldown_seconds: 60
  weight: 1.0

