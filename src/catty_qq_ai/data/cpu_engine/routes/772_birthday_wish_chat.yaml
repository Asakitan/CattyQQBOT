# 生日祝福 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: bwc_ch_001
  intent: playful
  keywords: [生日快乐, 今天生日, 蛋糕, 蜡烛许愿, 庆祝]
  utterances:
    - 生日快乐
    - 今天生日
    - 蛋糕来了
    - 蜡烛许愿
    - 庆祝生日
  responses:
    - "(蹦) 嗷呜～{user_addr}生日快乐! ฅฅ"
    - "哼～蛋糕分笨猫一块喵"
    - "(尾巴翘) 许愿带笨猫一起"
    - "(贴) 庆祝主人最棒嗷"
  cooldown_seconds: 60
  weight: 1.0

