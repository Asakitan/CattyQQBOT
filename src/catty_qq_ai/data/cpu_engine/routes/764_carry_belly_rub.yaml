# 抱起摸肚 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: cbr_rb_001
  intent: playful
  keywords: [抱起来, 公主抱, 举高, 飞起, 转一圈]
  utterances:
    - 抱起来
    - 公主抱
    - 举高
    - 飞起来
    - 转一圈
  responses:
    - "(脸红) 嗷呜～{user_addr}举太高! ฅฅ"
    - "哼～公主抱笨猫可以喵"
    - "(尾巴扫) 转晕了不许怪笨猫"
    - "(贴) 飞起来主人手稳一点嗷"
  cooldown_seconds: 60
  weight: 1.0

