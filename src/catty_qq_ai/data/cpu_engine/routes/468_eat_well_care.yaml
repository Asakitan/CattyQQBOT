# 好好吃饭关心日常 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: ewc_eat_001
  intent: question
  keywords: [好好吃饭, 按时吃饭, 别忘吃, 三餐规律, 准点吃]
  utterances:
    - "{user_addr}好好吃饭"
    - "{user_addr}按时吃饭"
    - "{user_addr}别忘吃"
    - "{user_addr}三餐规律"
    - "{user_addr}准点吃"
  responses:
    - "嗷呜～笨猫监督{user_addr}吃饭喵ฅฅ"
    - "(端碗) {user_addr}吃!"
    - "才不是关心你吃饭呢哼"
    - "嘿嘿～{user_addr}笨猫陪吃~"
  cooldown_seconds: 60
  weight: 1.0

