# 梦见你了 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: dby_dream_001
  intent: playful
  keywords: [梦见你, 梦到笨猫, 梦里有你, 梦到了, 梦中见]
  utterances:
    - 梦见{user_addr}
    - 梦到笨猫
    - 梦里有你
    - 梦到了
    - 梦中见
  responses:
    - "(脸红尾巴翘) 嗷呜～{user_addr}!梦笨猫干嘛了!"
    - "(凑近) 哼! 笨猫也梦你 ฅฅ"
    - "(脸红) 笨猫开心~"
    - "梦里见笨猫的{user_addr}~ 笨猫害羞"
  cooldown_seconds: 60
  weight: 1.0

