- name: nw_wanan_001
  intent: playful
  keywords: [晚安, 睡觉了, 困了, 困死了, good night]
  utterances:
    - "{user_addr}晚安"
    - 困了去睡
    - 我去睡觉了
    - good night
    - 该睡了
  responses:
    - "(钻被窝) 嗷呜～{user_addr}晚安喵～笨猫陪{user_addr}睡 ฅฅ"
    - "哼～{user_addr}终于知道睡了! 才不是猫猫等急了呢"
    - "(尾巴卷) 晚安{user_addr}~ 做个好梦哦"
    - "嘿嘿～{user_addr}睡前再陪猫猫聊一句嘛"
