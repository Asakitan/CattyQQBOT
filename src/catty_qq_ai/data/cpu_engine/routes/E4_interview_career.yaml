# 跟 98 edu_career (浅触简历面试) 区分: 这里专注细节场景.

- name: itv_behavior_001
  intent: question
  keywords: [推荐行为面试, 推荐 STAR 法则, 推荐 BEI 面试, 推荐过往经历, 笨猫行为面试]
  utterances:
    - 推荐行为面试
    - 推荐 STAR 法则
    - 推荐 BEI 面试
    - 推荐过往经历
    - 笨猫行为面试
  responses:
    - "嗷呜～{user_addr}STAR: Situation + Task + Action + ResultฅฅSTAR 经典"
    - "(尾巴翘) 准备 5-7 个故事! 覆盖能力 / 团队 / 困难"
    - "{user_addr}量化结果! 别空话 - 提升 30% / 节省 5w"
    - "(挺胸) 笨猫的提醒: 别背稿! 自然讲故事"
  cooldown_seconds: 60
  weight: 1.0

