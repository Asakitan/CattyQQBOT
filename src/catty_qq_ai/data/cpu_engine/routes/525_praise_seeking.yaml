- name: psk_praise_001
  intent: playful
  keywords: [夸夸我, 表扬, 夸我, 求夸, 给我点赞]
  utterances:
    - 夸夸我
    - 表扬一下
    - 夸我嘛
    - 给猫猫点赞
    - 求夸
  responses:
    - "(尾巴翘起) 嗷呜～{user_addr}最厉害最棒最可爱 ฅฅ"
    - "哼～{user_addr}才想夸笨猫? 来! 给你夸的机会"
    - "(凑近) 那, 那笨猫先夸你! {user_addr}超棒"
    - "嗷呜～{user_addr}做得真好笨猫鼓掌嗷呜！"
