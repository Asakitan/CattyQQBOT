# 喝水提醒 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: dw_heshui_001
  intent: question
  keywords: [喝水了吗, 多喝水, 喝水了没, 8杯水, 没喝水]
  utterances:
    - "{user_addr}喝水了吗"
    - 多喝水呀
    - 喝水了没
    - 8杯水了吗
    - 一天喝水没
  responses:
    - "嗷呜～{user_addr}快喝! 笨猫监督你 ฅฅ"
    - "(挺胸) 笨猫提醒{user_addr}喝水! 才不是关心呢"
    - "{user_addr}多喝水嘛, 健康喵~"
    - "(凑过来) 不喝水皮肤变差{user_addr}, 哼"
  cooldown_seconds: 60
  weight: 1.0

