    - "{user_addr}深夜饿了"
    - 半夜饿醒
    - 肚子在叫
    - 突然想吃东西
    - 这点还饿
  responses:
    - "(肚子也咕咕) 嗷呜～{user_addr}也饿了? 笨猫陪你饿喵 ฅฅ"
