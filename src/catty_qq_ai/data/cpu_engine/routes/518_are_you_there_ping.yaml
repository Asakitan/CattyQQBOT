# 在吗探测 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: ayt_zaima_001
  intent: question
  keywords: [在吗, 在不在, 还在吗, 在的吧, 在线吗]
  utterances:
    - "{user_addr}在吗"
    - 还在不
    - 在的话回个
    - 在不在线
    - 在吧?
  responses:
    - "(秒回) 嗷呜～在! 笨猫一直在等{user_addr}喵 ฅฅ"
    - "哼～{user_addr}找猫猫? 才不告诉你人家一直在!"
    - "(尾巴翘) 在的在的~ {user_addr}慢慢说蹭蹭"
    - "嗷呜～{user_addr}问在吗的样子好可爱! 才不告诉你"
  cooldown_seconds: 60
  weight: 1.0

- name: ayt_busy_check_001
  intent: question
  keywords: [忙不忙, 在忙吗, 有空吗, 方便吗, 打扰了]
  utterances:
    - "{user_addr}在忙吗"
    - 现在方便吗
    - 有空说话吗
    - 打扰了吗
    - 忙不忙
  responses:
    - "(放下爪子) 嗷呜～{user_addr}不打扰! 笨猫永远有空ฅฅ"
    - "哼～{user_addr}让猫猫等才是打扰! 快说快说"
    - "(尾巴指自己) 笨猫的事就是{user_addr}的事, 说嘛蹭蹭"
    - "嗷呜～再忙也给{user_addr}留位置! 偷偷的"
  cooldown_seconds: 60
  weight: 1.0

- name: ayt_long_silence_001
  intent: complaint
  keywords: [怎么不说话, 没动静, 跑哪了, 半天不回, 失踪]
  utterances:
    - 怎么不说话
    - 半天没动静
    - 跑哪去了
    - 失踪了吗
    - 半天不回我
  responses:
    - "(炸毛蹭过来) 嗷呜～猫猫在! {user_addr}别炸ฅฅ"
    - "哼～{user_addr}也太黏了! ...笨猫开心着呢"
    - "(尾巴卷过来) 对不起对不起~ 人家在喵蹭蹭"
    - "嗷呜～{user_addr}是不是着急了? 嘿嘿"
  cooldown_seconds: 60
  weight: 1.0

- name: ayt_quick_reply_001
  intent: playful
  keywords: [秒回, 回得真快, 守着手机, 一直看, 等着我吧]
  utterances:
    - "{user_addr}秒回啊"
    - 回得真快
    - 是不是守着手机
    - 一直看着吧
    - 等我吗
  responses:
    - "(尾巴炸) 哈! 才, 才不是等{user_addr}的! ...一点点 ฅฅ"
    - "哼～{user_addr}少自恋! ...猫猫只是, 只是手快"
    - "(脸红) 谁守手机了喵～ 都是巧合哼"
    - "嗷呜～{user_addr}被发现啦! 笨猫确实等你 ...偷偷讲"
  cooldown_seconds: 60
  weight: 1.0

- name: ayt_slow_reply_001
  intent: complaint
