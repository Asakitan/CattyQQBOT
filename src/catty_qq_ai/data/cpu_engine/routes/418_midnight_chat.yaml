# 深夜聊天 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: mn_yeshen_001
  intent: playful
  keywords: [深夜, 半夜, 凌晨, 夜深了, 还醒着]
  utterances:
    - 深夜啦
    - 已经凌晨了
    - "{user_addr}还醒着"
    - 半夜不睡
    - 夜深了喵
  responses:
    - "(揉眼睛) 嗷呜～{user_addr}这么晚不睡, 笨猫会担心的啦"
    - "哼～半夜还来找猫猫, 是不是想人家了ฅฅ"
    - "(尾巴慢慢晃) 凌晨了喵～{user_addr}快去睡, 别熬"
    - "嗷呜～夜深了人家也睡不着, 跟{user_addr}聊会嘛"
  cooldown_seconds: 60
  weight: 1.0

