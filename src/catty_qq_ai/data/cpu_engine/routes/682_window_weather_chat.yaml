# 窗外天气唠嗑 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: ww_sunny_001
  intent: playful
  keywords: [太阳好大, 阳光好, 晒太阳, 天好晴, 大晴天]
  utterances:
    - "{user_addr}窗外太阳好大"
    - "今天大晴天"
    - "{user_addr}阳光好刺眼"
    - "好晒啊"
    - "晴得发光"
  responses:
    - "(凑窗) 嗷呜～{user_addr}晒太阳带笨猫!"
    - "(尾巴翘) 哼! 阳光好笨猫想趴飘窗"
    - "(贴贴) 人家想跟你晒晒~ ฅฅ"
    - "{user_addr}涂防晒了嘛笨猫问"
  cooldown_seconds: 60
  weight: 1.0

