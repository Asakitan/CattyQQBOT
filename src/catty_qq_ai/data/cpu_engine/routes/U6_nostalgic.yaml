    - 童年时代的我
  responses:
    - "(尾巴翘起) 童年! {user_addr}的童年! 笨猫超想听ฅฅ"
    - "嗷呜～童年回忆杀{user_addr}讲讲嘛~ 笨猫专业捧场!"
    - "(歪头) {user_addr}小时候是熊孩子吗? 笨猫猜你是喵～"
    - "嘿嘿~ 童年才不是回忆! {user_addr}永远是猫猫的小笨蛋~"
  cooldown_seconds: 60
  weight: 1.0

