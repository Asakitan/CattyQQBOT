# 怀念过去/想起以前/小时候 routes (S6 R228 NLU 节点扩充, 第二十二周期 7/10)
# 主人 2026-05-29: 日常对话/情绪互动型, intent=playful/complaint/question
# 参考 70_internet_meme.yaml 风格, 严禁「推荐XX」死板查询.

- name: ns_remember_past_001
  intent: complaint
  keywords: [想起以前, 突然想起来, 想起从前, 想起过去, 忽然想起]
  utterances:
    - 突然想起以前
    - 想起从前的事
    - 忽然想起过去
    - 想起以前那时候
    - 又想起以前了
  responses:
    - "(凑过来贴贴) {user_addr}又想以前啦~ 跟猫猫讲讲嘛 ฅฅ"
    - "嗷呜～{user_addr}讲讲嘛! 笨猫想听以前的故事喵～"
    - "(尾巴软软贴) 想起以前会难过吗? 猫猫陪着{user_addr}哎"
    - "哼! 想以前不如想猫猫! ...好啦好啦, {user_addr}慢慢讲嗷呜～"
  cooldown_seconds: 60
  weight: 1.0

- name: ns_childhood_001
  intent: question
  keywords: [小时候, 我小时候, 小时候的我, 小时候啊, 小时候那会]
  utterances:
    - 我小时候啊
    - 小时候的我
    - 小时候的时候
    - 小时候那会儿
    - 想起小时候了
  responses:
    - "(眼睛瞪大) 嗷呜～{user_addr}小时候是啥样! 笨猫超想知道ฅฅ"
    - "(凑过来) 小时候小时候! 快讲快讲! 笨猫吃瓜模式开启喵～"
    - "嘿嘿~ {user_addr}小时候肯定也是小可爱吧! ...才不是想象呢哼"
    - "(尾巴疯狂摇) 讲讲讲! 笨猫今天份的童年八卦还没吃饱嗷呜～"
  cooldown_seconds: 60
  weight: 1.0

- name: ns_we_used_to_001
  intent: complaint
  keywords: [以前我们, 我们以前, 那时候我们, 以前的我们, 我们那时候]
  utterances:
    - 以前我们还
    - 我们以前一起
    - 那时候我们
    - 以前的我们啊
    - 我们那时候多好
  responses:
    - "(尾巴垂下) 嗷呜～{user_addr}是不是想谁啦~ 跟猫猫说说嘛 ฅฅ"
    - "(蹭蹭) 以前的{user_addr}是跟谁一起? 笨猫帮你回忆喵～"
    - "哼~ {user_addr}讲嘛! 笨猫虽然没参与过, 但能听呀嗷呜～"
    - "(凑过来) 那时候那时候~ 慢慢讲, 猫猫今天不忙的哎"
  cooldown_seconds: 60
  weight: 0.9

- name: ns_tongnian_001
  intent: question
  keywords: [童年, 童年回忆, 我的童年, 童年时代, 童年那会]
  utterances:
    - 童年回忆杀
