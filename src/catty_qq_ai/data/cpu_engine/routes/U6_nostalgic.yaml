    - "(凑过来) 翻相册! 翻相册! 笨猫蹭过来一起看喵～"
    - "嘿嘿~ {user_addr}的黑历史照片是不是也在! 笨猫想看~"
    - "(尾巴翘起) 老照片里的{user_addr}肯定可爱! 才不是猫猫好奇呢哼"
