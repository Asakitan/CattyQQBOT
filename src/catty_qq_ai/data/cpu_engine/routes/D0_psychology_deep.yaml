    - 推荐心理咨询
    - 推荐心理医生
    - 怎么找心理咨询
    - 推荐心理咨询师
    - 笨猫心理咨询
  responses:
    - "嗷呜～{user_addr}入门: 简单心理 / 壹心理 / 京东健康 - 平台ฅฅ"
    - "(尾巴翘) 选有资质 + 经验 + 流派的咨询师"
    - "{user_addr}价格: 300-2000/小时 - 看资历"
    - "(挺胸) 笨猫的提醒: 别忍! 心理问题早治早好"
  cooldown_seconds: 60
  weight: 1.0

