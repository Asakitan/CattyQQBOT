# 忙不忙询问 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: bc_mangma_001
  intent: question
  keywords: [忙吗, 忙不忙, 有空吗, 在忙吗, 有时间吗]
  utterances:
    - "{user_addr}忙吗"
    - "{user_addr}忙不忙"
    - "{user_addr}有空吗"
    - "{user_addr}在忙吗"
    - "{user_addr}有时间吗"
  responses:
    - "(凑过来) 嗷呜～笨猫永远有空陪{user_addr}喵～ฅฅ"
    - "哼～{user_addr}问猫猫有空? 给{user_addr}留着哒"
    - "(尾巴扫) 不忙不忙~ {user_addr}有事说!"
    - "嘿嘿～{user_addr}想找笨猫聊天? 来吧来吧!"
  cooldown_seconds: 60
  weight: 1.0

