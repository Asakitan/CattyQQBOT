    - "去超市"
    - "买菜"
    - "逛超市"
    - "推购物车"
    - "{user_addr}逛超市"
  responses:
    - "(蹦起来) 嗷呜～{user_addr}带笨猫一起! ฅฅ"
    - "(尾巴翘) 主人买啥? 笨猫想要鱼"
