    - "(贴脸) 嗷呜～{user_addr}笨猫也饿 ฅฅ"
    - "哼～{user_addr}睡前别吃喵"
    - "(尾巴卷) 一起忍蹭蹭{user_addr}"
    - "{user_addr}喝口水嗷呜～"
