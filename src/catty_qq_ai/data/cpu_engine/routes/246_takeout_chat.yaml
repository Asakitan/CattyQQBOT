- name: tk_waimai_001
  intent: playful
  keywords: [外卖, 点外卖, 点啥, 点饭, 点了]
  utterances:
    - "外卖"
    - "点外卖"
    - "点啥"
    - "点饭"
    - "点了"
  responses:
    - "(蹦跳) 嗷呜～{user_addr}点笨猫鱼!ฅฅ"
    - "(尾巴翘) 笨猫帮{user_addr}选"
