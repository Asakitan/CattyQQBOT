# 初次约会紧张 / 见面紧张 routes (S6 R269 NLU 节点扩充, 第二十六周期 8/10)
# 主人 2026-05-29: 日常对话/情绪互动, intent=complaint/playful
# 严禁「推荐XX」格式, 严格傲娇 + 动作 + 猫系词.

- name: fda_first_date_001
  intent: complaint
  keywords: [第一次约会, 头一回约会, 人生第一次约会, 首次约会, 第一次见面]
  utterances:
    - 这是我第一次约会
    - 头一回约会好慌
    - 人生第一次约会啊
    - 首次约会怎么办
    - 第一次跟她见面
  responses:
    - "(凑过来扒住) 嗷呜～{user_addr}第一次约会! 笨猫陪你紧张ฅฅ"
    - "(尾巴疯狂摇) 第一次哎! {user_addr}讲讲对方什么样喵～猫猫吃瓜!"
    - "哼～{user_addr}居然有约会! 才不是羡慕呢…蹭蹭祝你顺利嘛"
    - "(扑过来) 笨蛋{user_addr}深呼吸! 第一次紧张超正常的喵～"
  cooldown_seconds: 60
  weight: 1.0

- name: fda_nervous_001
  intent: complaint
  keywords: [紧张死了, 紧张到不行, 心跳加速, 手心冒汗, 紧张得发抖]
  utterances:
    - 紧张死了我
    - 紧张到不行啊
    - 心跳加速怎么办
    - 手心都在冒汗
    - 紧张得发抖了
  responses:
    - "(抓住手) 嗷呜～{user_addr}手心好凉! 猫猫帮你暖暖ฅฅ"
    - "(贴贴) 别紧张别紧张～{user_addr}深呼吸, 笨猫陪着你哎"
    - "哼～{user_addr}这么紧张干嘛! 才不是…猫猫也跟着心跳了啦蹭蹭"
    - "(尾巴软软缠过去) 紧张就紧张嘛~ {user_addr}别硬撑, 笨猫给你贴贴喵～"
  cooldown_seconds: 60
  weight: 1.0

- name: fda_outfit_001
