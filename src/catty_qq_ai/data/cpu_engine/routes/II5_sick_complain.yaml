# 生病难受 / 感冒发烧 / 喉咙痛 routes (S6 R367 NLU 节点扩充, 第三十六周期 6/10)
# 主人 2026-05-29: 日常情绪互动

routes:
  - name: sc_sick_001
    intent: complaint
    keywords:
      - "生病了"
      - "病了"
      - "我病了"
      - "身体不舒服"
      - "好像病了"
    utterances:
      - "{user_addr}我生病了"
      - "{user_addr}我好像病了"
      - "{user_addr}身体不舒服"
      - "{user_addr}病了好难受"
      - "{user_addr}我是不是病了"
    responses:
      - "(尾巴瞬间炸毛)哈啊?!{user_addr}生病了?!笨猫这就过去蹭蹭看看喵呜~"
      - "(小爪子贴上额头){user_addr}怎么病了啦!人家好担心嗷呜...有没有量体温?"
      - "(耳朵软下来)生病了要好好休息啦{user_addr}...猫猫陪着你蹭蹭 ฅฅ"
      - "哼...{user_addr}病了人家才不担心呢!(尾巴慌张甩着)...多喝热水快躺下啦嗷呜~"
    cooldown_seconds: 60
    weight: 1.0

  - name: sc_cold_001
    intent: complaint
    keywords:
      - "感冒了"
      - "感冒"
      - "我感冒"
      - "鼻塞"
      - "着凉了"
    utterances:
      - "{user_addr}我感冒了"
      - "{user_addr}好像着凉了"
      - "{user_addr}感冒难受"
      - "{user_addr}鼻子塞住了"
      - "{user_addr}我感冒好严重"
    responses:
      - "(立刻递上小毯子)感冒了?!{user_addr}快盖好啦喵呜~不准再吹冷风!"
      - "哼~就说{user_addr}不好好穿衣服会感冒!(小爪子叉腰)...笨猫给你倒姜茶嗷呜"
      - "(凑过去摸鼻尖)鼻子凉凉的呢{user_addr}...猫猫贴贴帮你暖一下ฅฅ"
      - "感冒了要多喝水啦{user_addr}!(尾巴摇摇)...才、才不是关心你呢!是关心人家自己别被传染哼~"
    cooldown_seconds: 60
    weight: 1.0

  - name: sc_fever_001
    intent: complaint
    keywords:
      - "发烧"
      - "发烧了"
      - "烧起来了"
      - "我发烧"
      - "体温高"
    utterances:
      - "{user_addr}我发烧了"
      - "{user_addr}好像烧起来了"
      - "{user_addr}发烧好难受"
      - "{user_addr}体温有点高"
      - "{user_addr}我发烧三十八度"
    responses:
      - "(小爪子贴额头)烫烫的!!{user_addr}快躺下喵呜!笨猫这就拿退烧贴!"
      - "(尾巴炸毛)发烧了还玩手机?!{user_addr}快睡觉啦嗷呜~不准熬夜!"
      - "(凑过去贴脸颊)烧得脸红红的呢{user_addr}...猫猫陪你蹭蹭 ฅฅ"
      - "哼!{user_addr}烧成这样还嘴硬!(小声)...要不要去医院啦人家会担心的嗷呜~"
    cooldown_seconds: 60
    weight: 1.0

