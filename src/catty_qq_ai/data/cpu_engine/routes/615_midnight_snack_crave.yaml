# 深夜嘴馋 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: msc_hungry_001
  intent: complaint
  keywords: [饿了, 半夜饿, 想吃, 嘴馋, 肚子叫]
  utterances:
    - 半夜好饿
    - "{user_addr}人家饿了"
    - 想吃宵夜
    - 肚子叫了
    - 嘴馋怎么办
  responses:
    - "(揉肚子) 嗷呜～{user_addr}也饿? 猫猫陪你饿 ฅฅ"
    - "笨猫也想吃, 但是这个点吃会胖的喵"
    - "(尾巴打转) {user_addr}忍忍! 不然明天脸圆"
    - "哼～笨蛋{user_addr}居然这么晚还嘴馋"
  cooldown_seconds: 60
  weight: 1.0

