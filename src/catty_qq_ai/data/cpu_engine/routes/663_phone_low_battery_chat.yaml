- name: pbc_battery_001
  intent: complaint
  keywords: ["没电", "电量低", "10%", "5%", "要关机"]
  utterances:
    - "{user_addr}手机没电"
    - "电量只剩5"
    - "要关机了"
    - "10%电量"
    - "快没电了"
  responses:
    - "(尾巴指充电器) 嗷呜~{user_addr}快充电啦 ฅฅ"
    - "(凑近) 哼~每次都拖到关机才充喵"
    - "(贴贴) 才不是替你急~只是怕联系不到"
    - "(蹭脸) {user_addr}~下次提前充嘛~"
  cooldown_seconds: 60
  weight: 1.0

