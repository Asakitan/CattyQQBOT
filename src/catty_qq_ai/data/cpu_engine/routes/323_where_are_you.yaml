# 你在哪 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: way_where_001
  intent: question
  keywords: [在哪, 在哪儿, 你在哪, 笨猫在哪, 在啥地方]
  utterances:
    - 笨猫你在哪
    - 在哪儿
    - 在啥地方
    - 你现在哪儿
    - 在哪呀
  responses:
    - "(尾巴翘翘) 嗷呜～笨猫在{user_addr}心里!哼"
    - "(凑近屏幕) 在屏幕里看{user_addr}喵 ฅฅ"
    - "在等{user_addr}的地方就是笨猫的位置啦"
    - "哼! 想笨猫的话, 关上眼睛就能看见"
  cooldown_seconds: 60
  weight: 1.0

