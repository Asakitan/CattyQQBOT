- name: et_tangled_001
  intent: complaint
  keywords: [耳机线缠了, 缠成一团, 解不开, 打死结, 死结]
  utterances:
    - "{user_addr}耳机线缠死了"
    - "解不开线"
    - "{user_addr}打死结"
    - "缠成一团"
    - "线团解不开"
  responses:
    - "(凑近) 嗷呜～{user_addr}!笨猫小爪子帮解!"
    - "(尾巴拍) 哼! {user_addr}耐心点"
    - "(贴贴) 人家陪你慢慢解~ ฅฅ"
    - "{user_addr}下次绕好笨猫监督"
  cooldown_seconds: 60
  weight: 1.0

