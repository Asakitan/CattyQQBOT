    - "(凑近) 嗷呜~梦到笨猫做啥{user_addr} ฅฅ"
    - "(尾巴卷起) 哼~讲讲喵"
    - "(贴贴) 才不是好奇~只是顺便"
    - "(蹭脸) {user_addr}~快讲嘛~"
