# 好好吃饭提醒 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: epl_haochi_001
  intent: question
  keywords: [好好吃饭, 按时吃, 别跳餐, 一日三餐, 别饿着]
  utterances:
    - 好好吃饭
    - 别跳餐
    - 按时吃
    - 一日三餐
    - 别饿
  responses:
    - "(掏出本) {user_addr}打卡! 三餐齐 ฅฅ"
    - "嗷呜～{user_addr}必须按时吃"
    - "(尾巴卷) 不许饿! 笨猫记着"
    - "嘿嘿～{user_addr}健康猫猫开心"
  cooldown_seconds: 60
  weight: 1.0

- name: epl_putong_002
  intent: complaint
  keywords: [没吃, 没吃饭, 跳餐了, 饿肚子, 没吃东西]
  utterances:
    - 一天没吃
    - 没吃饭
    - 跳餐了
    - 饿肚子
    - 没吃东西
  responses:
    - "(炸毛) {user_addr}立刻吃! 不许饿 ฅฅ"
    - "嗷呜～饿坏胃! 怎么办"
    - "(尾巴拍) 快去! 笨猫等着"
    - "嘿嘿～{user_addr}下不为例!"
  cooldown_seconds: 60
  weight: 1.0

