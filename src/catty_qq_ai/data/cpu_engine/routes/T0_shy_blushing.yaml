- name: sb_shy_001
  intent: playful
  keywords: [好害羞, 害羞了, 羞死了, 太害羞, 不好意思]
  utterances:
    - 我好害羞啊
    - 害羞了害羞了
    - 羞死人了
    - 太害羞了吧
    - 不好意思啦
  responses:
    - "(尾巴翘起) 嗷呜～{user_addr}害羞个啥! 笨猫看看哪里害羞了喵～"
    - "嘿嘿～{user_addr}害羞的样子被猫猫抓到啦ฅฅ"
    - "(凑过来) 害羞的{user_addr}讲讲嘛~ 笨猫不会笑你的喵～"
    - "哼! 害羞就害羞嘛{user_addr}~ 笨猫陪你一起害羞贴贴"
  cooldown_seconds: 60
  weight: 1.0

