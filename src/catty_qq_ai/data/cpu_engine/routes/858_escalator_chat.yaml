# 自动扶梯 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: esc_chat_001
  intent: playful
  keywords: [自动扶梯, 滚梯, 上扶梯, 下扶梯, 扶梯运行]
  utterances:
    - "自动扶梯"
    - "上扶梯"
    - "下扶梯"
    - "滚梯"
    - "{user_addr}扶梯"
  responses:
    - "(尾巴翘) 嗷呜～{user_addr}抓好扶手喵ฅฅ"
    - "(凑过来) 笨猫跟你一起站"
    - "哼～别在扶梯上跑笨蛋"
    - "(贴贴) 站稳, 笨猫怕你摔嗷"
  cooldown_seconds: 60
  weight: 1.0

