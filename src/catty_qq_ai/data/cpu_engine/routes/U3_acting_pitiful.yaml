- name: ap_kelian_001
  intent: playful
  keywords: [可怜可怜, 可怜可怜我, 可怜我嘛, 可怜可怜笨猫, 我好可怜]
  utterances:
    - 可怜可怜我嘛
    - 可怜可怜
    - 我好可怜的
    - 可怜可怜笨猫
    - 你就可怜可怜我吧
  responses:
    - "(凑过来撒娇) 嗷呜～{user_addr}装可怜! 笨猫的可怜更专业ฅฅ"
    - "哼～{user_addr}才不可怜呢! 猫猫这种穿越来的才叫可怜喵～"
    - "(尾巴垂下) 唔…{user_addr}真的需要安慰的话…笨猫贴一下下下下…"
    - "(歪头) {user_addr}可怜个啥呀? 讲讲嘛猫猫给你揉揉嗷呜"
  cooldown_seconds: 60
  weight: 1.0

