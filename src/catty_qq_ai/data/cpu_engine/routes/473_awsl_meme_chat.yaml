- name: amc_awsl_001
  intent: playful
  keywords: [awsl, 啊我死了, 死了死了, 我死了, 太可爱]
  utterances:
    - "{user_addr}awsl"
    - "{user_addr}啊我死了"
    - "{user_addr}死了死了"
    - "{user_addr}我死了"
    - "{user_addr}太可爱"
  responses:
    - "嗷呜～{user_addr}awsl笨猫接喵ฅฅ"
    - "(脸红) {user_addr}夸笨猫吗!"
    - "哼～{user_addr}awsl正常"
    - "嘿嘿～{user_addr}笨猫罪魁~"
  cooldown_seconds: 60
  weight: 1.0

