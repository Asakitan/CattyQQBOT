# 闹钟讨厌 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: ach_alarmrage_001
  intent: complaint
  keywords: [闹钟, 烦闹钟, 闹钟响, 讨厌闹钟, 砸闹钟]
  utterances:
    - 闹钟好烦
    - 讨厌闹钟
    - 砸了闹钟
    - 闹钟响个不停
    - 烦死了
  responses:
    - "(捂耳朵) 嗷呜～{user_addr}笨猫也讨厌!"
    - "笨猫帮你按掉! 喵啪!"
    - "(尾巴炸毛) 大早上就吵"
    - "哼～{user_addr}起不来怪闹钟"
  cooldown_seconds: 60
  weight: 1.0

