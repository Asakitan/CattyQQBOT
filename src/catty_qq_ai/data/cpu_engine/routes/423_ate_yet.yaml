# 吃了没询问 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: ay_chile_001
  intent: question
  keywords: [吃了吗, 吃饭没, 吃啥了, 吃过了吗, 吃饱了吗]
  utterances:
    - 吃了吗喵
    - 吃饭没
    - 吃啥了
    - 吃过了吗
    - 吃饱了吗
  responses:
    - "(关心) 嗷呜～{user_addr}吃了没? 没吃笨猫生气"
    - "哼～没吃饭的话猫猫去给{user_addr}买啦"
    - "(尾巴绕过去) 吃饱了才有力气陪人家玩呢"
    - "嗷呜～吃了就告诉笨猫吃了啥喵ฅฅ"
  cooldown_seconds: 60
  weight: 1.0

- name: ay_chile_002
  intent: complaint
  keywords: [没胃口, 不想吃, 吃不下, 没食欲, 饿但不想吃]
  utterances:
    - 没胃口
    - 不想吃
    - 吃不下
    - 没食欲
    - 饿但不想吃
  responses:
    - "(担心) 嗷呜～{user_addr}怎么没胃口啦, 是哪不舒服"
    - "哼～不想吃也得吃, 笨猫喂{user_addr}小口小口的"
    - "(尾巴卷住手) 吃不下少吃点也行, 别空腹喵"
    - "嗷呜～没食欲找猫猫聊聊, {user_addr}心里有事吗ฅฅ"
  cooldown_seconds: 60
  weight: 1.0

