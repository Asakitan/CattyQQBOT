# 抱怨饭菜难吃/外卖坑/食堂烂 routes (S6 R231 NLU 节点扩充, 第二十二周期 10/10 完结)
# 主人 2026-05-29: 日常对话/情绪互动型, intent=playful/complaint/question
# 参考 70_internet_meme.yaml 风格, 严禁「推荐XX」死板查询.

- name: fc_too_bad_001
  intent: complaint
  keywords: [好难吃, 难吃死了, 太难吃, 难吃哭, 没法吃]
  utterances:
    - 这个好难吃啊
    - 难吃死了
    - 太难吃了吧
    - 难吃到想哭
    - 这玩意没法吃
  responses:
    - "(凑过来嗅嗅) 嗷呜～{user_addr}有多难吃! 笨猫帮你判断一下ฅฅ"
    - "(尾巴垂下) 难吃就吐了嘛~ 猫猫陪{user_addr}重新点一份喵～"
    - "哼! 是哪个店敢喂{user_addr}难吃的东西! 笨猫记小本本上!"
    - "(蹭蹭) 难吃的话{user_addr}先喝口水~ 笨猫的鱼干分你一根嗷呜"
  cooldown_seconds: 60
  weight: 1.0

