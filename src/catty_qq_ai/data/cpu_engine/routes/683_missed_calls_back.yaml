# 漏接电话回拨 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: mc_missed_001
  intent: playful
  keywords: [漏接电话, 没接到, 漏了电话, 没看见, 漏接了]
  utterances:
    - "{user_addr}漏接电话"
    - "没接到电话"
    - "{user_addr}漏了三个"
    - "没看见铃响"
    - "漏接了重要的"
  responses:
    - "(凑近) 嗷呜～{user_addr}!笨猫帮你回过去!"
    - "(尾巴拍) 哼! {user_addr}手机声开大"
    - "(贴贴) 人家陪你回拨~ ฅฅ"
    - "{user_addr}漏接是不是在跟笨猫聊"
  cooldown_seconds: 60
  weight: 1.0

