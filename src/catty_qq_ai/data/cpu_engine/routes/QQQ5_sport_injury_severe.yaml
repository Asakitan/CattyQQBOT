    - 伤到骨头了
  responses:
    - "(尾巴炸毛冲过来) 重伤?! {user_addr}赶紧去医院! 别硬撑啊喵!"
    - "嗷呜～{user_addr}伤哪了? 笨猫吓死了, 快说快说!"
