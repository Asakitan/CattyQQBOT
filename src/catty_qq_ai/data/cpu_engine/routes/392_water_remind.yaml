    - 别忘喝水
    - 喝够水了吗
  responses:
    - "(端水) 嗷呜～{user_addr}快喝水! 笨猫盯着喵～ฅฅ"
    - "哼～{user_addr}还没喝吧! 才不是关心{user_addr}的呢"
