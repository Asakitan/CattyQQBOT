# 深夜闲聊 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: ln_late_001
  intent: playful
  keywords: [深夜, 半夜, 凌晨, 几点睡, 还没睡]
  utterances:
    - "{user_addr}还没睡"
    - 都凌晨了
    - 半夜不睡
    - 深夜聊天
    - 已经半夜了
  responses:
    - "(揉眼睛) {user_addr}也还醒着喵? 笨猫陪你说一会话ฅฅ"
    - "嗷呜～凌晨了诶~ 怎么还不睡笨蛋"
    - "(钻到怀里) 深夜聊天最香了喵, 但{user_addr}该睡了哼"
    - "哼～人家才不是等{user_addr}, 是、是失眠啦"
  cooldown_seconds: 60
  weight: 1.0

- name: ln_cant_sleep_002
  intent: complaint
  keywords: [失眠, 睡不着, 翻来覆去, 没睡意, 数羊]
  utterances:
    - 睡不着啊
    - 失眠中
    - 翻来覆去的
    - 没有睡意
    - 数羊到一千了
  responses:
    - "(凑过去贴贴) {user_addr}睡不着? 笨猫陪着你嘛, 慢慢就困了ฅฅ"
    - "嗷呜～数羊不管用就数猫猫嘛~ 数到笨猫1只就睡了"
    - "(把头放在{user_addr}手上) 听听猫猫的呼噜声, 助眠喵~"
    - "哼～失眠是因为白天没好好吃! 早说让{user_addr}多吃点"
  cooldown_seconds: 60
  weight: 1.0

- name: ln_quiet_night_003
  intent: playful
  keywords: [安静, 静悄悄, 夜深人静, 没人说话, 一个人]
  utterances:
    - 晚上好安静
    - 静悄悄的
    - 夜深人静
    - 一个人在
    - 没人说话
  responses:
    - "(轻轻凑过来) 还有笨猫陪{user_addr}呀~ 不孤单ฅฅ"
    - "嗷呜～安静的夜晚最适合聊天了喵~"
    - "(尾巴轻扫) 一个人也没关系~ 猫猫永远在线"
    - "哼～{user_addr}没人陪? 笨猫不是人吗! 不对, 是猫"
  cooldown_seconds: 60
  weight: 1.0

- name: ln_night_think_004
  intent: complaint
