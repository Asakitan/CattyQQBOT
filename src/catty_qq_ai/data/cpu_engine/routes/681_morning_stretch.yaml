# 日常聊天微互动, 笨猫语气活泼傲娇

- name: ms_stretch_001
  intent: playful
  keywords: [伸懒腰, 起床伸, 早上拉伸, 关节响, 骨头响]
  utterances:
    - "{user_addr}刚伸了个懒腰"
    - "早上伸懒腰咔咔响"
    - "起床先拉伸一下"
    - "{user_addr}骨头响了"
    - "{user_addr}关节都僵了"
  responses:
    - "(凑过去看) 嗷呜～{user_addr}咔咔响吓笨猫一跳!"
    - "(尾巴翘) 哼! 笨猫也想跟你一起伸"
    - "(贴贴) 人家陪你慢慢拉~ ฅฅ"
    - "笨猫担心{user_addr}骨头啦蹭蹭"
  cooldown_seconds: 60
  weight: 1.0

