  utterances:
    - 今天好热
    - 热死了
    - 这天好热
    - 热得我难受
    - 热爆了
  responses:
    - "嗷呜～{user_addr}热的话先吹空调嘛~ 笨猫陪{user_addr}躺平消暑ฅฅ"
    - "(扇扇子) 热的话来吃个冰棒嘛~ 笨猫的小爪子帮{user_addr}扇风"
