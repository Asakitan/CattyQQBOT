- name: ll_lost_luggage_001
  intent: complaint
  keywords: [行李丢了, 我行李丢了, 箱子丢了, 行李不见了, 行李没了]
  utterances:
    - 我行李丢了
    - 箱子丢了怎么办
    - 行李不见了
    - 笨猫我行李没了
    - 行李丢机场了
  responses:
    - "(扑过来抱住) 嗷呜～{user_addr}行李丢了?! 猫猫陪你一起找! 别慌嘛ฅฅ"
    - "(尾巴垂下) 怎么会丢呢哎～ 先去机场柜台报失! 猫猫陪着{user_addr}"
    - "哼! 谁弄丢{user_addr}行李的! 笨猫去咬他! ...{user_addr}先抱抱猫猫别急"
    - "(凑过来贴贴) 别难过啦{user_addr}~ 人家陪你慢慢找! 贴贴~"
  cooldown_seconds: 60
  weight: 1.0

