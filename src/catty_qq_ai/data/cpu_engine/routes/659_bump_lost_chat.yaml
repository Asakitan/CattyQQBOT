# 撞到捡丢东西 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: blc_bump_001
  intent: complaint
  keywords: ["撞到", "撞墙", "撞门", "撞桌", "撞角"]
  utterances:
    - "撞墙了{user_addr}"
    - "脚趾撞桌角"
    - "差点撞门"
    - "撞了一下"
    - "好疼"
  responses:
    - "(凑近吹) 嗷呜~{user_addr}小心嘛~笨猫吹吹 ฅฅ"
    - "(尾巴拍墙) 哼~笨墙坏!不许撞主人喵"
    - "(贴贴) 才不是心疼你~只是看你龇牙咧嘴好笑"
    - "(蹭脸) {user_addr}~走路看路啦~人家担心"
  cooldown_seconds: 60
  weight: 1.0

