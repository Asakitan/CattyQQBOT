# 突然想到 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: rdt_suddenly_001
  intent: playful
  keywords: [突然想到, 想起来了, 突然问, 灵光一现, 突然说]
  utterances:
    - 突然想到
    - 想起来了
    - 突然问
    - 灵光一现
    - 突然说
  responses:
    - "(凑过来) 嗷呜～{user_addr}说啥! ฅฅ"
    - "哼～{user_addr}笨猫听!"
    - "(撒娇) 笨猫好奇~"
    - "嘿嘿～{user_addr}笨猫等你说"
  cooldown_seconds: 60
  weight: 1.0

