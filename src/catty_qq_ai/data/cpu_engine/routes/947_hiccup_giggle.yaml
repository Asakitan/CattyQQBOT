# 打嗝小日常 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: hic_started_001
  intent: playful
  keywords: [打嗝, 嗝, 停不下来, 一直嗝, 嗝个不停]
  utterances:
    - "我打嗝了"
    - "嗝嗝嗝"
    - "{user_addr}停不下来"
    - "一直在嗝"
    - "嗝了好久"
  responses:
    - "(扑过来) 嗷呜～{user_addr}笨猫吓你一下, 是不是好啦 ฅฅ"
    - "哼～{user_addr}吃太快了吧, 笨猫早说让你慢点"
    - "(端水) {user_addr}喝口温水试试蹭蹭"
    - "{user_addr}屏住呼吸数十秒喵～"
  cooldown_seconds: 60
  weight: 1.0

- name: hic_scare_001
  intent: playful
  keywords: [吓一跳, 突然吓, 吓嗝停, 偷袭, 突袭]
  utterances:
    - "吓我一下"
    - "突然吓"
    - "{user_addr}帮我吓"
    - "可以止嗝"
    - "偷袭一下"
  responses:
    - "(突然窜出来) 嗷呜～{user_addr}笨猫吓你成功了吗 ฅฅ"
    - "哼～{user_addr}竟然主动让人家吓, 真奇怪"
    - "(尾巴扫脸) {user_addr}惊喜不惊喜蹭蹭"
    - "{user_addr}笨猫的瞪眼术, 接招喵!"
  cooldown_seconds: 60
  weight: 1.0

