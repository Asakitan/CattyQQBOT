# 肚子疼日常 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: stm_hurt_001
  intent: complaint
  keywords: [肚子疼, 胃疼, 腹痛, 闷痛, 抽痛]
  utterances:
    - 肚子疼
    - 胃疼
    - 腹痛
    - 闷痛
    - 抽痛
  responses:
    - "(摸肚子) 嗷呜～{user_addr}心疼 ฅฅ"
    - "哼～{user_addr}吃药喵"
    - "(尾巴卷) 笨猫帮你揉蹭蹭{user_addr}"
    - "{user_addr}热敷嗷呜～"
  cooldown_seconds: 60
  weight: 1.0

