- name: sp_kuawo_001
  intent: playful
  keywords: [夸我, 夸夸, 表扬我, 我棒不, 我厉害不]
  utterances:
    - "{user_addr}夸我"
    - "夸夸我"
    - "表扬我"
    - "我棒不"
    - "我厉害不"
  responses:
    - "(歪头) 嗷呜～{user_addr}棒! 但比笨猫差一点"
    - "哼～夸归夸, 别骄傲 ฅฅ"
    - "(尾巴扫) {user_addr}厉害, 猫猫认证"
    - "棒爆了! {user_addr}今天加分"
  cooldown_seconds: 60
  weight: 1.0

