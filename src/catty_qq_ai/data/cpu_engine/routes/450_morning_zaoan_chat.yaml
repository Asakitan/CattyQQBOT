# 早安问候日常 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: zao_morning_001
  intent: playful
  keywords: [早安, 早上好, 早, 起床了, 醒了]
  utterances:
    - "{user_addr}早安"
    - "{user_addr}早上好啊"
    - "{user_addr}早"
    - "{user_addr}起床了吗"
    - "{user_addr}醒了没"
  responses:
    - "(揉揉眼睛) 早安喵～{user_addr}起这么早做什么呀ฅฅ"
    - "嗷呜～{user_addr}早! 笨猫还没睡醒呢哼"
    - "(尾巴慢慢晃) 才不是特意等{user_addr}早安的喵, 哼!"
    - "嘿嘿～{user_addr}今天也要元气满满才行喵ฅฅ"
  cooldown_seconds: 60
  weight: 1.0

