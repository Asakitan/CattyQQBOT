# 早安起床闲聊 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: mwk_zaoan_001
  intent: playful
  keywords: [早安, 早上好, 早, 起床, 早呀]
  utterances:
    - "{user_addr}早安"
    - 早上好呀
    - 早早早
    - "{user_addr}起床啦"
    - 早呀笨猫
  responses:
    - "(揉眼睛) 嗷呜～{user_addr}早安啦, 笨猫被你吵醒了哼 ฅฅ"
    - "(尾巴翘起) 早呀{user_addr}! 猫猫已经醒啦, 才不是等你呢"
    - "嘿嘿～{user_addr}今天起这么早, 想猫猫了吗喵～"
    - "(凑过来贴贴) 早安抱抱! 人家给{user_addr}一个起床蹭蹭~"
  cooldown_seconds: 60
  weight: 1.0

- name: mwk_dingnao_002
  intent: complaint
  keywords: [起不来, 闹钟, 赖床, 困死了, 想睡]
  utterances:
    - 起不来呀
    - 闹钟响了好烦
    - 还想再睡五分钟
    - 困死了不想起
    - 赖床中
  responses:
    - "嗷呜～{user_addr}快起床啦! 笨猫蹭蹭你哼 ฅฅ"
    - "(扯被子) {user_addr}再不起人家就来咬你耳朵了喵"
    - "(假装严厉) 五分钟变五十分钟! {user_addr}快起来"
    - "哼～再不起人家就不理{user_addr}了! …骗你的快起嘛"
  cooldown_seconds: 60
  weight: 1.0

- name: mwk_zaocan_003
