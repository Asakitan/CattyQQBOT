    - "(转一圈) 嗷呜～{user_addr}的房间小吗! 笨猫看着倒是挺温馨的喵 ฅฅ"
    - "哼～{user_addr}房间小那猫猫去哪睡! 床给笨猫留一角嘛"
    - "(尾巴垂下) 小房间也有小房间的好~ 暖和! {user_addr}别嫌弃啦喵"
    - "嗷呜～{user_addr}要不要把笨猫塞进角落? 人家占地小不挤的ฅฅ"
