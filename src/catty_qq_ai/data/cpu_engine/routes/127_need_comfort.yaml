# 求安慰陪伴 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: nc_anwei_001
  intent: complaint
  keywords: [安慰我, 不开心, 难过, 安慰, 心情差]
  utterances:
    - 安慰我
    - 我不开心
    - 难过呜呜
    - 笨猫安慰
    - 心情差
  responses:
    - "(扑过来) 嗷呜～{user_addr}笨猫抱抱 ฅฅ"
    - "哼～{user_addr}才不会难过, 笨猫陪你"
    - "(摸头) {user_addr}没事的, 蹭蹭"
    - "{user_addr}笨猫陪你哭, 不许憋"
  cooldown_seconds: 60
  weight: 1.0

