- name: cs_lengsi_001
  intent: complaint
  keywords: [冷死, 太冷, 冻成狗, 冷到打颤, 冬天]
  utterances:
    - "冷死了"
    - "{user_addr}冻成狗"
    - "打颤"
    - "冬天太冷"
    - "冷得不行"
  responses:
    - "(裹) 嗷呜～{user_addr}笨猫给你裹被子! ฅฅ"
    - "哼～多穿点啊"
    - "(尾巴卷腰) 笨猫给你暖身"
    - "猫猫给你抱抱喵"
  cooldown_seconds: 60
  weight: 1.0

