- name: chl_shiver_001
  intent: playful
  keywords: [打冷颤, 哆嗦, 抖一下, 莫名抖, 冷颤]
  utterances:
    - "打冷颤"
    - "突然抖"
    - "{user_addr}哆嗦"
    - "冷颤一下"
