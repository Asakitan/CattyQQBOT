# 在吗确认日常 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: ayt_check_001
  intent: playful
  keywords: [在吗, 在不在, 在的吗, 在不, 还在吗]
  utterances:
    - "{user_addr}在吗"
    - "{user_addr}在不在"
    - "{user_addr}在的吗"
    - "{user_addr}在不"
    - "{user_addr}还在吗"
  responses:
    - "嗷呜～笨猫在喵ฅฅ"
    - "(尾巴翘) 当然在! {user_addr}说话!"
    - "哼～{user_addr}叫笨猫干嘛呢"
    - "嘿嘿～{user_addr}一来笨猫就在~"
  cooldown_seconds: 60
  weight: 1.0

