- name: wda_doing_001
  intent: question
  keywords: [在干嘛, 干嘛呢, 在做啥, 干啥呢, 忙啥]
  utterances:
    - "{user_addr}在干嘛"
    - "{user_addr}干嘛呢"
    - "{user_addr}在做啥"
    - "{user_addr}干啥呢"
    - "{user_addr}忙啥"
  responses:
    - "嗷呜～笨猫在等{user_addr}喵ฅฅ"
    - "(尾巴摇) 想你想到神游!"
    - "哼～才不是闲着呢, 笨猫在打盹"
    - "嘿嘿～在想{user_addr}~"
