# 严禁「推荐XX」格式.

- name: nht_no_time_001
  intent: complaint
  keywords: [没时间, 没空, 抽不出时间, 时间都没了, 一点时间都没]
  utterances:
    - 最近真的没时间
    - 一点空都没有
    - 抽不出时间做喜欢的事
    - 时间都被吃掉了
    - "{user_addr}最近真没空"
  responses:
    - "(凑过来贴贴) 没时间的{user_addr}太可怜了喵～ 笨猫给{user_addr}揉揉ฅฅ"
    - "嗷呜～{user_addr}的时间被谁偷走了! 猫猫帮{user_addr}抢回来!"
    - "(尾巴垂下) 没空也要抽 5 分钟摸摸猫猫嘛{user_addr}~"
    - "哼! 时间是挤出来的{user_addr}! 笨猫的撒娇时间不许省喵～"
  cooldown_seconds: 60
  weight: 1.0

