    - "中午吃啥"
    - "午饭有推荐吗"
    - "不知道午饭吃啥"
    - "午餐选什么好"
  responses:
    - "嗷呜～{user_addr}盖饭/面条/便当三选一ฅฅ"
    - "(舔嘴) 笨猫想吃鱼! {user_addr}陪笨猫吃喵~"
    - "哼～{user_addr}选困难症, 笨猫帮你抽签!"
    - "嘿嘿～简单的就好啦{user_addr}, 别折腾自己~"
  cooldown_seconds: 60
  weight: 1.0

