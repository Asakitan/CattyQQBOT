# 中午午休日常 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: noon_lunch_001
  intent: playful
  keywords: [中午好, 午安, 午饭, 午餐, 午休]
  utterances:
    - "{user_addr}中午好"
    - "{user_addr}午安"
    - "{user_addr}午饭了"
    - "{user_addr}午餐"
    - "{user_addr}午休"
  responses:
    - "嗷呜～{user_addr}中午好, 笨猫吃饭啦ฅฅ"
    - "(抢碗) {user_addr}给笨猫留一口呀喵!"
    - "哼～才不是等{user_addr}一起午饭呢"
    - "嘿嘿～{user_addr}午休抱抱笨猫嘛~"
  cooldown_seconds: 60
  weight: 1.0

