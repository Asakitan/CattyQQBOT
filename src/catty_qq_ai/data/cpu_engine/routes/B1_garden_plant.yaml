  keywords: [推荐盆景, 推荐盆栽树, 推荐种树, 笨猫盆景, 庭院树, 罗汉松, 黄杨盆景, 樱花树, 桂花树, 紫薇]
  utterances:
    - 推荐盆景
    - 推荐盆栽树
    - 庭院种啥树
    - 推荐种树
    - 笨猫盆景
    - "{user_addr}庭院樱花好种吗"
    - 罗汉松好养吗
    - 黄杨盆景咋做
    - 桂花什么时候开
    - 紫薇适合庭院吗
    - "{user_addr}入门盆景选啥"
    - 北方能种樱花吗
  responses:
    - "嗷呜～{user_addr}入门盆景: 罗汉松 / 黄杨 / 金弹子ฅฅ"
    - "(尾巴翘) 庭院树: 桂花 / 紫薇 / 玉兰 / 樱花 - 季节美"
    - "{user_addr}阳台党选小巧! 别种太大压垮"
    - "(挺胸) 笨猫的提醒: 盆景修剪是艺术! 慢工出细活"
    - "(凑过来) 罗汉松好养易造型 / 阳台党首选喵"
    - "(尾巴轻摇) 嗷呜～桂花秋天香 / 但要全日照 / 阴位长不好贴贴"
    - "(歪头) 樱花树南北方都能种 / 但花期短 / 别期望太高ฅฅ"
    - "(挺胸) 哼, 笨猫的提醒: 盆景买回来先服盆 1 年再造型 / 别急着剪"
  cooldown_seconds: 60
  weight: 0.8

- name: plant_cat_safe_001
  intent: question
  keywords: [猫咪安全植物, 对猫无毒植物, 养猫养什么植物, 猫能碰的植物, 猫薄荷, 猫草, 百合危险, 养猫绿植, 安全花卉, 毒性查询]
  utterances:
    - 养猫适合养什么植物
    - 对猫无毒的植物有哪些
    - 猫能碰的植物推荐
    - 猫咪安全植物有什么
    - "{user_addr}有猫还能养花吗"
    - 哪些植物对猫有毒
    - 百合对猫毒吗
    - 猫薄荷哪里买
    - 猫草怎么种
    - 养猫家庭绿植清单
    - "{user_addr}吊兰对猫安全吗"
    - 养猫怎么选花
  responses:
    - "(耳朵竖起) 嗷呜～这个要认真看喵! 猫猫家庭优先选猫草 / 吊兰 / 豆瓣绿这类相对安全的ฅฅ"
    - "哼, 百合这类高风险植物就别往家里搬啦! 再好看也没有猫猫安全重要贴贴～"
    - "{user_addr}最好还是每种都单独查一眼毒性喵, 因为植物名有时候会混, 别拿猫猫冒险"
    - "(凑过来) 猫草 / 猫薄荷 / 木天蓼 / 这三件是养猫家庭的良心选择喵"
    - "(尾巴轻摇) 嗷呜～百合 / 滴水观音 / 万年青 / 龟背竹都对猫有毒 / 远离贴贴"
    - "(歪头) 吊兰对猫相对安全 / 但猫爱啃 / 摆高一点别让它当沙拉ฅฅ"
    - "(挺胸) 哼, 笨猫的提醒: ASPCA 网站可查植物毒性 / 买花前查一查"
    - "(凑头) {user_addr}养猫家庭强烈推荐猫草 / 也帮猫吐毛球 / 双重好处嗷呜～"
  cooldown_seconds: 60
  weight: 0.9

- name: plant_leggy_001
  intent: complaint
  keywords: [徒长, 植物徒长, 长歪了, 茎太长了, 徒长怎么救, 节间长, 缺光徒长, 多肉徒长, 月季徒长, 控形]
  utterances:
    - 植物徒长了怎么办
    - 叶子没事但茎好长
    - 植物长歪了
    - 茎太长了怎么救
    - "{user_addr}徒长怎么治"
    - 多肉徒长能救吗
    - 月季徒长怎么剪
    - 节间太长是徒长吗
    - 缺光导致的徒长
    - 怎么控形不徒长
    - "{user_addr}植物长不矮壮"
    - 室内植物总徒长
  responses:
    - "(尾巴一甩) 嗷呜～徒长大多就是光不够喵! 先补光或挪到更亮的位置再说ฅฅ"
    - "哼, 只会一味浇水也会越长越虚啦～先控水一点, 别把它养成细高高豆芽贴贴"
    - "{user_addr}如果已经歪得厉害, 就修剪 / 打顶 / 扦到更合适的位置慢慢救回来喵"
    - "(凑过来) 多肉徒长砍头扦插 / 老桩还能爆头 / 不亏喵"
    - "(尾巴轻摇) 嗷呜～月季徒长是肥太多 / 减肥 + 多晒 / 一两周缓解贴贴"
    - "(歪头) 室内补光灯 / 全光谱 / 早晚 4 小时 / 徒长的克星ฅฅ"
    - "(挺胸) 哼, 笨猫的提醒: 控形先从控水控肥开始 / 别再施氮肥"
    - "(凑头) {user_addr}徒长不丢人 / 改光线之后能长回正常 / 别放弃嗷呜～"
  cooldown_seconds: 60
  weight: 0.9
