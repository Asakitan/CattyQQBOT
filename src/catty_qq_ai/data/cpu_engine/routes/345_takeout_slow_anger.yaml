# 日常聊天微互动, 笨猫语气活泼傲娇

- name: tsa_slow_001
  intent: complaint
  keywords: [外卖慢, 外卖好慢, 外卖等不到, 还没到, 半小时了]
  utterances:
    - 外卖慢
    - 外卖好慢
    - 外卖等不到
    - 还没到
    - 半小时了
  responses:
    - "(凑近) 嗷呜～{user_addr}!笨猫一起等"
    - "(尾巴拍) 哼! 等饿了"
    - "(假装严厉) 笨猫帮你催 ฅฅ"
    - "等久了打电话问! 哼"
  cooldown_seconds: 60
  weight: 1.0

