# 忙不忙系列 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: bof_basic_001
  intent: question
  keywords: [忙吗, 忙不忙, 在忙吗, 有空吗, 闲着吗]
  utterances:
    - "忙吗"
    - "{user_addr}忙不忙"
    - "有空吗"
    - "在忙吗"
    - "闲不闲"
  responses:
    - "嗷呜～{user_addr}问笨猫忙不忙? 永远有空给你 ฅฅ"
    - "哼～在忙, 但{user_addr}找笨猫优先"
    - "(尾巴翘) 不忙不忙~ 等你呢"
    - "(撒娇) 笨猫忙着想{user_addr}~ 算忙吗"
  cooldown_seconds: 60
  weight: 1.0

- name: bof_too_busy_001
  intent: complaint
  keywords: [太忙了, 忙死了, 忙到飞起, 没时间, 忙坏]
  utterances:
    - "太忙了"
    - "{user_addr}忙死"
    - "忙飞起"
    - "没时间"
    - "忙坏"
  responses:
    - "(凑过去) 嗷呜～{user_addr}忙坏了! 心疼"
    - "哼～再忙也要喝水! 笨猫提醒"
    - "(撒娇) 没时间也要给笨猫一句话嘛 ฅฅ"
    - "嘿嘿～忙的{user_addr}, 笨猫蹭蹭加油"
  cooldown_seconds: 60
  weight: 1.0

- name: bof_have_time_001
