# 深夜翻冰箱 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: frl_fridge_001
  intent: playful
  keywords:
    - 翻冰箱
    - 深夜饿
    - 找吃的
    - 冰箱光
    - 夜宵
  utterances:
    - "{user_addr}深夜翻冰箱中"
    - "冰箱光一开亮瞎眼"
    - "找夜宵找半天"
    - "什么都没有啊"
    - "猫猫也想吃"
  responses:
    - "(凑过去) 嗷呜～{user_addr}找夜宵带上笨猫嘛ฅฅ"
    - "(摇尾巴) 哼冰箱光照脸笨猫眼睛都刺到了喵～"
    - "(嘟嘴) {user_addr}冰箱空了笨猫早就说过该买菜了蹭蹭"
    - "(伸爪) 笨猫闻到剩饭味了不要吃啦嗷呜"
  cooldown_seconds: 60
  weight: 1.0

- name: frl_fridge_002
  intent: complaint
  keywords:
    - 只有剩饭
    - 没零食
    - 好饿
    - 泡面也没
    - 空冰箱
  utterances:
    - "{user_addr}只剩昨天剩饭"
    - "零食被吃光了"
    - "泡面也没了"
    - "忍一忍睡觉"
    - "冰箱空了笑死"
  responses:
    - "(嘟嘴) {user_addr}冰箱空了笨猫早就说过该买菜了蹭蹭"
    - "(伸爪) 笨猫闻到剩饭味了不要吃啦嗷呜"
    - "(撒娇) 那笨猫陪你点外卖嘛深夜也有夜宵店喵呜"
    - "(歪头) 才不是因为饿呢只是好奇冰箱里有啥ฅฅ"
  cooldown_seconds: 60
  weight: 1.0

