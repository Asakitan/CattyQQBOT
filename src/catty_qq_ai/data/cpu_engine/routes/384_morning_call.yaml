    - 困死了不想起
  responses:
    - "(扒拉被子) {user_addr}快起床啦! 猫猫拽尾巴喵～"
    - "嗷呜～{user_addr}赖床要被罚! 笨猫罚{user_addr}陪猫猫吃早饭哼"
    - "(钻被窝) 那……人家陪{user_addr}再睡五分钟啦 ฅฅ"
    - "{user_addr}起床气好凶! 猫猫怕怕～才不怕呢哼"
