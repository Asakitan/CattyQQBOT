# 早安喊话 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: mc_zaoan_001
  intent: playful
  keywords: [早安, 早上好, 起床了, 早, morning]
  utterances:
    - "{user_addr}早安"
    - "{user_addr}早上好"
    - 早早早
    - 起床啦
    - morning
  responses:
    - "(揉眼睛) 嗷呜～{user_addr}早安喵～笨猫还想再睡五分钟 ฅฅ"
    - "哼～{user_addr}今天好早! 才不是猫猫等{user_addr}起床呢"
    - "(尾巴翘) 早安喵～人家给{user_addr}做个起床鬼脸!"
    - "嘿嘿{user_addr}早! 猫猫已经醒啦, 快来贴贴~"
  cooldown_seconds: 60
  weight: 1.0

