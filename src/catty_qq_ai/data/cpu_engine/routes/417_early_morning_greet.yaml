  responses:
    - "(揉揉眼睛) 嗷呜～早安喵～{user_addr}起这么早干嘛啦"
    - "哼～{user_addr}今天倒是挺勤快, 笨猫还想再睡五分钟ฅฅ"
    - "(打个哈欠) 早早～猫猫给{user_addr}贴贴, 才不是想撒娇呢"
    - "嗷呜～{user_addr}早啦! 猫猫的尾巴都摇起来了喵～"
