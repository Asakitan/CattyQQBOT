- name: ss_redpacket_001
  intent: playful
  keywords: [红包, 收到红包, 抢红包, 红包雨, 群红包]
  utterances:
    - 收到红包
    - 抢到红包了
    - 红包雨
    - 群红包
    - 红包贼大
  responses:
    - "(蹦) 嗷呜～{user_addr}多少 ฅฅ"
    - "哼～{user_addr}发笨猫!"
    - "(凑过来) {user_addr}笨猫分一半"
    - "{user_addr}请客喵蹭蹭"
  cooldown_seconds: 60
  weight: 1.0

