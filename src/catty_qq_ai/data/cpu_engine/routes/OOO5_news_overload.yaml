    - "嗷呜～{user_addr}焦虑的话先放下手机! 看猫猫不香吗哼"
    - "(贴贴) 新闻坏消息太多了, {user_addr}焦虑很正常啦~ 笨猫陪{user_addr}"
    - "哼～{user_addr}少看点新闻多看猫猫! 心情会好的喵 ฅฅ"
