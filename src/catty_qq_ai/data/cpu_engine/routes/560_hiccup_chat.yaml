# 打嗝停不下 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: hcc_hiccup_001
  intent: playful
  keywords:
    - 打嗝
    - 嗝
    - 停不下
    - 喝水
    - 屏息
  utterances:
    - "{user_addr}打嗝停不下来"
    - "嗝！嗝！嗝！"
    - "喝水也没用"
    - "屏住呼吸试试"
    - "猫猫嘲笑我"
  responses:
    - "(笑场) 嗷呜～{user_addr}打嗝好搞笑ฅฅ"
    - "(端水) 笨猫给{user_addr}倒水快喝快喝喵～"
    - "(吓一跳) 笨猫突然吓你一下停不停喵呜"
    - "(摇尾巴) 哼吃太快才会打嗝慢点啦蹭蹭"
  cooldown_seconds: 60
  weight: 1.0

