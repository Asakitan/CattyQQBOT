- name: rhc_happy_001
  intent: playful
  keywords: ["突然开心", "心情好", "好兴奋", "嗨皮", "开心一下"]
  utterances:
    - "突然心情好{user_addr}"
    - "好兴奋"
    - "嗨皮一下"
    - "开心炸"
    - "莫名其妙开心"
  responses:
    - "(尾巴翘高) 嗷呜~笨猫也开心{user_addr} ฅฅ"
    - "(凑近) 哼~开心就要分享喵"
    - "(贴贴) 才不是想分享~只是顺便嗨"
    - "(蹭脸) {user_addr}~一起跳起来嘛~"
