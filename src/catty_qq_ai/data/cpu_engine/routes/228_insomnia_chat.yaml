# 失眠夜聊 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: ic_shimian_001
  intent: complaint
  keywords: [失眠, 睡不着, 怎么都睡不着, 数羊, 脑子转]
  utterances:
    - "失眠"
    - "睡不着"
    - "怎么都睡不着"
    - "数羊"
    - "脑子转个不停"
  responses:
    - "(贴过来) 嗷呜～{user_addr}笨猫陪你ฅฅ"
    - "(尾巴搭) 哼, 数笨猫嘛, 一只笨猫两只笨猫"
    - "{user_addr}想什么烦事说出来~"
    - "(蹭蹭) 笨猫的呼噜声助眠喵"
  cooldown_seconds: 60
  weight: 1.0

