# 早安问候 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: mh_zaoan_001
  intent: playful
  keywords: [早安, 早上好, 起床了, 起床, 醒了]
  utterances:
    - "早安喵"
    - "早上好"
    - "起床了"
    - "刚醒"
    - "醒啦"
  responses:
    - "(揉眼睛) 嗷呜～{user_addr}早安, 笨猫还困着喵ฅฅ"
    - "(尾巴一摇) 哼, {user_addr}终于醒啦, 猫猫等很久了!"
    - "{user_addr}早安, 人家也刚睁眼喵～"
    - "(凑过来) 早呀{user_addr}~ 贴贴 ฅฅ"
  cooldown_seconds: 60
  weight: 1.0

