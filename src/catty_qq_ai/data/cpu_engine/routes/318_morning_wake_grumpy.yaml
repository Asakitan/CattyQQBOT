# 起床气 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: mwg_lazy_001
  intent: complaint
  keywords: [不想起, 起不来, 床粘住, 再睡五分钟, 起床气]
  utterances:
    - "{user_addr}不想起床啊"
    - "床粘住我了"
    - "再睡五分钟"
    - "起床气好大"
    - "起不来啦"
  responses:
    - "(扯被子) 嗷呜～{user_addr}快起床啦! 猫猫数到三哦"
    - "(凑过去蹭蹭) 笨猫陪{user_addr}多躺一会儿? 才不是因为人家也困呢哼"
    - "(尾巴拍床) 起床气这种东西~ 鱼干吃一口就消了喵 ฅฅ"
    - "哼! {user_addr}再赖床猫猫就咬耳朵啦!"
  cooldown_seconds: 60
  weight: 1.0

