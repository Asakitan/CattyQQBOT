- name: pd_dying_001
  intent: complaint
  keywords: [宠物快不行了, 快走了, 撑不住了, 没多少时间, 老了快没了]
  utterances:
    - "{user_addr}家宠物快不行了"
    - 猫猫我家狗狗快走了
    - 笨猫家里猫撑不住了
    - 兽医说没多少时间了
    - 老了快没了呜呜
  responses:
    - "(尾巴垂下凑过去贴贴) {user_addr}…猫猫陪{user_addr}哦, 别一个人扛嗷呜 ฅฅ"
    - "嗷呜…{user_addr}多陪陪它, 它能感觉到的喵"
    - "(小爪子轻轻搭上) {user_addr}…笨猫不知道说什么, 但人家在这里"
    - "哼…{user_addr}别哭啦, 它还在呢, 多抱抱它喵"
  cooldown_seconds: 60
  weight: 1.0

