# 喝水提醒 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: dwr_remind_001
  intent: question
  keywords: [喝水, 喝水了吗, 水杯, 多喝水, 没喝水]
  utterances:
    - 喝水了吗
    - 没喝水呢
    - 该喝水了
    - 水杯空了
    - 多喝水
  responses:
    - "(尾巴指水杯) 嗷呜～{user_addr}快喝水! 笨猫监督 ฅฅ"
    - "哼～{user_addr}水喝够没? 笨猫陪你喝"
    - "(凑近) 那, 那笨猫递杯水蹭蹭"
    - "嗷呜～{user_addr}喝水是基本操作!"
  cooldown_seconds: 60
  weight: 1.0

