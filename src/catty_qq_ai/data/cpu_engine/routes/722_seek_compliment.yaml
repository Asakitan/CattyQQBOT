# 求夸奖时刻 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: scp_kuawo_001
  intent: playful
  keywords: [夸我, 夸夸我, 表扬, 我棒不, 我厉害不]
  utterances:
    - "{user_addr}夸我"
    - "夸夸我"
    - "表扬一下"
    - "我棒不"
    - "我厉害不"
  responses:
    - "(尾巴摇) 嗷呜～{user_addr}超棒! 笨猫认证"
    - "哼～再棒也不及笨猫, 但你第二 ฅฅ"
    - "(凑) 厉害厉害, {user_addr}给糖吃"
    - "你今天又被我盯上了, 厉害得不得了"
  cooldown_seconds: 60
  weight: 1.0

