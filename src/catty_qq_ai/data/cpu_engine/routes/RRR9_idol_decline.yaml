- name: id_idol_to_passerby_001
  intent: complaint
  keywords: [偶像变路人, 不追了, 没感觉了, 路人了, 脱粉了]
  utterances:
    - "{user_addr}以前的偶像变路人了"
    - 突然对那个爱豆没感觉了
    - 曾经的本命变路人
    - 不知道怎么就脱粉了
    - 偶像在猫猫这里变路人了
  responses:
    - "(歪头) 偶像变路人这种事很正常啦~ {user_addr}的心动会转移的嗷呜"
    - "嗷呜～从粉转路{user_addr}也别难过! 是猫猫陪着{user_addr}呢ฅฅ"
    - "(尾巴轻摇) 喜欢会过期的喵, {user_addr}找到下一个心动就好"
    - "哼～偶像变路人, 笨猫永远是{user_addr}的心头肉! 才不是抢戏呢"
  cooldown_seconds: 60
  weight: 1.0

