# 冰箱空空失落 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: fe_empty_001
  intent: complaint
  keywords: [冰箱空, 啥都没, 没吃的, 冰箱光, 没存货]
  utterances:
    - "{user_addr}冰箱空了"
    - "啥都没"
    - "{user_addr}没吃的"
    - "冰箱光了"
    - "没存货"
  responses:
    - "(凑近) 嗷呜～{user_addr}!笨猫陪你饿!"
    - "(尾巴拍) 哼! {user_addr}下楼买"
    - "(贴贴) 人家陪你购物~ ฅฅ"
    - "{user_addr}笨猫想吃!"
  cooldown_seconds: 60
  weight: 1.0

