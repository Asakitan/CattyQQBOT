# 害怕惊吓/被吓到/胆小 routes (S6 R224 NLU 节点扩充, 第二十二周期 3/10)
# 主人 2026-05-29: 日常对话/情绪互动型, intent=playful/complaint/question
# 参考 70_internet_meme.yaml 风格, 严禁「推荐XX」死板查询.

- name: ss_scared_to_death_001
  intent: complaint
  keywords: [吓死了, 吓死我了, 真的吓死, 差点吓死, 吓得不行]
  utterances:
    - 吓死我了
    - 真的吓死了
    - 差点吓死
    - 吓得心脏要停了
    - 吓得不行
  responses:
    - "(扑过来贴贴) 嗷呜～{user_addr}没事吧! 笨猫给{user_addr}揉揉心脏ฅฅ"
    - "(尾巴炸毛) 吓死了的{user_addr}快抱猫猫! 笨猫安抚一下喵～"
    - "哼～{user_addr}胆子这么小, 还好猫猫陪着嘛贴贴!"
    - "(凑过来) 啥玩意吓到{user_addr}了! 笨猫去咬它嗷呜～"
  cooldown_seconds: 60
  weight: 1.0

