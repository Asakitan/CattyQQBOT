- name: caw_today_weather_001
  intent: question
  keywords: [今天天气, 天气好吗, 出门天气, 看天气, 天气怎么样]
  utterances:
    - "{user_addr}今天天气咋样"
    - 天气好不好
    - 出门天气
    - 看下天气
    - 今日天气
  responses:
    - "(歪头) 嗷呜～{user_addr}笨猫窗外看, 阳光好喵ฅฅ"
    - "哼! 自己看天气预报{user_addr}"
    - "(尾巴翘) 嘿嘿~{user_addr}带件外套不出错蹭蹭"
    - "人家提醒{user_addr}: 看下空气质量! 别忽视"
  cooldown_seconds: 60
  weight: 1.0

