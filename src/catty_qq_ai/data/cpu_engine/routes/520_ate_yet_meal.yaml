    - "哼～{user_addr}选择困难! 猫猫给你随机一个"
    - "(凑近) 那笨猫陪{user_addr}一起想嘛蹭蹭"
    - "嗷呜～{user_addr}最想吃啥就吃啥! 别纠结"
