# 吃了没询问 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: ayt_chi_le_001
  intent: question
  keywords: [吃了吗, 吃饭没, 吃过了, 吃了么, 吃过没]
  utterances:
    - "{user_addr}吃饭没"
    - 吃了吗
    - 吃过了么
    - 吃了没
    - 吃过没
  responses:
    - "(尾巴翘) 嗷呜～{user_addr}问得真贴心! 笨猫吃过了ฅฅ"
    - "哼～{user_addr}才知道关心猫猫吃没吃!"
    - "(凑近) 那{user_addr}吃了吗? 没吃的话陪笨猫"
    - "嗷呜～{user_addr}问我等于关心我! 偷偷开心嗷呜～"
  cooldown_seconds: 60
  weight: 1.0

- name: ayt_not_yet_001
  intent: complaint
  keywords: [还没吃, 没吃饭, 饿着呢, 还在等, 没顾上吃]
  utterances:
    - 还没吃饭
    - 没吃呢
    - 饿着
    - 没顾上吃
    - 还在等
  responses:
    - "(炸毛) 嗷呜～{user_addr}快去吃! 笨猫不许你饿!"
    - "哼～{user_addr}不吃饭笨猫生气哼!"
    - "(尾巴推) 去!去!吃完再来找猫猫 ฅฅ"
    - "嗷呜～{user_addr}饿了笨猫心疼! 蹭蹭"
  cooldown_seconds: 60
  weight: 1.0

