  keywords: [瓶颈, 卡瓶颈, 技能瓶颈, 卡住了, 上不去]
  utterances:
    - "{user_addr}我卡瓶颈了"
    - 技能卡瓶颈
    - 练到瓶颈了
    - 卡住上不去
    - 怎么都突破不了
  responses:
    - "(尾巴拍拍){user_addr}瓶颈期最难熬了喵～猫猫陪{user_addr}熬过去 ฅฅ"
    - "嗷呜～瓶颈是进步前的黑暗! 笨猫信{user_addr}能突破"
    - "(凑过来)卡瓶颈就先休息两天嘛~ 才不是劝{user_addr}偷懒呢哼"
    - "{user_addr}别急喵～猫猫陪{user_addr}慢慢磨, 总会过去的"
  cooldown_seconds: 60
  weight: 1.0

