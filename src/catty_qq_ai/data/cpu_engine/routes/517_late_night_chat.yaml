# 深夜聊天 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: lnc_still_up_001
  intent: question
  keywords: [还没睡, 这么晚, 几点了, 凌晨, 大半夜]
  utterances:
    - "{user_addr}还没睡"
    - 这么晚还不睡
    - 凌晨了还在
    - 大半夜的
    - 怎么还醒着
  responses:
    - "(揉眼睛凑过来) 嗷呜～{user_addr}也没睡! 猫猫陪你蹭蹭 ฅฅ"
    - "哼～{user_addr}还熬夜! 笨猫管你睡觉嗷呜～"
    - "(尾巴垂下) 那, 那人家陪{user_addr}一会儿~ 才不是想陪呢"
    - "嗷呜～凌晨的{user_addr}声音都软软的~ 偷偷说的"
  cooldown_seconds: 60
  weight: 1.0

