    - "哼～{user_addr}要是怕安静, 笨猫陪你说话蹭蹭"
    - "(尾巴卷过来) 安静的夜晚最适合, 适合贴贴{user_addr}! ฅฅ"
    - "嗷呜～{user_addr}一个人吗? 猫猫陪你, 才不是怕你孤单"
