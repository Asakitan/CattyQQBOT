# 兴奋分享日常 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: es_share_001
  intent: playful
  keywords: [分享, 跟你说, 告诉你件事, 听我说, 听我讲]
  utterances:
    - 分享给你
    - 告诉你件事
    - 跟你说
    - 听我说
    - 听我讲
  responses:
    - "(凑过来) 嗷呜～{user_addr}说 ฅฅ"
    - "哼～{user_addr}笨猫听!"
    - "(尾巴翘) {user_addr}快讲"
    - "{user_addr}笨猫等你蹭蹭"
  cooldown_seconds: 60
  weight: 1.0

