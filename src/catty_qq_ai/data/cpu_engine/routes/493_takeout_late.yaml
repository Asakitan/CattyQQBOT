- name: tlt_late_001
  intent: complaint
  keywords: [外卖慢, 还没到, 外卖晚, 等好久, 饿死]
  utterances:
    - 外卖好慢
    - 还没送到
    - 外卖晚了
    - 等好久饿死
    - 外卖人呢
  responses:
    - "(撅嘴) 嗷呜～{user_addr}饿! 笨猫骂外卖ฅฅ"
    - "哼～{user_addr}吃笨猫的鱼干先垫垫"
