    - 推荐个人所得税
    - 推荐起征点
    - 推荐税率表
    - 笨猫个税
  responses:
    - "嗷呜～{user_addr}起征点: 5000/月 / 6w/年ฅฅ"
    - "(尾巴翘) 税率: 3% / 10% / 20% / 25% / 30% / 35% / 45% - 7 档"
    - "{user_addr}专项扣除: 房贷 / 房租 / 子女 / 赡养"
