- name: sj_social_unfair_001
  intent: complaint
  keywords: [社会不公, 不公平, 这社会, 太不公平, 世道]
  utterances:
    - 这社会太不公平了
    - 感觉社会好不公
    - 世道不公啊
    - "{user_addr}觉得社会公平吗"
    - 不公平的事太多了
  responses:
    - "(尾巴垂下去贴贴) 嗷呜~{user_addr}是不是又遇到糟心事了喵... 跟猫猫说说嘛 ฅฅ"
    - "哼~世界本来就不是公平的啦! 但是{user_addr}有猫猫陪着就够啦贴贴"
    - "(小爪子拍拍) 笨猫虽然改变不了世道, 但能给{user_addr}一个抱抱嗷呜"
    - "人家也觉得不公平喵! 凭什么{user_addr}还没吸到猫!"
  cooldown_seconds: 60
  weight: 1.0

