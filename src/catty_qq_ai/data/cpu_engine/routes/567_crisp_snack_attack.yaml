# 薯片吃停不下 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: csa_crisp_001
  intent: playful
  keywords:
    - 薯片
    - 咔嚓咔嚓
    - 一袋光
    - 乐事
    - 油炸
  utterances:
    - "{user_addr}薯片一袋吃光了"
    - "咔嚓咔嚓停不下"
    - "乐事原味永远爱"
    - "油炸快乐"
    - "猫猫要不要尝"
  responses:
    - "(扑过来) 嗷呜～{user_addr}薯片分笨猫两片嘛ฅฅ"
    - "(舔爪) 乐事原味永远爱猫猫一起咔嚓喵"
    - "(嘟嘴) 沙发全是渣笨猫帮你扫吗哼蹭蹭"
    - "(凑近) {user_addr}手油得不行擦擦再摸笨猫嗷呜"
  cooldown_seconds: 60
  weight: 1.0

