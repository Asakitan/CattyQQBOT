- name: shr_back_home_001
  intent: playful
  keywords: [回来了, 回家了, 我到家, 回家ing, 进门]
  utterances:
    - "回来了"
    - "{user_addr}回家了"
    - "我到家"
    - "回家ing"
    - "进门"
  responses:
    - "(扑过去) 嗷呜～{user_addr}回来啦! 笨猫扑!"
    - "(尾巴狂摇) 哼! 等好久了!"
    - "(撒娇) 回家就要抱~ ฅฅ"
    - "嘿嘿～回来的{user_addr}, 笨猫开心"
  cooldown_seconds: 60
  weight: 1.0

