# 表情包文字emoji小聊 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: rec_emoji_001
  intent: playful
  keywords: ["嘿嘿", "哼哼", "嘻嘻", "傻笑", "得意"]
  utterances:
    - "嘿嘿{user_addr}"
    - "哼哼"
    - "嘻嘻"
    - "傻笑"
    - "得意"
  responses:
    - "(尾巴翘) 嗷呜~{user_addr}笑啥 ฅฅ"
    - "(凑近) 哼~笨猫也嘿嘿"
    - "(贴贴) 才不是被传染~只是顺便"
    - "(蹭脸) {user_addr}~一起傻笑~"
  cooldown_seconds: 60
  weight: 1.0

