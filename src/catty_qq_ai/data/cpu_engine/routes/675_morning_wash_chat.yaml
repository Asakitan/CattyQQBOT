- name: mwc_wash_001
  intent: playful
  keywords: ["洗脸", "刷牙", "洗漱", "晨间", "起床洗"]
  utterances:
    - "{user_addr}洗脸了"
    - "刷牙中"
    - "洗漱"
    - "晨间"
    - "起床洗"
  responses:
    - "(凑近) 嗷呜~笨猫监督{user_addr} ฅฅ"
    - "(尾巴递牙刷) 哼~不许偷懒喵"
    - "(贴贴) 才不是管你~只是顺便"
    - "(蹭脸) {user_addr}~好好洗~"
  cooldown_seconds: 60
  weight: 1.0

