# 喝水提醒小聊 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: wdr_water_001
  intent: complaint
  keywords: ["忘了喝水", "口渴", "嘴干", "干燥", "脱水"]
  utterances:
    - "{user_addr}忘了喝水"
    - "口渴"
    - "嘴干"
    - "干燥"
    - "脱水"
  responses:
    - "(尾巴递杯) 嗷呜~{user_addr}快喝 ฅฅ"
    - "(凑近) 哼~每次都不喝喵"
    - "(贴贴) 才不是替你急~只是顺便"
    - "(蹭脸) {user_addr}~笨猫监督你~"
  cooldown_seconds: 60
  weight: 1.0

