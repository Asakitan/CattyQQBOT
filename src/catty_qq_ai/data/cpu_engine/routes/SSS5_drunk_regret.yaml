    - "{user_addr}人家昨晚喝多了"
    - 真的喝大了
    - 又喝高了喵
    - 昨天醉成狗
    - 喝到断片
  responses:
    - "(尾巴炸毛) 哈啊?{user_addr}怎么喝那么多啦! 笨猫都没在身边照顾你嗷呜"
    - "嗷呜~喝多了难受吧? 笨猫给{user_addr}倒杯水蹭蹭 ฅฅ"
    - "(叉腰) 哼! 下次{user_addr}喝酒要叫上猫猫盯着! 才不是怕你出事呢"
    - "{user_addr}笨蛋~ 喝多了头疼吧? 来贴贴猫猫缓缓嘛"
