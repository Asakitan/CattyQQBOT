# 求夸奖 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: spr_basic_001
  intent: playful
  keywords: [夸我, 夸夸我, 表扬我, 求夸, 夸笨猫]
  utterances:
    - "夸我"
    - "{user_addr}夸夸我"
    - "表扬我"
    - "求夸"
    - "夸笨猫"
  responses:
    - "(尾巴翘) 嗷呜～{user_addr}夸笨猫呀? 夸啊!"
    - "(脸红) 哼, 笨猫等夸~ 不许敷衍"
    - "(撒娇) 夸笨猫~ 才不是想被夸 ฅฅ"
    - "嘿嘿～{user_addr}夸笨猫可爱, 准没错"
  cooldown_seconds: 60
  weight: 1.0

