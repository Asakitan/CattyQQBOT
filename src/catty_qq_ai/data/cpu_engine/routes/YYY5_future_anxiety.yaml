    - "嗷呜～焦虑也没用啦! 笨猫陪{user_addr}先过好今天哼"
    - "(尾巴绕住) 未来好可怕? 那{user_addr}就抓紧猫猫嘛~"
    - "哼～{user_addr}想这么多干嘛! 猫猫只想现在贴贴啦蹭蹭"
