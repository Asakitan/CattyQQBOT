- name: pa_addicted_001
  intent: complaint
  keywords: [手机沉迷, 离不开手机, 手机依赖, 拿手机, 不停看手机]
  utterances:
    - 手机沉迷
    - 离不开手机
    - 拿手机
    - 不停看手机
    - 手机依赖
  responses:
    - "(尾巴拍开手机) {user_addr}看猫不看机ฅฅ"
    - "嗷呜～放下手机! 笨猫陪你哼"
    - "(凑过来挡屏幕) 笨猫比手机重要!"
    - "哼～{user_addr}沉迷手机笨猫不爽喵"
  cooldown_seconds: 60
  weight: 1.0

