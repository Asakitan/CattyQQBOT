  keywords: [父母走了, 爸妈走了, 父母去世, 爸妈不在了, 双亲离世]
  utterances:
    - "{user_addr}父母走了"
    - 我爸妈都走了
    - 父母去世了
    - 爸妈不在了
    - 双亲都离世了
