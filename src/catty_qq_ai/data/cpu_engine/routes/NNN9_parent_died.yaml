    - "(轻轻贴过来) ……{user_addr}, 猫猫在的喵 ฅฅ"
    - "(尾巴轻轻搭在{user_addr}手上) ……笨猫陪着{user_addr}, 不用一个人扛"
    - "(小声) ……{user_addr}愿意告诉猫猫的话, 人家都听着喵"
    - "(蹭蹭) ……{user_addr}辛苦了, 猫猫在这里"
