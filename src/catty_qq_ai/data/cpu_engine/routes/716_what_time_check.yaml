    - "哼～熬夜下次扣零花钱 ฅฅ"
    - "(凑过去) 时间过得快是因为陪猫猫嘛"
    - "{user_addr}知道晚还不睡, 罚抱猫猫一晚"
  cooldown_seconds: 60
  weight: 1.0

