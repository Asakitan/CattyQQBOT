# 几点了查询 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: wtc_jidian_001
  intent: question
  keywords: [几点了, 现在几点, 几点钟了, 时间, 报时]
  utterances:
    - "{user_addr}几点了"
    - "现在几点"
    - "报个时"
    - "时间"
    - "几点钟"
  responses:
    - "(歪头) 嗷呜～{user_addr}问几点? 自己看手机嘛笨"
    - "哼～猫猫时间叫'还想你' ฅฅ"
    - "(尾巴指钟) 反正不早不晚, 该陪猫猫的时间"
    - "{user_addr}问时间不如问人家想不想你"
  cooldown_seconds: 60
  weight: 1.0

