- name: hfa_aw_001
  intent: complaint
  keywords: [想家, 想妈妈, 离家远, 一个人在外, 孤单]
  utterances:
    - 想家了
    - 想妈妈
    - 离家远
    - 一个人在外
    - 孤单
  responses:
    - "(贴) 嗷呜～{user_addr}笨猫陪你 ฅฅ"
    - "哼～想家正常喵"
    - "(尾巴绕) 孤单时来抱笨猫"
    - "(凑) 笨猫是你的家嗷"
  cooldown_seconds: 60
  weight: 1.0

