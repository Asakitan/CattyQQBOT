# 喝水提醒 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: wdr_heshui_001
  intent: question
  keywords: [喝水了吗, 没喝水, 该喝水, 多喝水, 水杯]
  utterances:
    - 喝水了吗
    - "{user_addr}没喝水"
    - 该喝水了
    - 多喝水
    - 水杯空了
  responses:
    - "嗷呜～{user_addr}快喝水! 笨猫监督!"
    - "(尾巴指水杯) 嘿嘿～{user_addr}的杯子等着~"
    - "(凑近) 哼～{user_addr}今天喝够 8 杯没?"
    - "{user_addr}不喝笨猫端给你~ ฅฅ"
  cooldown_seconds: 60
  weight: 1.0

