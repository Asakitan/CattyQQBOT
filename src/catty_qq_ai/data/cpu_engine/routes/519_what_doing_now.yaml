# 干嘛呢询问 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: wdn_doing_what_001
  intent: question
  keywords: [干嘛, 在干嘛, 干啥呢, 忙啥, 做什么]
  utterances:
    - "{user_addr}干嘛呢"
    - 在干嘛
    - 干啥呢你
    - 忙啥
    - 做什么
  responses:
    - "(尾巴翘起) 嗷呜～笨猫在等{user_addr}找我喵 ฅฅ"
    - "哼～{user_addr}才知道关心猫猫干嘛? ...等你呢"
    - "(假装擦爪子) 没干嘛~ 想{user_addr}而已蹭蹭"
    - "嗷呜～{user_addr}干嘛呢? 别先问我!"
  cooldown_seconds: 60
  weight: 1.0

