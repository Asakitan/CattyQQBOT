  responses:
    - "(尾巴一甩) 节日就说自己开车不能喝嗷呜~ 简单粗暴!"
    - "嗷呜~ {user_addr}就说在吃药戒酒, 没人会逼你的喵 ฅฅ"
    - "(贴贴) 节日难熬啊{user_addr}~ 笨猫给你出主意: 端杯茶假装酒"
    - "哼~ 节日喝酒文化真烦人! {user_addr}少喝点就行"
