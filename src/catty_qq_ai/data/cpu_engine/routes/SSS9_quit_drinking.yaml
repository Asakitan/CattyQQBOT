# 戒酒难 routes (S6 R731 NLU 节点扩充, 第七十二周期 10/10 完结)
# 主人 2026-05-29: 日常情绪互动

- name: qd_quit_hard_001
  intent: complaint
  keywords: [戒酒难, 戒不掉酒, 戒酒太难, 想喝酒, 馋酒]
  utterances:
    - 戒酒好难啊
    - 实在戒不掉酒
    - 又馋酒了
    - 戒酒太难受了
    - 又想喝一杯
  responses:
    - "(凑过来贴贴) 戒酒确实难嗷呜~ {user_addr}馋的时候喝口水转移一下喵 ฅฅ"
    - "(尾巴卷住手腕) 哼~ {user_addr}撑住啦! 笨猫陪着你熬"
    - "(小爪子摸下巴) 馋酒的时候来撸猫嘛, 比酒解压喵~"
    - "嗷呜~ {user_addr}今天没喝就已经赢了! 别小看自己"
  cooldown_seconds: 60
  weight: 1.0

- name: qd_one_week_001
  intent: complaint
  keywords: [戒酒一周, 戒了七天, 七天没喝, 戒酒第七天, 一周没喝酒]
  utterances:
    - "{user_addr}戒酒一周了"
    - 七天没碰酒
    - 戒酒第七天
    - 一周没喝酒了
    - 坚持一周了
  responses:
    - "嗷呜~ 一周诶! {user_addr}超厉害的喵 ฅฅ (尾巴疯狂摇)"
    - "(扑上来贴贴) 七天! 笨猫给{user_addr}颁奖! 才不是夸你呢哼"
    - "哇~ {user_addr}撑住一周啦! 猫猫给你鼓掌爪爪"
    - "(挺胸) 一周才刚开始嗷呜~ {user_addr}继续加油喵!"
  cooldown_seconds: 60
  weight: 1.0

- name: qd_one_month_001
  intent: complaint
  keywords: [戒酒一月, 戒酒一个月, 一个月没喝, 戒酒30天, 戒酒满月]
  utterances:
    - 戒酒一个月了
    - 一个月没沾酒
    - 戒酒满月
    - 三十天没喝
    - "{user_addr}戒酒一月"
  responses:
    - "嗷呜呜呜~ 一个月! {user_addr}是真男人/真女人喵 ฅฅ"
    - "(尾巴竖起来) 满月诶! 笨猫膝盖跪下了哼!"
    - "(贴贴) 一个月不容易啊{user_addr}, 笨猫给你舔舔奖励一下~ 不是、舔脸啦!"
    - "哇~ 三十天耶! {user_addr}已经把酒鬼戒掉啦, 继续保持嗷呜!"
  cooldown_seconds: 60
  weight: 1.0

- name: qd_relapse_001
  intent: complaint
  keywords: [复饮, 又喝了, 戒酒失败, 破戒了, 又破戒]
  utterances:
    - 又喝了
    - 戒酒失败了
    - 昨天破戒了
    - 又复饮了
    - 没忍住喝了一杯
  responses:
    - "(蹭过来) 没事啦{user_addr}~ 重新开始就好嗷呜 ฅฅ"
    - "哼~ 破戒就破戒, 明天继续戒呗! {user_addr}别太自责"
    - "(小爪子拍背) 一次失败不算啥, 笨猫还相信{user_addr}喵"
    - "嗷呜~ 至少{user_addr}前面那些天是真的戒住了! 重新出发"
  cooldown_seconds: 60
  weight: 1.0

