    - 推荐记账 app
    - 推荐随手记
    - 推荐 MoneyWiz
    - 笨猫记账
  responses:
    - "嗷呜～{user_addr}主流: 随手记 / 鲨鱼记账 / 钱迹 / 网易有钱ฅฅ"
    - "(尾巴翘) 极简: Money Lover / 圈子记账"
