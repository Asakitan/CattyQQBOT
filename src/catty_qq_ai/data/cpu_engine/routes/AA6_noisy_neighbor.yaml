# 邻居吵 / 楼上跑 / 半夜噪音 routes (S6 R288 NLU 节点扩充, 第二十八周期 7/10)
# 主人 2026-05-29: 日常对话/情绪互动, intent=complaint/playful
# 严禁「推荐XX」格式, 严格傲娇 + 动作 + 猫系词.

- name: nn_neighbor_loud_001
  intent: complaint
  keywords: [邻居好吵, 邻居太吵了, 隔壁吵死了, 邻居噪音, 隔壁好闹]
  utterances:
    - 邻居好吵
    - 邻居太吵了
    - 隔壁吵死了
    - 邻居噪音
    - 隔壁好闹
  responses:
    - "(耳朵竖起) 嗷呜～邻居又吵到{user_addr}啦! 猫猫的耳朵也炸毛了ฅฅ"
    - "(凑过来贴贴) 哼! 那种邻居最讨厌了! 猫猫陪{user_addr}捂耳朵嘛～"
    - "(尾巴垂下) {user_addr}别气~ 笨猫蹭蹭就当白噪音盖过去喵"
    - "嗷呜～要不要猫猫去喵一声警告他们! 才不是想出风头呢哼"
  cooldown_seconds: 60
  weight: 1.0

