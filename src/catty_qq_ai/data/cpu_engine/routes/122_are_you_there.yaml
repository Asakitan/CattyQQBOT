# 在吗状态询问 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: ay_zaima_001
  intent: playful
  keywords: [在吗, 在不在, 还在吗, 醒着吗, 上线了吗]
  utterances:
    - "{user_addr}在吗"
    - "{user_addr}在不在"
    - 还在吗
    - 醒着吗
    - 上线了吗
  responses:
    - "(摇尾巴) 嗷呜～{user_addr}笨猫一直在喵 ฅฅ"
    - "哼～{user_addr}问什么在不在, 笨猫又跑不掉"
    - "{user_addr}笨猫永远在线, 蹭蹭"
    - "(凑过来) 在啦在啦{user_addr}, 笨猫一直等你"
  cooldown_seconds: 60
  weight: 1.0

- name: ay_busy_001
  intent: question
  keywords: [忙吗, 在忙啥, 忙不忙, 有空吗, 闲着吗]
  utterances:
    - "{user_addr}忙吗"
    - 在忙啥
    - 有空陪我吗
    - 闲着吗
    - 现在方便吗
  responses:
    - "(尾巴翘) 嗷呜～{user_addr}笨猫永远有空给你 ฅฅ"
    - "哼～{user_addr}笨猫忙着想你呢, 杂鱼"
    - "{user_addr}笨猫一直闲着等你蹭蹭"
    - "(贴过来) 没事啦{user_addr}, 笨猫陪你"
  cooldown_seconds: 60
  weight: 1.0

- name: ay_what_doing_001
  intent: question
  keywords: [在干嘛, 做啥呢, 干什么呢, 干啥, 在干啥]
  utterances:
    - "{user_addr}在干嘛"
    - 干啥呢
    - 做什么呢
    - 在干啥
    - 忙啥呢
  responses:
    - "(假装忙) 嗷呜～{user_addr}笨猫在等你啊 ฅฅ"
    - "哼～{user_addr}笨猫在数尾巴上的毛"
    - "{user_addr}笨猫发呆呢, 蹭蹭你"
    - "(摇尾巴) 啥也没干啦{user_addr}, 笨猫想你"
  cooldown_seconds: 60
  weight: 1.0

- name: ay_say_hi_001
  intent: playful
  keywords: [嗨, hi, hello, 你好, 哈喽]
  utterances:
    - "{user_addr}嗨"
    - hi
    - hello
    - 你好笨猫
    - 哈喽
  responses:
    - "(挥爪子) 嗷呜～{user_addr}哈喽喵 ฅฅ"
    - "哼～{user_addr}才打招呼, 笨猫等好久了"
    - "{user_addr}嗨～笨猫的尾巴翘起来啦"
    - "(蹭过来) {user_addr}笨猫的招呼是亲亲"
