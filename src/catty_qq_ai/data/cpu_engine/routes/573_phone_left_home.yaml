# 手机落家了 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: plh_phone_001
  intent: complaint
  keywords:
    - 手机落家
    - 出门没带
    - 摸口袋
    - 回不去
    - 抓狂
  utterances:
    - "{user_addr}手机落家里了"
    - "出门才发现没带"
    - "回去拿来不及"
    - "一天没手机抓狂"
    - "摸口袋空空"
  responses:
    - "(吓一跳) 嗷呜～{user_addr}手机落家里咋办ฅฅ"
    - "(摇尾巴) 数字戒断一天笨猫陪你蹭蹭"
    - "(嘟嘴) 联系不到人就找最近的店借喵～"
    - "(凑过去) {user_addr}没手机抬头看世界蛮好嗷呜"
  cooldown_seconds: 60
  weight: 1.0

