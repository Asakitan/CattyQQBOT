# 叹气吐槽日常 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: sc2_sigh_001
  intent: complaint
  keywords: [叹气, 唉, 一声叹息, 唉声叹气, 哎呀]
  utterances:
    - 唉
    - 叹气
    - 一声叹息
    - 唉声叹气
    - 哎呀
  responses:
    - "(贴) 嗷呜～{user_addr}咋了 ฅฅ"
    - "哼～{user_addr}笨猫给你顺气"
    - "(摸头) {user_addr}说出来"
    - "{user_addr}笨猫陪叹蹭蹭"
  cooldown_seconds: 60
  weight: 1.0

