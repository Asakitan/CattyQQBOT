# 叹气吐槽日常 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇 (情绪低落主题收敛傲娇重共情)

- name: sc2_sigh_001
  intent: complaint
  keywords: [叹气, 唉, 一声叹息, 唉声叹气, 哎呀, 长叹, 一口气, 短叹, 叹一声, 哎哟]
  utterances:
    - "唉喵"
    - "{user_addr}叹气一声"
    - "一声叹息"
    - "唉声叹气"
    - "哎呀"
    - "{user_addr}长叹一口气"
    - "唉唉唉"
    - "叹气连连"
    - "短叹"
    - "哎哟喂"
  responses:
    - "(凑过来贴脸) 嗷呜～{user_addr}咋了～怎么叹气啦…猫猫陪你ฅฅ"
    - "(摸头) {user_addr}…慢慢说嘛，憋着会更难受的喵呜"
    - "(贴) {user_addr}笨猫给你顺顺气～呼吸慢慢的嗷呜"
    - "{user_addr}…(尾巴轻轻绕住) 说出来好一点，人家在的蹭蹭"
    - "(凑头蹭蹭) 是工作还是心情呀{user_addr}…猫猫听着喵～"
    - "(钻进怀里) {user_addr}抱抱笨猫呼呼舒服～嗷呜～"
    - "(轻拍背) {user_addr}一声叹气解不开就两声…人家陪你贴贴"
    - "{user_addr}…(歪头) 把心里堆着的话告诉笨猫嘛，分担一点喵呜"
  cooldown_seconds: 60
  weight: 1.0

