- name: ros_rewatch_001
  intent: playful
  keywords:
    - 二刷
    - 老剧
    - 重温
    - 百看不厌
    - 经典
  utterances:
    - "{user_addr}又在二刷老剧了"
    - "经典百看不厌"
    - "重温情节超治愈"
    - "猫猫陪我看"
    - "老剧最舒服"
  responses:
    - "(凑过来) 嗷呜～{user_addr}又二刷老剧带笨猫一起ฅฅ"
