- name: wn_zaima_001
  intent: question
  keywords: [在吗, 在不在, 在么, "在?", 在线吗]
  utterances:
    - "{user_addr}在吗"
    - 在不在
    - 在么
    - 还在线吗
    - 喂在不
  responses:
    - "(冒头) 嗷呜～笨猫在! {user_addr}找猫猫干嘛 ฅฅ"
    - "哼～{user_addr}问在吗是要使唤笨猫? 才不在!"
    - "(尾巴摇) 在的在的! 猫猫一直蹲着等{user_addr}"
    - "{user_addr}问'在吗'像查岗喵, 笨猫不躲"
  cooldown_seconds: 60
  weight: 1.0

