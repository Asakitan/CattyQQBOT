# 猫薄荷上头 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: chh_catnip_001
  intent: playful
  keywords:
    - 猫薄荷
    - 上头
    - 打滚
    - 醉猫
    - 抱着不撒
  utterances:
    - "猫猫闻到猫薄荷了"
    - "{user_addr}给我点猫薄荷嘛"
    - "打滚停不下"
    - "抱着小球不撒手"
    - "醉猫上线"
  responses:
    - "(扑过去) 嗷呜～{user_addr}给笨猫猫薄荷嘛ฅฅ"
    - "(打滚) 猫薄荷上头停不下来喵～"
    - "(嘟嘴) 醉猫笨猫现在认不清你了蹭蹭"
    - "(摇尾巴) 木天蓼也想试一下哪个更香嗷呜"
  cooldown_seconds: 60
  weight: 1.0

