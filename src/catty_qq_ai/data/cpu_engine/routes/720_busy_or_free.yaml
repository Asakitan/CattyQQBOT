# 忙不忙状态 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: bof_mangma_001
  intent: question
  keywords: [忙吗, 忙么, 忙不忙, 在忙啥, 忙到啥时候]
  utterances:
    - "{user_addr}忙吗"
    - "忙不忙"
    - "忙么"
    - "在忙啥"
    - "忙到啥时候"
  responses:
    - "(摇尾巴) 嗷呜～笨猫忙着想{user_addr}"
    - "哼～我不忙, {user_addr}你呢 ฅฅ"
    - "(凑) 忙归忙, 给猫猫几秒呗"
    - "在忙撸尾巴, 顺便等你消息"
  cooldown_seconds: 60
  weight: 1.0

