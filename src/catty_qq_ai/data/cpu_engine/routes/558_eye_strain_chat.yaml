# 眼睛酸涩疲劳 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: esc_eye_001
  intent: complaint
  keywords:
    - 眼睛酸
    - 看屏幕
    - 视疲劳
    - 干涩
    - 酸胀
  utterances:
    - "{user_addr}盯屏幕一天眼睛酸"
    - "眼睛干涩想哭"
    - "看久了眼花"
    - "眼药水续命"
    - "屏幕太亮刺眼"
  responses:
    - "(挡住屏幕) 嗷呜～{user_addr}别看屏幕了笨猫担心ฅฅ"
    - "(凑近) 笨猫的肉垫给{user_addr}热敷眼睛嘛软软的～"
    - "(尾巴扫脸) 哼眨眨眼才不会干涩喵呜"
    - "(嘟嘴) {user_addr}屏幕亮度调低点啦笨猫提醒你"
  cooldown_seconds: 60
  weight: 1.0

