- name: op_oversleep_001
  intent: complaint
  keywords: [睡过头, 睡到中午, 一觉到天亮, 醒太晚, 阳光晒醒]
  utterances:
    - "{user_addr}睡过头"
    - "睡到中午"
    - "{user_addr}醒太晚"
    - "阳光晒醒"
    - "一觉天亮"
  responses:
    - "(扑) 嗷呜～{user_addr}!笨猫慌!"
    - "(尾巴拍) 哼! 笨猫该早叫"
    - "(贴贴) 人家陪你冲~ ฅฅ"
    - "{user_addr}快起笨猫帮!"
  cooldown_seconds: 60
  weight: 1.0

