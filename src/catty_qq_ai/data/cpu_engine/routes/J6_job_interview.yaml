# 职场 / 求职 / 面试 / 简历 / 跳槽 routes (S6 R118 NLU 节点扩充, 第十一周期 buffered 7/10)
# 主人 2026-05-29: intent=question/info_request, 短语级 keywords.

- name: job_resume_001
  intent: question
  keywords: [推荐简历, 推荐写简历, 推荐简历模板, 推荐 STAR 法则, 笨猫简历]
  utterances:
    - 推荐简历
    - 推荐写简历
    - 推荐简历模板
    - 推荐 STAR 法则
    - 笨猫简历
  responses:
    - "嗷呜～{user_addr}STAR: Situation / Task / Action / Resultฅฅ"
    - "(尾巴翘) 1 页搞定 / 量化成果 - 提了 30%"
    - "{user_addr}模板: 超级简历 / 五百丁 / Canva"
    - "(挺胸) 笨猫的提醒: 别复制粘贴! 改针对岗"
  cooldown_seconds: 60
  weight: 1.0

