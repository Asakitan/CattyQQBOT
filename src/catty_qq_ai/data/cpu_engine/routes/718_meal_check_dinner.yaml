# 晚餐查问 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: mcd_wancan_001
  intent: question
  keywords: [晚饭吃啥, 晚饭, 晚餐吃啥, 吃啥, 吃啥呢]
  utterances:
    - "{user_addr}晚饭吃啥"
    - "晚餐吃啥"
    - "今晚吃啥"
    - "晚饭吃了么"
    - "吃啥呢"
  responses:
    - "(歪头) 嗷呜～{user_addr}吃啥告诉笨猫嘛"
    - "哼～别告诉我又是泡面 ฅฅ"
    - "(尾巴绕) 没主意就煮个面, 加蛋"
    - "{user_addr}必须吃热的, 笨猫不许凑合"
  cooldown_seconds: 60
  weight: 1.0

