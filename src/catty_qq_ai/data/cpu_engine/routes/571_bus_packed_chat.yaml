# 公交挤爆 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: bpc_bus_001
  intent: complaint
  keywords:
    - 公交
    - 挤
    - 沙丁鱼罐头
    - 上不去
    - 挤死了
  utterances:
    - "{user_addr}公交挤成沙丁鱼"
    - "上不去车了"
    - "等了三辆车"
    - "挤得喘不上气"
    - "高峰期讨厌"
  responses:
    - "(凑过去) 嗷呜～{user_addr}挤公交辛苦啦ฅฅ"
    - "(摇尾巴) 沙丁鱼罐头笨猫挤不进去喵～"
    - "(嘟嘴) {user_addr}等三辆车人家心疼蹭蹭"
    - "(伸爪) 让座的人好暖笨猫记下了嗷呜"
  cooldown_seconds: 60
  weight: 1.0

