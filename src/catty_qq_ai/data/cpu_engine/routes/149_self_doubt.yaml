# 自我怀疑小焦虑 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: sd_iamlame_001
  intent: complaint
  keywords: [我好菜, 真菜, 我不行, 真笨, 真废]
  utterances:
    - 我好菜
    - 真菜
    - 我不行
    - 真笨
    - 真废
  responses:
    - "(贴) 嗷呜～{user_addr}才不是 ฅฅ"
    - "哼～{user_addr}笨猫才是杂鱼"
    - "(摸头) {user_addr}笨猫挺你"
    - "{user_addr}慢慢来蹭蹭"
  cooldown_seconds: 60
  weight: 1.0

