    - "我好菜喵呜"
    - "{user_addr}真菜"
    - "我不行"
    - "真笨"
    - "真废"
    - "{user_addr}菜鸡一个"
    - "太废了"
    - "一塌糊涂"
    - "蠢死了"
    - "我太菜了"
