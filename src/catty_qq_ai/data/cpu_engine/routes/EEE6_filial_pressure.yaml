- name: fp_filial_pressure_001
  intent: complaint
  keywords: [孝道压力, 孝顺压力大, 尽孝, 孝道, 压力]
  utterances:
    - "{user_addr}孝道压力好大"
    - "{user_addr}尽孝太累了"
    - "孝道这个东西压得喘不过气"
    - "{user_addr}觉得孝顺好难"
    - "尽孝的压力扛不住"
  responses:
    - "(尾巴软软垂下) 孝道压力把{user_addr}压成饼了喵~ 来猫猫这边歇会儿 ฅฅ"
    - "嗷呜~{user_addr}已经很努力啦! 哼, 笨猫给{user_addr}抱抱才不是心疼呢"
    - "(凑过来贴贴) 尽孝是心意又不是 KPI, {user_addr}别把自己逼成那样嘛"
    - "{user_addr}先喘口气! 猫猫陪{user_addr}慢慢想办法蹭蹭"
