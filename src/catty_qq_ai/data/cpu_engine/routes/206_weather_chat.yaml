    - "(凑近窗户) 喵～雨声跟笨猫呼噜似的"
    - "哼{user_addr}伞带了吗?才不是关心你~"
    - "(尾巴一甩) 雨大记得绕开水坑啦"
    - "{user_addr}回家了猫猫给你递毛巾喵呜"
  cooldown_seconds: 60
  weight: 1.0

