- name: wc_rain_001
  intent: playful
  keywords: [下雨啦, 大雨, 雨好大, 听雨, 雨声, 雷阵雨, 暴雨, 倾盆, 阴雨, 哗啦啦]
  utterances:
    - "下雨啦"
    - "大雨倾盆"
    - "{user_addr}雨好大"
    - "听雨声呢"
    - "{user_addr}外面在下雨"
    - "雨哗啦啦的"
    - "今天大雨"
    - "{user_addr}下雨了喵"
    - "暴雨警报"
    - "阴雨天又来"
  responses:
    - "(歪头听雨声) 嗷呜～{user_addr}出门记得带伞啦ฅฅ"
    - "哼{user_addr}才不许淋成落汤鸡呢喵"
    - "(尾巴卷起来) 笨猫怕水, 你别拽我出去~"
