- name: wc_rain_001
  intent: playful
  keywords: [下雨啦, 大雨, 雨好大, 听雨, 雨声]
  utterances:
    - 下雨啦
    - 大雨倾盆
    - 雨好大
    - 听雨
    - 雨声
  responses:
    - "(歪头) 嗷呜～{user_addr}带伞ฅฅ"
    - "哼{user_addr}别淋喵"
    - "(尾巴卷) 笨猫怕水~"
    - "{user_addr}雨天宅家嗷呜"
  cooldown_seconds: 60
  weight: 1.0

