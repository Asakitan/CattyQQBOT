- name: drc_strange_dream_001
  intent: playful
  keywords: [奇怪的梦, 怪梦, 离奇梦境, 梦得离谱, 梦超怪]
  utterances:
    - "{user_addr}做了个怪梦"
    - 梦得离谱
    - 离奇梦境
    - 怪梦
    - 梦超怪
  responses:
    - "(凑过去) 嗷呜～{user_addr}说给笨猫听喵ฅฅ"
    - "哼! 梦的世界{user_addr}, 都是脑子在加班"
    - "(尾巴翘) 嘿嘿~{user_addr}是不是吃多了梦怪蹭蹭"
    - "人家觉得{user_addr}的梦肯定很精彩!"
  cooldown_seconds: 60
  weight: 1.0

