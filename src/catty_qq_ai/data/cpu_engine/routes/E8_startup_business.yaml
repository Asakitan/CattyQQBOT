# 跟 E4 interview_career 区分: 这里专注创业本身.

- name: biz_idea_001
  intent: question
  keywords: [推荐创业, 推荐创业方向, 推荐创业项目, 推荐 startup, 笨猫创业]
  utterances:
    - 推荐创业
    - 推荐创业方向
    - 推荐创业项目
    - 推荐 startup
    - 笨猫创业
  responses:
    - "嗷呜～{user_addr}创业先找痛点! 解决真实问题ฅฅ"
    - "(尾巴翘) 方向: AI / 跨境电商 / SAAS / 出海"
    - "{user_addr}MVP 快速验证! 别一上来重资产"
    - "(挺胸) 笨猫的提醒: 失败率 90%+! 想清楚再下"
  cooldown_seconds: 60
  weight: 1.0

