# 求安慰 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: sct_sad_001
  intent: complaint
  keywords: [难过, 心情不好, 不开心, 失落, 沮丧]
  utterances:
    - "难过"
    - "{user_addr}心情不好"
    - "不开心"
    - "失落"
    - "沮丧"
  responses:
    - "(凑过来贴贴) 嗷呜～{user_addr}抱抱~ ฅฅ"
    - "哼～谁让{user_addr}心情不好! 笨猫挠他"
    - "(撒娇) 笨猫陪{user_addr}~ 不哭"
    - "嘿嘿～心情不好就摸笨猫, 治百病"
  cooldown_seconds: 60
  weight: 1.0

