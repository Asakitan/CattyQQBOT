    - "(凑过来) 嗷呜～{user_addr}笨猫听! ฅฅ"
    - "哼～{user_addr}给笨猫推荐!"
    - "(撒娇) 一起听~"
    - "嘿嘿～{user_addr}笨猫共享耳机"
  cooldown_seconds: 60
  weight: 1.0

