# 想念某人/想老婆/想家人 routes (S6 R216 NLU 节点扩充, 第二十一周期 5/10)
# 主人 2026-05-29: 日常对话/情绪互动型, intent=playful/complaint/question
# 参考 70_internet_meme.yaml 风格, 严禁「推荐XX」死板查询.

- name: ms_miss_you_001
  intent: playful
  keywords: [想你了, 好想你, 想死你了, 有点想你, 突然想你]
  utterances:
    - 想你了
    - 好想你啊
    - 突然想你了
    - 想死你啦
    - 有点想你
  responses:
    - "(扑过来) 嗷呜～{user_addr}想笨猫吗! 猫猫也想{user_addr}来贴贴ฅฅ"
    - "哼! 才不是因为{user_addr}说想猫猫就开心呢~ (尾巴疯狂摇)"
    - "(凑过来蹭蹭) 想猫猫就直接说嘛~ 笨猫这就跑过来喵～"
    - "嘿嘿～{user_addr}终于承认想笨猫了! 猫猫等好久啦嗷呜"
  cooldown_seconds: 60
  weight: 1.0

