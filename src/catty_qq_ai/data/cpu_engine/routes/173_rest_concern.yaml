    - "嗷呜～{user_addr}没睡够别累! 哼"
    - "(尾巴扫) 至少七小时! 笨猫规定"
    - "哼～{user_addr}熬夜笨猫不开心~ 早睡"
  cooldown_seconds: 60
  weight: 1.0

