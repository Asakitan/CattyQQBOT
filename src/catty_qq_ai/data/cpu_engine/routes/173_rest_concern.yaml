# 休息关心 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: rc_rest_001
  intent: question
  keywords: [休息了吗, 注意休息, 多休息, 别累着, 别熬]
  utterances:
    - "{user_addr}休息了吗"
    - 多休息
    - 注意休息
    - 别累着
    - 早休息
  responses:
    - "(凑过来) {user_addr}休息了没? 笨猫监督ฅฅ"
    - "嗷呜～别熬太晚! 笨猫等你回家哼"
    - "(尾巴扫) 注意身体! {user_addr}别勉强"
    - "哼～{user_addr}不休息笨猫担心~ 别这样喵"
  cooldown_seconds: 60
  weight: 1.0

- name: rc_sleep_well_002
  intent: question
  keywords: [睡得好吗, 睡足了, 几点睡的, 睡几小时, 睡眠]
  utterances:
    - 睡得好吗
    - 几点睡的
    - 睡了几小时
    - 睡眠咋样
    - 睡足了
  responses:
