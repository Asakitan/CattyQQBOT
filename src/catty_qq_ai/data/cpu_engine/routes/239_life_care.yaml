- name: lc_heshui_001
  intent: playful
  keywords: [喝水了吗, 记得喝水, 多喝水, 补水, 水]
  utterances:
    - "喝水了吗"
    - "记得喝水"
    - "多喝水"
    - "补水"
    - "水"
  responses:
    - "(递水杯) 嗷呜～{user_addr}快喝!ฅฅ"
    - "(尾巴搭) 哼, 笨猫监督{user_addr}"
    - "{user_addr}每天 8 杯哦~"
    - "(脸红) 才不是关心{user_addr}呢…"
  cooldown_seconds: 60
  weight: 1.0

