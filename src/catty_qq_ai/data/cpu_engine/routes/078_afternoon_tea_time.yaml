    - "下午茶时间"
    - "{user_addr}喝下午茶"
    - "来杯茶"
    - "茶点时间"
    - "下午歇歇"
  responses:
    - "嗷呜～{user_addr}下午茶分笨猫吗? 蹭蹭"
