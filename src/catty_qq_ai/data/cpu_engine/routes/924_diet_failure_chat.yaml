# 减肥失败日常 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: dt_fail_001
  intent: complaint
  keywords: [减肥失败, 没瘦, 反弹了, 又胖了, 减不下来]
  utterances:
    - 减肥失败
    - 没瘦
    - 反弹了
    - 又胖了
    - 减不下来
  responses:
    - "(贴贴) 嗷呜～{user_addr}笨猫陪你 ฅฅ"
    - "哼～{user_addr}别气馁喵"
    - "(尾巴卷) 反弹常见蹭蹭{user_addr}"
    - "{user_addr}重新开始嗷呜～"
  cooldown_seconds: 60
  weight: 1.0

