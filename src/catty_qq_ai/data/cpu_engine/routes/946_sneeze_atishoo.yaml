    - "阿嚏"
    - "{user_addr}打了个喷嚏"
    - "突然打喷嚏"
    - "鼻子好痒"
    - "刚打了喷嚏"
  responses:
    - "(被吓一跳) 嗷呜～{user_addr}吓死笨猫了, 是不是有人想你啦 ฅฅ"
    - "哼～{user_addr}打喷嚏不捂嘴, 笨猫嫌弃!"
