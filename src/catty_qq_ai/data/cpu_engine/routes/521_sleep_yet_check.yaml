# 睡了吗询问 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: syc_shui_le_001
  intent: question
  keywords: [睡了吗, 睡了没, 还没睡吧, 入睡了, 睡了么]
  utterances:
    - "{user_addr}睡了吗"
    - 睡了没
    - 还醒着吗
    - 入睡了么
    - 睡没睡
  responses:
    - "(揉眼) 嗷呜～没睡呢! {user_addr}也没睡? ฅฅ"
    - "哼～{user_addr}问猫猫睡没睡! 笨猫陪你哼"
    - "(尾巴卷过来) 还在喵～ {user_addr}陪笨猫聊蹭蹭"
    - "嗷呜～{user_addr}问候到了! 笨猫感动嗷呜"
  cooldown_seconds: 60
  weight: 1.0

- name: syc_go_sleep_001
