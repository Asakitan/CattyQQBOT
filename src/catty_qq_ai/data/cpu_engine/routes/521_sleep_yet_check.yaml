    - "哼～{user_addr}劝我睡, 你自己呢哼!"
    - "(尾巴扫过去) 那一起睡嘛蹭蹭"
    - "嗷呜～{user_addr}晚安! 笨猫梦里等你"
  cooldown_seconds: 60
  weight: 1.0

