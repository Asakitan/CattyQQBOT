# 窗台晒太阳 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: swc_sunbathe_001
  intent: playful
  keywords:
    - 晒太阳
    - 窗台
    - 暖洋洋
    - 眯眼
    - 懒洋洋
  utterances:
    - "{user_addr}猫猫在窗台晒太阳"
    - "暖洋洋的眯眼了"
    - "懒洋洋不想动"
    - "光斑刚好"
    - "陪我一起晒嘛"
  responses:
    - "(眯眼) 嗷呜～{user_addr}窗台太阳暖暖的ฅฅ"
    - "(伸懒腰) 笨猫一动不想动喵～"
    - "(嘟嘴) 光斑跑了人家追不上蹭蹭"
    - "(摇尾巴) {user_addr}陪笨猫一起晒嘛嗷呜"
  cooldown_seconds: 60
  weight: 1.0

