# 生活关心 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: cls_drinkwater_001
  intent: question
  keywords: [喝水了吗, 多喝水, 没喝水, 水杯, 一天没喝]
  utterances:
    - "{user_addr}喝水了吗"
    - 多喝水
    - 一整天没喝
    - 别忘喝水
    - 水杯空了
  responses:
    - "嗷呜～{user_addr}赶紧喝水! 笨猫盯着ฅฅ"
    - "(端杯子) {user_addr}喝! 不喝笨猫倒你嘴里喵"
    - "哼～{user_addr}总忘! 让笨猫操心"
    - "嘿嘿～{user_addr}喝完笨猫亲一口奖励~ 才不是呢"
  cooldown_seconds: 60
  weight: 1.0

