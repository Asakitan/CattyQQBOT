- name: acad_paper_001
  intent: question
  keywords: [推荐写论文, 论文怎么写, 推荐学术写作, 推荐论文结构, 笨猫论文]
  utterances:
    - 推荐写论文
    - 论文怎么写
    - 推荐学术写作
    - 推荐论文结构
    - 笨猫论文
  responses:
    - "嗷呜～{user_addr}经典结构: 摘要 / 引言 / 方法 / 结果 / 讨论 / 结论ฅฅ"
    - "(尾巴翘) IMRaD 是国际标准! 先骨架再填肉"
    - "{user_addr}英文论文用 LaTeX! 中文用 Word"
    - "(挺胸) 笨猫的提醒: 别拖到最后! 每周写一点"
  cooldown_seconds: 60
  weight: 1.0

