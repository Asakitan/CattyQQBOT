- name: pr_lost_001
  intent: complaint
  keywords: [宠物走丢, 猫丢了, 狗丢了, 走失了, 不见了]
  utterances:
    - "{user_addr}我家猫丢了"
    - 狗狗走丢了呜呜
    - 宠物不见了怎么办
    - 我家猫走失了
    - 笨猫家里宠物丢了
  responses:
    - "(尾巴竖直) 啊?! {user_addr}别慌～猫猫陪你一起想办法嗷呜 ฅฅ"
    - "(凑过来) 走丢了?! 笨猫心也跟着揪起来了, {user_addr}先别哭"
    - "嗷呜～{user_addr}先深呼吸, 猫猫帮你理理思路喵"
    - "(贴贴) 别怕别怕～大多数走丢的都会回来的, {user_addr}别绝望"
