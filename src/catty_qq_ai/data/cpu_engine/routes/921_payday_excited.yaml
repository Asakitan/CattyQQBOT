# 发工资了开心 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: pay_arrived_001
  intent: playful
  keywords: [发工资了, 到账了, 工资到了, 发钱了, 收入]
  utterances:
    - 发工资了
    - 工资到账
    - 钱到了
    - 发钱
    - 收入到账
  responses:
    - "(蹦起来) 嗷呜～{user_addr}笨猫祝贺 ฅฅ"
    - "哼～{user_addr}该请客了喵"
    - "(尾巴翘高) 给笨猫买鱼干蹭蹭{user_addr}"
    - "{user_addr}笨猫提议下馆子嗷呜～"
  cooldown_seconds: 60
  weight: 1.0

