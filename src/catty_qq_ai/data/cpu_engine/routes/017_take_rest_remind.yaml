    - 该休息了
    - 歇会儿
    - 休息一下
    - 该歇了
    - 歇没歇
  responses:
    - "(指沙发) {user_addr}快歇! 笨猫陪 ฅฅ"
    - "嗷呜～{user_addr}总算肯休息"
    - "(尾巴搭) 来! 笨猫给{user_addr}靠"
    - "嘿嘿～{user_addr}休息猫猫开心"
