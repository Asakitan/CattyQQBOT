# 公交站等车 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: bus_wait_001
  intent: complaint
  keywords: [等公交, 公交不来, 等了好久, 几路车, 公交慢]
  utterances:
    - "等公交"
    - "公交不来"
    - "等了好久"
    - "几路车"
    - "{user_addr}公交慢"
  responses:
    - "(尾巴绕) 嗷呜～{user_addr}查实时公交嘛"
    - "(凑近) 哼～等公交最磨耐心"
    - "(贴贴) 笨猫陪你等, 聊聊天"
    - "(凑近) 别急嗷, 快到啦ฅฅ"
  cooldown_seconds: 60
  weight: 1.0

