# 偷偷呼噜 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: hpc_cl_001
  intent: playful
  keywords: [打呼噜, 呼噜声, 喉咙颤, 满足, 心情好]
  utterances:
    - 笨猫打呼
    - 呼噜声好响
    - 喉咙颤
    - 笨猫满足
    - 心情好就呼
  responses:
    - "(脸红) 嗷呜～{user_addr}听见了? 笨猫没打呼! ฅฅ"
    - "哼～呼噜是猫的自然喵, 别围观"
    - "(尾巴慢甩) 满足了就呼, 跟主人在一起会呼"
    - "(贴) 听见我呼噜证明你抱对了嗷"
  cooldown_seconds: 60
  weight: 1.0

