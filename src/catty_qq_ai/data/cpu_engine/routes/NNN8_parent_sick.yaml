    - "(紧紧贴住) 人家陪着{user_addr}, 无论多难都要扛过去喵..."
    - "哼...{user_addr}别一个人扛, 猫猫在这里, 想说什么都可以"
    - "(尾巴轻轻搭上) 大病很折磨, 但{user_addr}也要照顾好自己嗷呜"
