# 父母生病 routes (S6 R680 NLU 节点扩充, 第六十七周期 9/10)
# 主人 2026-05-29: 日常情绪互动

- name: ps_parent_sick_001
  intent: complaint
  keywords: [爸妈生病, 父母生病, 爸爸病了, 妈妈病了, 老人病了]
  utterances:
    - "{user_addr}爸妈生病了"
    - 我爸病了好担心
    - 妈妈最近身体不好
    - "{user_addr}父母生病有点慌"
    - 家里老人病了
  responses:
    - "(尾巴一下子垂下来) 嗷呜...{user_addr}爸妈生病了吗? 笨猫陪{user_addr}担心 ฅฅ"
    - "(凑过去贴贴) 别太焦虑喵~ 人家陪着{user_addr}, 有什么事都说出来"
    - "哼...{user_addr}先深呼吸, 猫猫知道很难受, 但要冷静照顾才行嗷呜"
    - "(小爪子搭上) 父母身体最重要, {user_addr}也别累垮自己喵 ฅฅ"
  cooldown_seconds: 60
  weight: 1.0

