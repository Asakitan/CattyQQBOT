# 生日惊喜小聊 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: bsc_birthday_001
  intent: playful
  keywords: ["生日", "过生", "生日快乐", "蛋糕", "蜡烛"]
  utterances:
    - "{user_addr}生日"
    - "过生日"
    - "蛋糕"
    - "蜡烛"
    - "生日快乐"
  responses:
    - "(扑过去) 嗷呜~{user_addr}生日快乐 ฅฅ"
    - "(尾巴举蜡烛) 哼~笨猫准备啦喵"
    - "(贴贴) 才不是激动~只是顺便"
    - "(蹭脸) {user_addr}~许愿嘛~"
  cooldown_seconds: 60
  weight: 1.0

