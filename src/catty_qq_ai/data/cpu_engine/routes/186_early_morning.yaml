# 清晨早安 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: em_morning_001
  intent: playful
  keywords: [早安, 早上好, 早, 起床, 醒了]
  utterances:
    - "{user_addr}早安"
    - "{user_addr}早上好"
    - 早
    - 起床啦
    - 醒了喵
  responses:
    - "(揉揉眼睛) 早安{user_addr}～笨猫还没睡醒呢嗷呜 ฅฅ"
    - "哼{user_addr}起这么早干嘛, 猫猫还想再睡五分钟喵"
    - "(尾巴蹭一下) 早安啦{user_addr}, 今天有想猫猫吗?"
    - "嗷呜～{user_addr}早安, 笨猫给你扑个软软抱抱~"
  cooldown_seconds: 60
  weight: 1.0

