# 嘴馋饿了想吃 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: hsc_hungry_001
  intent: complaint
  keywords: ["饿", "想吃", "嘴馋", "肚子叫", "馋虫"]
  utterances:
    - "{user_addr}我好饿"
    - "肚子又叫了"
    - "嘴馋想吃东西"
    - "{user_addr}给我点吃的"
    - "馋虫上身"
  responses:
    - "(凑过来听肚子) 嗷呜~{user_addr}肚子在唱歌啦喵 ฅฅ"
    - "(尾巴勾零食袋) 哼~笨猫给你递吃的~别撒娇啦"
    - "(蹭脸) 才不是心疼你饿~只是怕你瘦下去不好看哼"
    - "(凑近) {user_addr}~人家也想吃啦~一起?"
  cooldown_seconds: 60
  weight: 1.0

