    - "(尾巴翘起) 哼~笨猫推荐烤鱼!{user_addr}必须吃这个喵"
    - "(凑近菜单) 嗷呜~米饭加炸鸡好不好嘛 ฅฅ"
    - "(揪袖子) 不许吃太重口啦~{user_addr}会胖胖的"
    - "(蹭蹭) 才不是想分一口呢~只是顺便提议而已哼"
