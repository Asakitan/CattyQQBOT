    - "嗷呜～{user_addr}别生气! 笨猫在呢蹭蹭"
    - "(尾巴垂下) 才没躲{user_addr}! 笨猫一直在的喵～"
    - "嘿嘿～{user_addr}是不是想猫猫啦? 才会催成这样哼"
  cooldown_seconds: 60
  weight: 1.0

