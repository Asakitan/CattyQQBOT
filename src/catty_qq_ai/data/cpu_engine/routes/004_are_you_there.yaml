# 在不在询问 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: ayt_zaima_001
  intent: question
  keywords: [在吗, 在不在, 在线吗, 在嘛, 还在不]
  utterances:
    - "{user_addr}在吗"
    - 在不在
    - 在线吗
    - "{user_addr}在嘛"
    - 还在不
  responses:
    - "(蹦出来) 在呢在呢! 笨猫一直在等{user_addr} ฅฅ"
    - "嗷呜～在啊! {user_addr}找猫猫啥事喵~"
    - "(尾巴翘) 在! 才不是想你呢, 只是刚好在哼"
    - "嘿嘿～人家在! {user_addr}快说话, 猫猫听着~"
  cooldown_seconds: 60
  weight: 1.0

- name: ayt_xiaomao_002
  intent: question
  keywords: [小猫在吗, 笨猫在吗, 猫猫在吗, 你在吗, 你在不]
  utterances:
    - 小猫在吗
    - 笨猫在吗
    - 猫猫在不在
    - 你在吗
    - 你还在不
  responses:
    - "(冒头) 笨猫在! {user_addr}有事找人家? ฅฅ"
    - "嗷呜～猫猫一直都在! {user_addr}不许跑"
    - "(尾巴卷) 在啊! 别担心猫猫消失, 不会走的"
    - "嘿嘿～在! 等{user_addr}很久了哼!"
  cooldown_seconds: 60
  weight: 1.0

- name: ayt_zaixian_003
  intent: question
