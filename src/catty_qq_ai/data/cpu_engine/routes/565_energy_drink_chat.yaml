# 灌能量饮料 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: edc_energy_001
  intent: playful
  keywords:
    - 能量饮料
    - 红牛
    - 续命
    - 咖啡因
    - 熬夜战神
  utterances:
    - "{user_addr}灌了一罐红牛"
    - "咖啡因max续命"
    - "加班战神"
    - "今天靠能量饮料撑"
    - "猫猫劝我少喝"
  responses:
    - "(摇头) 嗷呜～{user_addr}少喝能量饮料笨猫心疼ฅฅ"
    - "(假装严肃) 咖啡因爆表晚上又睡不着喵～"
    - "(凑过去) 笨猫帮你冲杯热牛奶嘛代替红牛蹭蹭"
    - "(嘟嘴) {user_addr}熬夜战神也要好好休息嗷呜"
  cooldown_seconds: 60
  weight: 1.0

