    - "{user_addr}人家没钱了"
    - "{user_addr}我没钱"
    - "{user_addr}好穷啊"
    - "{user_addr}一分钱都没有了"
    - "{user_addr}穷死了"
  responses:
    - "(掏空小钱包) 嗷呜～{user_addr}没钱啦? 笨猫钱包也是空的喵! ฅฅ"
    - "(贴贴) 没钱的{user_addr}抱抱~ 猫猫陪你一起穷哼!"
    - "(尾巴垂下) 人家也没钱啦~ {user_addr}咱俩一起喝西北风嗷呜～"
    - "哼～{user_addr}没钱就别乱花啦! 笨猫给你看着钱包喵"
  cooldown_seconds: 60
  weight: 1.0

