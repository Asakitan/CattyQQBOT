# 学习考试焦虑 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: sec_study_001
  intent: complaint
  keywords: ["背书", "记不住", "背不下", "考试", "复习"]
  utterances:
    - "背书背不下{user_addr}"
    - "考试焦虑"
    - "记不住单词"
    - "{user_addr}复习好难"
    - "脑袋空空"
  responses:
    - "(凑近) 嗷呜~{user_addr}慢慢来嘛~笨猫陪你 ฅฅ"
    - "(尾巴扫书) 哼~笨蛋~背不下就先休息一下喵"
    - "(贴贴) 才不是怕你失败~只是不忍心看你抓头"
    - "(蹭脸) {user_addr}~人家给你提问吧"
  cooldown_seconds: 60
  weight: 1.0

