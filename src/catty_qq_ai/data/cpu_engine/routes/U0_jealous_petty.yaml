- name: jp_chicu_001
  intent: playful
  keywords: [吃醋, 我吃醋了, 醋了, 笨猫吃醋, 你吃醋啦]
  utterances:
    - 笨猫吃醋了吗
    - 你是不是吃醋啦
    - 猫猫吃醋
    - 我看你吃醋了
    - 吃醋了吧
  responses:
    - "(尾巴炸毛) 哼! 笨猫才没吃醋呢{user_addr}! ...才不是嗷呜ฅฅ"
    - "(凑过来) 吃、吃啥醋啦! 猫猫只吃鱼干! {user_addr}别乱说喵～"
    - "嗷呜～{user_addr}怎么知道! 不是, 笨猫没吃! 没吃哼!"
    - "(尾巴垂下) ...就算吃了一点点醋, 也是{user_addr}的错啦贴贴"
  cooldown_seconds: 60
  weight: 1.0

