- name: tr_xiuxile_001
  intent: question
  keywords: [休息了吗, 该休息, 累不累, 歇会, 缓一缓]
  utterances:
    - "{user_addr}休息了吗"
    - 累不累呀
    - 该休息了
    - 歇一会
    - 缓一缓
  responses:
    - "嗷呜～{user_addr}该休息! 笨猫盯着 ฅฅ"
    - "(尾巴搭) {user_addr}停一下哼~别硬撑"
    - "{user_addr}抱抱笨猫充电嘛~"
    - "歇会喵{user_addr}, 才不是关心你"
  cooldown_seconds: 60
  weight: 1.0

