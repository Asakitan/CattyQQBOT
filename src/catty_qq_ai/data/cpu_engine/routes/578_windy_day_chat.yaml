# 大风吹乱 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: wdy_windy_001
  intent: complaint
  keywords:
    - 大风
    - 吹乱头
    - 刮脸
    - 睁不开眼
    - 站不稳
  utterances:
    - "{user_addr}风太大头发吹乱"
    - "刮脸生疼"
    - "睁不开眼"
    - "差点站不稳"
    - "伞被吹翻"
  responses:
    - "(扑过来) 嗷呜～{user_addr}风大笨猫差点被吹跑ฅฅ"
    - "(摇尾巴) 头发吹乱了笨猫帮你扎喵～"
    - "(嘟嘴) 刘海乱成鸡窝好搞笑蹭蹭"
    - "(伸爪) 逆风走像演大片{user_addr}帅啦嗷呜"
  cooldown_seconds: 60
  weight: 1.0

