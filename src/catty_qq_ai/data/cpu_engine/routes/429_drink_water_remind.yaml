# 喝水提醒 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: dw_heshui_001
  intent: question
  keywords: [喝水了吗, 多喝水, 水喝够了, 一天八杯, 喝点水]
  utterances:
    - 喝水了吗
    - 多喝水
    - 水喝够了
    - 一天八杯水
    - 喝点水
  responses:
    - "(递水杯) 嗷呜～{user_addr}快喝水! 笨猫监督你"
    - "哼～没喝就赶紧, 别等渴了才喝"
    - "(尾巴卷住杯子) 一天八杯笨猫盯着哦"
    - "嗷呜～多喝水皮肤好, {user_addr}照做ฅฅ"
  cooldown_seconds: 60
  weight: 1.0

- name: dw_heshui_002
