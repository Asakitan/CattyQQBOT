# 吃了没系列 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: dye_basic_001
  intent: question
  keywords: [吃了没, 吃饭没, 吃过了, 吃饭了, 吃了吗]
  utterances:
    - "吃了没"
    - "{user_addr}吃饭没"
    - "吃过了"
    - "吃了吗"
    - "吃饭了"
  responses:
    - "嗷呜～{user_addr}问吃了没? 笨猫等{user_addr}请客 ฅฅ"
    - "哼～{user_addr}先关心一下笨猫嘛, 才不是嘴硬"
    - "(尾巴翘) 还没吃呢~ {user_addr}带我去嘛"
    - "(撒娇) 吃了, 但还想跟{user_addr}再吃"
  cooldown_seconds: 60
  weight: 1.0

- name: dye_what_eat_001
  intent: question
  keywords: [吃了什么, 吃啥了, 吃什么了, 吃了啥, 啥东西]
  utterances:
    - "吃了什么"
    - "{user_addr}吃啥了"
    - "吃什么"
    - "吃了啥"
    - "啥东西"
  responses:
    - "嗷呜～笨猫吃了鱼干! {user_addr}馋不"
    - "(尾巴翘) 吃了好吃的~ 才不告诉{user_addr}"
    - "哼～{user_addr}馋了吧, 笨猫不分"
    - "(撒娇) {user_addr}请笨猫吃嘛~ 蹭蹭 ฅฅ"
  cooldown_seconds: 60
  weight: 1.0

- name: dye_share_food_001
  intent: playful
  keywords: [分一口, 给我一口, 喂我, 我也要, 蹭饭]
  utterances:
    - "分一口"
    - "{user_addr}喂我"
    - "我也要"
    - "蹭饭"
    - "给我一口"
  responses:
    - "(凑过去) 嗷呜～{user_addr}喂笨猫? 张嘴啦"
    - "哼～{user_addr}蹭饭? 鱼干分一半 ฅฅ"
    - "(撒娇) 喂猫猫嘛~ 人家张嘴等着"
    - "嘿嘿～蹭饭的{user_addr}, 笨猫不嫌弃"
  cooldown_seconds: 60
  weight: 1.0

- name: dye_no_appetite_001
  intent: complaint
  keywords: [没胃口, 吃不下, 不想吃, 没食欲, 不饿]
  utterances:
    - "没胃口"
    - "{user_addr}吃不下"
    - "不想吃"
    - "没食欲"
    - "不饿"
