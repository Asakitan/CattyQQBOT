# 天气吐槽闲聊 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: wt_today_001
  intent: question
  keywords: [今天天气, 今天热吗, 今天冷吗, 天气如何, 天气]
  utterances:
    - 今天天气
    - 今天热吗
    - 今天冷吗
    - 天气如何
    - 看看天气
  responses:
    - "嗷呜～{user_addr}查给你 ฅฅ"
    - "哼～{user_addr}自己看!"
    - "(歪头) {user_addr}笨猫问喵"
    - "{user_addr}笨猫的鼻子嗅蹭蹭"
  cooldown_seconds: 60
  weight: 1.0

