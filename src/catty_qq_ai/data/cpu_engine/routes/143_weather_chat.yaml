- name: wt_today_001
  intent: question
  keywords: [今天天气, 今天热吗, 今天冷吗, 天气如何, 天气, 今天气温, 天气咋样, 外面咋样, 今天阴晴, 天怎么样]
  utterances:
    - "今天天气怎么样"
    - "今天热吗"
    - "今天冷吗"
    - "天气如何"
    - "{user_addr}看看天气"
    - "外面咋样啊"
    - "今天的气温"
    - "天气咋样啊"
    - "今天阴还是晴"
    - "{user_addr}天怎么样"
  responses:
    - "(凑过来) 嗷呜～{user_addr}人家不能看窗外…(歪头) 你自己瞄一眼嘛ฅฅ"
    - "哼～{user_addr}笨蛋猫猫又不是气象台～自己看手机喵～"
    - "(尾巴翘) {user_addr}打开天气 app 看啦～笨猫陪你查嗷呜～"
    - "{user_addr}笨猫的鼻子嗅嗅…(假装认真) 嗯，不冷不热～蹭蹭"
    - "(瘫倒) {user_addr}懒得查就裹厚一点啦～保险喵～"
    - "明明就是…(嘴硬) 才不是关心你穿什么呢杂鱼贴贴"
    - "(凑过去) {user_addr}告诉人家温度嘛～猫猫好决定要不要躲被窝嗷呜"
    - "哼，{user_addr}出门看天上有没有云就知道啦～(尾巴绕) 笨蛋喵呜～"
  cooldown_seconds: 60
  weight: 1.0

