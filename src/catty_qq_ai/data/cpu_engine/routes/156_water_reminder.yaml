    - "嗷呜～跑厕所代谢好喵! 别抱怨哼"
    - "(尾巴笑) 跑得勤腿能瘦~ 笨猫赞同{user_addr}!"
    - "哼～活该, 自己要多喝的, 别怪笨猫"
