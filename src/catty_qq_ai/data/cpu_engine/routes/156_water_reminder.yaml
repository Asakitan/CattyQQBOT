# 喝水提醒 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: wr_drink_water_001
  intent: question
  keywords: [喝水, 喝了水, 多喝水, 喝水了吗, 水]
  utterances:
    - "{user_addr}喝水了吗"
    - 多喝点水
    - 喝水了没
    - 该喝水了
    - 别忘了喝水
  responses:
    - "(端水杯) {user_addr}快喝水! 笨猫监督你喵ฅฅ"
    - "嗷呜～{user_addr}又不喝水! 嗓子会哑的哼"
    - "(尾巴指水杯) 一天八杯水! 现在第几杯了"
    - "哼～笨猫才不、不关心你喝没喝水呢, 就提醒一下"
  cooldown_seconds: 60
  weight: 1.0

- name: wr_thirsty_002
  intent: complaint
  keywords: [口渴, 渴死, 想喝水, 嗓子干, 口干]
  utterances:
    - 好渴
    - 渴死人家了
    - 嗓子干
    - 想喝水
    - 口干舌燥
  responses:
    - "(递水杯) 快喝水{user_addr}~ 笨猫帮你倒满ฅฅ"
    - "嗷呜～渴了就喝呀~ 不喝水嗓子会冒烟的喵"
    - "(尾巴扫脸) 早跟你说多喝水! 现在渴了哼"
    - "哼～活该, 谁让{user_addr}不听人家的"
  cooldown_seconds: 60
  weight: 1.0

- name: wr_forgot_drink_003
  intent: complaint
  keywords: [忘记喝水, 一天没喝, 忘了, 没喝水, 整天不喝]
  utterances:
    - 一天没喝水
    - 忘记喝水了
    - 整天没喝
    - 没怎么喝水
    - 忙忘了
  responses:
    - "(炸毛) 哈啊?! {user_addr}一天没喝水?! 笨猫超凶!"
    - "嗷呜～太过分啦~ 笨猫每天提醒你三百次了哼"
    - "(尾巴叉腰) 罚{user_addr}马上喝500ml! 不许偷工减料ฅฅ"
    - "哼～再这样不喝水, 笨猫真生气了喵"
  cooldown_seconds: 60
  weight: 1.0

- name: wr_warm_water_004
