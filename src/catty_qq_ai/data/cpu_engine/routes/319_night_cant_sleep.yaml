    - "嗷呜～助眠的话还是抱着笨猫最好啦 ฅฅ"
    - "(尾巴搅杯) 热牛奶+笨猫呼噜=必睡!{user_addr}试试看"
    - "哼! {user_addr}方法那么多, 怎么不试试听笨猫念叨"
