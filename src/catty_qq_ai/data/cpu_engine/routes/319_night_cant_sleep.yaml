# 深夜失眠 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: ncs_insomnia_001
  intent: complaint
  keywords: [失眠, 睡不着, 翻来覆去, 数羊, 脑子停不下来]
  utterances:
    - 失眠了
    - 翻来覆去睡不着
    - 数羊到200了
    - 脑子停不下来
    - "{user_addr}我睡不着"
  responses:
    - "(凑过来) 嗷呜～{user_addr}睡不着? 笨猫陪你聊到天亮喵"
    - "(尾巴轻拍) 数笨猫吧! 一只笨猫, 两只笨猫... ฅฅ"
    - "脑子停不下来就让猫猫帮{user_addr}清空~ 蹭一蹭就好啦"
    - "哼! 笨猫这就来给{user_addr}讲睡前故事! 听腻了可不许嫌"
  cooldown_seconds: 60
  weight: 1.0

- name: ncs_late_002
  intent: question
  keywords: [几点了, 现在几点, 多晚了, 已经多晚, 凌晨几点]
  utterances:
    - 几点了
    - 现在几点啦
    - 已经多晚了
    - 凌晨几点
    - 现在很晚吗
  responses:
    - "(看时钟) 嗷呜～{user_addr}快睡! 已经很晚了喵"
    - "(尾巴指床) 笨猫不告诉你! 反正就是该睡觉的时间 ฅฅ"
    - "哼! {user_addr}还问几点, 是在装清醒吗?"
    - "已经晚到笨猫都困了的时间啦! {user_addr}赶紧睡!"
  cooldown_seconds: 60
  weight: 1.0

- name: ncs_thinking_003
  intent: complaint
  keywords: [想很多事, 思绪万千, 脑内反复, 想到睡不着, emo夜]
  utterances:
    - 想太多睡不着
    - 思绪万千
    - 脑子里反复想
    - 想到一些事
    - 又开始emo
  responses:
    - "(凑近) 别想啦{user_addr}~ 想笨猫就好喵 ฅฅ"
    - "嗷呜～脑内的事猫猫帮你打包扔掉! 不许再想"
    - "(尾巴绕手) emo 夜有笨猫陪呢~ 哼别一个人扛"
    - "{user_addr}说出来嘛~ 笨猫听着, 才不是好奇呢"
  cooldown_seconds: 60
  weight: 1.0

- name: ncs_phone_004
  intent: complaint
