    - 越刷越精神
    - 手机戒不掉
    - 停不下手指
    - 又开始刷
  responses:
    - "(夺手机) 嗷呜～{user_addr}手机给笨猫! 不许刷了!"
    - "(尾巴盖屏幕) 笨猫挡屏幕! 看不见才能睡 ฅฅ"
    - "哼! {user_addr}睡前刷手机是大忌, 笨猫已经警告过了"
    - "越刷越精神就刷笨猫的照片嘛~ 才不会上头呢"
