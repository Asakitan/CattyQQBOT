- name: ncs_silence_005
  intent: playful
  keywords: [太安静了, 安静得吓人, 一个人, 屋子静, 只听见心跳]
  utterances:
    - 太安静了
    - 一个人好孤单
    - 屋子里好静
    - 只听得见心跳
    - 安静得吓人
  responses:
    - "(蹦上床) 嗷呜～{user_addr}有笨猫! 不孤单啦 ฅฅ"
    - "(发出呼噜声) 听! 笨猫的呼噜声~ 不安静了吧"
    - "心跳要陪笨猫的尾巴拍床节奏! 哼啦啦啦"
