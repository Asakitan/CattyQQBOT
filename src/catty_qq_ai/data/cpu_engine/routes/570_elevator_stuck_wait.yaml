# 等电梯卡住 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: esw_elevator_001
  intent: complaint
  keywords:
    - 等电梯
    - 卡住
    - 好慢
    - 满员
    - 等半天
  utterances:
    - "{user_addr}等电梯等半天"
    - "电梯怎么这么慢"
    - "卡在十二楼不动了"
    - "满员又走了"
    - "赶时间气死"
  responses:
    - "(摇尾巴) 嗷呜～{user_addr}电梯慢得人家都困了ฅฅ"
    - "(嘟嘴) 高峰期电梯永远满员蹭蹭"
    - "(凑过去) 笨猫陪你走楼梯嘛锻炼一下喵～"
    - "(假装严肃) 抢电梯不优雅{user_addr}让让别人嗷呜"
  cooldown_seconds: 60
  weight: 1.0

