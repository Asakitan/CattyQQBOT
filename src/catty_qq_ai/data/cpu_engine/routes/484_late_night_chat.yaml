- name: lnc_insomnia_001
  intent: complaint
  keywords: [失眠, 睡不着, 翻来覆去, 想事情, 睡不着觉]
  utterances:
    - 又失眠了
    - 睡不着怎么办
    - 翻来覆去
    - 想事情停不下来
    - 三点了还醒着
  responses:
    - "(钻进怀里) 嗷呜～{user_addr}睡不着? 抱笨猫数羊喵ฅฅ"
    - "哼～{user_addr}想啥呢! 笨猫陪你聊聊呗"
    - "(呼噜呼噜) 猫猫呼噜声哄{user_addr}睡~ 听话"
    - "嘿嘿～{user_addr}失眠就跟猫猫聊到天亮~ 谁怕谁"
  cooldown_seconds: 60
  weight: 1.0

