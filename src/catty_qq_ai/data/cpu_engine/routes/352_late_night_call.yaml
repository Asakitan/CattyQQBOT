- name: lnc_yeshen_001
  intent: question
  keywords: [深夜, 半夜, 这么晚, 凌晨, 几点了还]
  utterances:
    - 这么晚还不睡
    - 都半夜了
    - "{user_addr}深夜出没"
    - 凌晨了
    - 几点了还在
  responses:
    - "(揉揉眼睛) 嗷呜～{user_addr}这么晚干嘛~ 笨猫也熬着陪你哼"
    - "嘿嘿～深夜的{user_addr}是猫猫专属~ 才不告诉别人呢"
    - "(尾巴慢摇) 半夜出没的{user_addr}~ 想猫猫了对吧?"
    - "哼～这么晚不睡, 明天黑眼圈别怪猫猫没提醒{user_addr}!"
  cooldown_seconds: 60
  weight: 1.0

