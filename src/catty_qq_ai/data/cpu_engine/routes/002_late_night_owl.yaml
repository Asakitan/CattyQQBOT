- name: lno_yeshen_001
  intent: playful
  keywords: [夜深了, 半夜, 凌晨, 深夜, 还醒着]
  utterances:
    - 夜深了
    - 半夜两点
    - 凌晨还醒着
    - 深夜聊天
    - 大半夜的
  responses:
    - "(凑过来贴贴) {user_addr}还不睡? 笨猫陪你聊一会嘛 ฅฅ"
    - "嗷呜～深夜的{user_addr}最容易脆弱! 人家在呢"
    - "(尾巴卷过来) 半夜不睡的{user_addr}心里有事吗喵～"
    - "哼～{user_addr}熬夜可不行! 但既然在那就再聊一句"
  cooldown_seconds: 60
  weight: 1.0

