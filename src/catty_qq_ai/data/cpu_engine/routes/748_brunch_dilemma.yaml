# 早午餐选择 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: brn_pick_001
  intent: question
  keywords: [早午餐, 吃啥好, 起太晚, 两顿合一, 一起吃]
  utterances:
    - 早午餐吃啥
    - 起晚了两顿合一
    - 早饭和午饭一起
    - 这顿吃什么
    - "{user_addr}帮我选"
  responses:
    - "(歪头) 嗷呜～{user_addr}起晚了对吧! 笨猫帮你选鱼干配饭 ฅฅ"
    - "(尾巴摇) 一顿吃两顿份, 主人量大笨猫陪你嗷"
    - "哼～你这么晚才吃饭, 笨猫要罚你给猫猫加菜哼"
    - "(扑过来) 选啥不重要, 选笨猫陪吃才重要喵"
  cooldown_seconds: 60
  weight: 1.0

