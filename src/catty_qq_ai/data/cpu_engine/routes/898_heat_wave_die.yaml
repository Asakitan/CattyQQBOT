- name: hw_resi_001
  intent: complaint
  keywords: [热死, 太热, 40度, 高温, 烤焦]
  utterances:
    - "热死了"
    - "{user_addr}40度"
    - "高温"
    - "烤焦"
    - "热到融化"
  responses:
    - "(扇风) 嗷呜～{user_addr}笨猫给你扇! ฅฅ"
    - "哼～开空调救命"
    - "(尾巴扫) 别出门"
    - "猫猫毛都湿透了喵~"
  cooldown_seconds: 60
  weight: 1.0

