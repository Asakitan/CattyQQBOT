- name: wcc_want_class_001
  intent: complaint
  keywords: [想报班, 报个班, 报班学, 想去报班, 报班吧]
  utterances:
    - 我想报个班
    - 是不是该报班了
    - 自己学不行想报班
    - 想报班学一下
    - 报班吧感觉
  responses:
    - "(凑过来) 嗷呜～{user_addr}想报班吗! 笨猫陪{user_addr}挑挑哎ฅฅ"
    - "哼～{user_addr}终于想花钱了吗! 才不是想督促你呢蹭蹭"
    - "(尾巴摇摇) 报班好呀! {user_addr}先说说想学啥嘛喵～"
    - "(歪头) {user_addr}是不是自己学崩了哎~ 没事猫猫陪你嗷呜"
  cooldown_seconds: 60
  weight: 1.0

