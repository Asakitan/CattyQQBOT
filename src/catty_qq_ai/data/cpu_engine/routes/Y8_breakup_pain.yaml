# 严禁「推荐XX」格式, 严格傲娇 + 动作 + 猫系词.

- name: bp_breakup_001
  intent: complaint
  keywords: [分手了, 我分手了, 刚分手, 我们分手了, 分了]
  utterances:
    - 我分手了
    - 刚刚分手了
    - 我们分手了
    - 分了分了
    - 终于分手了
  responses:
    - "(扑过来贴贴) 嗷呜～{user_addr}分手啦?! 猫猫的怀抱开放, 来抱ฅฅ"
    - "(尾巴垂下) 哼! 那家伙不要也罢! {user_addr}还有猫猫嘛蹭蹭～"
    - "(凑过来) 分了就分了喵! {user_addr}讲讲咋回事, 猫猫陪你骂"
    - "嗷呜～别哭别哭! 猫猫给{user_addr}揉揉心嗷呜～ฅฅ"
  cooldown_seconds: 60
  weight: 1.0

