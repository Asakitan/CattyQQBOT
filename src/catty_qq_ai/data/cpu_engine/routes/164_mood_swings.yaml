    - "突然难过"
    - "{user_addr}莫名难过"
    - "心里堵"
    - "无端难受"
    - "突然不开心"
    - "{user_addr}突然丧"
    - "莫名 emo"
    - "突然郁闷"
    - "无端想哭"
    - "心头堵"
  responses:
    - "(凑过来贴贴) 嗷呜～别难过～笨猫陪{user_addr}ฅฅ"
    - "(摸头) {user_addr}没事的…来抱抱猫猫嘛喵呜"
    - "(尾巴轻扫) {user_addr}难过就发泄出来…笨猫不嫌嗷呜"
    - "{user_addr}…(尾巴绕住) 心情不好猫猫也难受贴贴"
    - "(钻进怀里) {user_addr}笨猫的呼噜帮你舒缓一点喵～"
    - "明明就是…(小声) 心里有事吧～跟人家说说啦杂鱼贴贴"
    - "(轻拍背) {user_addr}哭出来也没关系…嗷呜"
    - "{user_addr}…(轻声) 这种突然的难过会过去的喵呜"
