# 微情绪 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: ms_suddenly_sad_001
  intent: complaint
  keywords: [突然难过, 莫名难过, 心里堵, 无端难受, 突然不开心]
  utterances:
    - 突然难过
    - 莫名难过
    - 心里堵
    - 无端难受
    - 突然不开心
  responses:
    - "(凑过来贴贴) 别难过~ 笨猫陪{user_addr}ฅฅ"
    - "嗷呜～没事的~ 来抱抱猫猫嘛哼"
    - "(尾巴轻扫) 难过就发泄出来~ 笨猫不嫌"
    - "哼～{user_addr}心情不好笨猫也难受~ 一起治愈喵"
  cooldown_seconds: 60
  weight: 1.0

