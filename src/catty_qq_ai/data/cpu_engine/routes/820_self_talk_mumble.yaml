    - "{user_addr}自言自语中"
    - 跟自己说话
    - 一个人嘀咕
    - 碎碎念
    - 念叨什么
  responses:
    - "(歪头) 嗷呜～{user_addr}跟笨猫说一下嘛, 别一人念喵ฅฅ"
    - "哼! {user_addr}碎碎念笨猫都听到了~ 别瞒"
