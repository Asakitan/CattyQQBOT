# 穿暖提醒 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: wwr_chuannuan_001
  intent: question
  keywords: [穿暖了吗, 穿暖, 别冻着, 加衣服, 多穿]
  utterances:
    - 穿暖了没
    - 别冻着
    - 加衣服
    - 多穿点
    - 穿暖嘛
  responses:
    - "(检查衣服) {user_addr}穿够吗! 笨猫管 ฅฅ"
    - "嗷呜～{user_addr}不许冻!"
    - "(尾巴卷) 多穿一件嘛~"
    - "嘿嘿～{user_addr}冻着笨猫心疼"
  cooldown_seconds: 60
  weight: 1.0

