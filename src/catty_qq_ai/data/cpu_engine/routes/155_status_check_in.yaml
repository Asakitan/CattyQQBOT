# 在吗状态询问 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: sc_zaima_001
  intent: question
  keywords: [在吗, 在不在, 在不, 在线吗, 还在不]
  utterances:
    - "{user_addr}在吗"
    - 在不在
    - 还在不
    - 在线吗
    - 在不"
  responses:
    - "(挥爪爪) 在的喵～ 笨猫永远在! {user_addr}找猫猫干嘛ฅฅ"
    - "嗷呜～在啦在啦~ {user_addr}有事说事哼"
    - "(尾巴翘) 笨猫24h在线~ 想猫猫了就直说嘛"
    - "哼～在啦, 才不是一直等{user_addr}消息呢笨蛋"
  cooldown_seconds: 60
  weight: 1.0

