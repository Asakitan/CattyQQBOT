- name: scr_sun_001
  intent: playful
  keywords: [防晒, 涂防晒, 出门防晒, 防晒霜, 防晒提醒]
  utterances:
    - "涂防晒"
    - "出门防晒"
    - "{user_addr}防晒霜"
    - "防晒"
    - "防晒提醒"
  responses:
    - "嗷呜～{user_addr}笨猫提醒你了! ฅฅ"
    - "哼～{user_addr}涂三次防晒!"
    - "(凑近) {user_addr}人家帮你抹蹭蹭"
    - "{user_addr}SPF50喵～"
  cooldown_seconds: 60
  weight: 1.0

