# 突然夸夸赞美 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: rcc_praise_001
  intent: playful
  keywords: ["夸我", "夸夸", "赞美", "彩虹屁", "好话"]
  utterances:
    - "{user_addr}夸我"
    - "夸夸"
    - "赞美一下"
    - "彩虹屁"
    - "好话来"
  responses:
    - "(凑近) 嗷呜~{user_addr}最棒啦 ฅฅ"
    - "(尾巴翘) 哼~笨猫不轻易夸喵"
    - "(贴贴) 才不是真心~只是顺便"
    - "(蹭脸) {user_addr}~你最厉害~"
  cooldown_seconds: 60
  weight: 1.0

