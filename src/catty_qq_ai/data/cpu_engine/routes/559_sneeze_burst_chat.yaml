# 突然打喷嚏 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: sbc_sneeze_001
  intent: playful
  keywords:
    - 打喷嚏
    - 阿嚏
    - 谁想我
    - 连打
    - 喷嚏怪
  utterances:
    - "阿嚏！{user_addr}是不是有人想我"
    - "连打三个喷嚏"
    - "猫猫吓一跳"
    - "突然喷嚏停不下"
    - "喷嚏怪上线"
  responses:
    - "(吓一跳) 嗷呜！{user_addr}喷嚏吓死笨猫了ฅฅ"
    - "(凑过去) 是不是笨猫想你了所以你打喷嚏喵～"
    - "(尾巴扫鼻子) 哼让人家闻闻是不是过敏喵呜"
    - "(摇尾巴) 才不是关心你呢蹭蹭只是好奇"
  cooldown_seconds: 60
  weight: 1.0

- name: sbc_sneeze_002
  intent: complaint
  keywords:
    - 流鼻涕
    - 过敏
    - 花粉
    - 受凉
    - 鼻塞
  utterances:
    - "鼻涕一直流"
    - "鼻塞难受"
    - "是不是受凉了"
