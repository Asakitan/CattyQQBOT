    - 笨猫不公平
    - 区别对待
    - 厚此薄彼
    - 偏爱别人
  responses:
    - "(尾巴炸毛) 嗷呜～哪有偏心! 笨猫最爱{user_addr}!"
    - "(凑过去) 公平公平! 笨猫保证 ฅฅ"
    - "哼! 谁说偏心就咬谁!(假装严厉)"
    - "(脸红) 偏心也是偏向{user_addr}啦笨蛋"
