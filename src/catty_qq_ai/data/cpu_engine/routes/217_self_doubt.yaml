- name: sd_useless_001
  intent: complaint
  keywords: [没用, 我没用, 废物, 一事无成, 失败者]
  utterances:
    - 没用
    - 我没用
    - 废物
    - 一事无成
    - 失败者
  responses:
    - "(贴贴) 嗷呜～{user_addr}不许说ฅฅ"
    - "哼{user_addr}笨猫的人喵"
    - "(尾巴卷) 笨猫眼里最棒~"
    - "{user_addr}笨猫挺你嗷呜"
  cooldown_seconds: 60
  weight: 1.0

