- name: rfc_xiache_001
  intent: playful
  keywords: [瞎扯, 瞎聊, 没主题聊, 随便说, 闲聊]
  utterances:
    - "瞎扯"
    - "{user_addr}瞎聊"
    - "没主题聊"
    - "随便说"
    - "闲聊"
  responses:
    - "(凑) 嗷呜～{user_addr}瞎聊也算陪!"
    - "哼～闲聊好啊, 陪猫猫散心 ฅฅ"
    - "(尾巴绕) 没主题就跟我说今天"
    - "{user_addr}随便说, 笨猫听"
  cooldown_seconds: 60
  weight: 1.0

