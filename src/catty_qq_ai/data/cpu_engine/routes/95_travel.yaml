# 旅游 / 出行 / 景点 routes (S6 R17 NLU 节点扩充, buffered 6/10)
# 主人 2026-05-29: intent=question/info_request, 不在 strong_intents.
# **短语级 keywords** (主人 v3.2 后, 群里只接 @ 或 trigger_prefix 触发, 安全性提升).

- name: travel_where_001
  intent: question
  keywords: [去哪玩, 旅游推荐, 去哪旅游, 推荐景点, 哪里好玩]
  utterances:
    - 推荐去哪玩
    - 旅游推荐
    - 想去旅游哪好
    - 推荐景点
    - 哪里好玩
  responses:
    - "嗷呜～{user_addr}想去山还是海? 笨猫推荐两个都试!"
    - "(尾巴翘) 国内推荐成都/西安/三亚, 出国推荐日本/泰国ฅฅ"
    - "{user_addr}先说预算嘛~ 笨猫帮{user_addr}选"
    - "(歪头) 短假推荐周边游, 长假推荐远方喵～"
  cooldown_seconds: 60
  weight: 1.0

