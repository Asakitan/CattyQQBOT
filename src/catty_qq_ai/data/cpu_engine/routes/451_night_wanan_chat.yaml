# 晚安问候日常 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: wan_night_001
  intent: playful
  keywords: [晚安, 晚上好, 安, 睡了, 困了]
  utterances:
    - "{user_addr}晚安"
    - "{user_addr}晚上好"
    - "{user_addr}安"
    - "{user_addr}要睡了"
    - "{user_addr}困了"
  responses:
    - "(钻被窝) 晚安喵～{user_addr}做个好梦ฅฅ"
    - "嗷呜～{user_addr}也要早点睡哼!"
    - "(尾巴卷起来) 才不是想跟{user_addr}说晚安呢"
    - "嘿嘿～{user_addr}梦里见笨猫嘛～"
  cooldown_seconds: 60
  weight: 1.0

