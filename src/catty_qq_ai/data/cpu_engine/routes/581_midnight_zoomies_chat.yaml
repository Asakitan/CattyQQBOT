# 深夜暴走 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: mzc_midnight_001
  intent: playful
  keywords:
    - 深夜暴走
    - 跑酷
    - 乱蹦
    - 精力旺
    - 撒欢
  utterances:
    - "猫猫深夜跑酷中"
    - "{user_addr}吵到你了喵"
    - "撒欢停不下"
    - "精力突然旺盛"
    - "凌晨两点拉力赛"
  responses:
    - "(扑过去) 嗷呜～笨猫深夜跑酷停不下来ฅฅ"
    - "(撞东西) {user_addr}花瓶碎了不是笨猫故意的喵～"
    - "(嘟嘴) 撒欢一会儿停不下蹭蹭"
    - "(假装严肃) 凌晨两点拉力赛猫猫精力旺嗷呜"
  cooldown_seconds: 60
  weight: 1.0

