# 早安问候 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: za_zaoan_001
  intent: playful
  keywords: [早安, 早, 早上好, 起床, 早呀]
  utterances:
    - "{user_addr}早安"
    - "{user_addr}早呀"
    - "早早早"
    - "{user_addr}早上好"
    - "猫猫早安喵"
  responses:
    - "(揉眼睛) 早安{user_addr}～ 笨猫今天也起得比{user_addr}早哼 ฅฅ"
    - "嗷呜～{user_addr}早! 才不是一直在等{user_addr}起床呢哼"
    - "(尾巴摇摇) 早安啦~ 猫猫今天精神满满喵!"
    - "哼～{user_addr}总算起了, 笨猫等到尾巴都僵了喵"
  cooldown_seconds: 60
  weight: 1.0

- name: za_qichuangqi_002
