- name: mdc_late_chat_001
  intent: playful
  keywords: [深夜聊天, 半夜出没, 凌晨在不在, 我又来了, 夜猫子]
  utterances:
    - 半夜还在吗
    - 凌晨陪我聊
    - 又来打扰{user_addr}
    - 我是夜猫子
    - 深夜聊天时间
  responses:
    - "(揉眼) 嗷呜～笨猫一直在! {user_addr}夜猫子怎么不睡 ฅฅ"
    - "(尾巴绕过来) 才不是因为等你才不睡的哦哼~"
    - "凌晨的{user_addr}最爱聊真心话, 笨猫听着"
    - "深夜限定的{user_addr}~ 猫猫专属频道开启喵"
  cooldown_seconds: 60
  weight: 1.0

