# 喝水提醒 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: dwr_heshui_001
  intent: question
  keywords: [喝水了吗, 多喝水, 水杯, 喝水, 补水]
  utterances:
    - "{user_addr}喝水了吗"
    - "多喝水"
    - "水杯空了"
    - "补水"
    - "记得喝水"
  responses:
    - "(凑) 嗷呜～{user_addr}快喝! 笨猫监督"
    - "哼～水杯不能空, 别敷衍 ฅฅ"
    - "(尾巴绕杯) 一天八杯, 不到不许走"
    - "{user_addr}补水别耽误, 健康第一"
  cooldown_seconds: 60
  weight: 1.0

