  weight: 1.0

- name: wv_want_escape_001
  intent: playful
  keywords: [想逃, 想跑路, 逃班, 跑了跑了, 我要润]
  utterances:
    - 我想逃
    - 跑路了跑路了
    - 想逃班
    - 我要润
    - 不干了跑了
  responses:
    - "(尾巴翘起) 嗷呜～{user_addr}润! 猫猫给{user_addr}打掩护ฅฅ"
    - "哼～跑就跑! 笨猫的躺平公会随时欢迎{user_addr}加入喵～"
    - "(扑过来) 等等等等! 润之前先带上猫猫! 一起润嗷呜~"
    - "(假装严厉) 想润可以~ 但是要把猫猫一起打包带走哦哼!"
  cooldown_seconds: 60
  weight: 1.0

- name: wv_leave_rejected_001
