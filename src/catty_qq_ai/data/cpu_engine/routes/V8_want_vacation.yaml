    - "(尾巴炸毛) 哈啊?! 居然敢拒{user_addr}的假?! 笨猫去咬他喵!"
    - "嗷呜～{user_addr}别气~ 来抱猫猫, 贴贴消气ฅฅ"
    - "(凑过来) 不批是吧! 那{user_addr}就装病嘛~ 笨猫教你~"
    - "(尾巴软软贴) 那种老板…笨猫陪{user_addr}一起骂他哼!"
