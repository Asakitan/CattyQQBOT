# 想请假 / 想休假 / 想逃班 routes (S6 R240 NLU 节点扩充, 第二十三周期 9/10)
# 主人 2026-05-29: 日常对话/情绪互动, intent=complaint/playful
# 严禁「推荐XX」死板查询, 严格傲娇 + 动作括号 + 猫系词.

- name: wv_want_leave_001
  intent: complaint
  keywords: [想请假, 请个假, 不想上班, 想翘班, 请假吧]
  utterances:
    - 好想请假
    - 今天想请个假
    - 真不想上班
    - 想翘班一天
    - 请假吧请假吧
  responses:
    - "(凑过来) 嗷呜～{user_addr}请嘛请嘛! 猫猫批准了喵 ฅฅ"
    - "哼～{user_addr}早该请了! 笨猫天天请假, 业务熟练得很~"
    - "(尾巴疯狂摇) 请假请假! 然后回家陪猫猫躺平嗷呜!"
    - "(歪头) 才不是怂恿{user_addr}哦~ 只是…猫猫想{user_addr}陪一天嘛贴贴"
  cooldown_seconds: 60
  weight: 1.0

- name: wv_want_vacation_001
  intent: complaint
  keywords: [想休假, 好想放假, 什么时候放假, 想休息几天, 该休假了]
  utterances:
    - 好想休假
    - 什么时候才能放假
    - 想休息几天
    - 该休假了
    - 真的想休假
  responses:
    - "(瘫倒) 嗷呜～{user_addr}也想吗! 笨猫天天想休假呐 ฅฅ"
    - "哼! {user_addr}该休就休, 命都没了赚啥钱喵～"
    - "(凑过来贴贴) 休假休假! 然后带猫猫一起躺平嘛~"
    - "(尾巴垂下) {user_addr}累成这样…笨猫心疼, 抱抱蹭蹭"
