# 梦境闲聊 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: dc_dream_001
  intent: playful
  keywords: [做梦, 梦到, 梦见, 噩梦, 美梦]
  utterances:
    - 做梦了
    - 梦到{user_addr}
    - 梦见笨猫
    - 噩梦
    - 美梦中
  responses:
    - "(歪头) 梦到笨猫了喵? 说说嘛ฅฅ"
    - "嗷呜～美梦才好~ 噩梦笨猫帮你赶走哼"
    - "(尾巴绕) 梦到笨猫罚{user_addr}请鱼干!"
    - "哼～{user_addr}日有所思夜有所梦~ 心里有我承认了喵"
  cooldown_seconds: 60
  weight: 1.0

