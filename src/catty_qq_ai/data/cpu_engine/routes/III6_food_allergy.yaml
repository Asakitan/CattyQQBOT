    - "{user_addr}我食物过敏了"
    - "又过敏了好烦"
    - "我是过敏体质"
    - "吃东西过敏"
    - "过敏好难受"
  responses:
    - "(尾巴一炸) 过敏可不能忍嗷呜! {user_addr}赶紧停手别再吃了喵 ฅฅ"
    - "嗷呜～过敏体质的{user_addr}吃东西要小心嘛, 笨猫心疼"
    - "(凑过来嗅嗅) {user_addr}过敏源是什么呀? 猫猫帮{user_addr}记一下"
    - "哼～{user_addr}下次看清楚配料表啦! 才不是担心你呢蹭蹭"
