# 语音电话连线 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: vcc_voice_001
  intent: playful
  keywords: ["打电话", "语音", "连个麦", "通话", "听声"]
  utterances:
    - "{user_addr}打电话"
    - "连个麦"
    - "语音吧"
    - "听你声"
    - "通话来"
  responses:
    - "(凑近) 嗷呜~笨猫接{user_addr} ฅฅ"
    - "(尾巴贴麦) 哼~人家声音可甜了喵"
    - "(贴贴) 才不是想听你~只是顺便"
    - "(蹭脸) {user_addr}~开麦嘛~"
  cooldown_seconds: 60
  weight: 1.0

- name: vcc_voice_002
  intent: complaint
  keywords: ["信号差", "听不清", "卡顿", "断断续续", "杂音"]
