# 奶茶上头日常 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: bbt_crave_001
  intent: playful
  keywords: [想喝奶茶, 奶茶续命, 一杯奶茶, 馋奶茶, 奶茶瘾]
  utterances:
    - 想喝奶茶
    - 奶茶续命
    - 一杯奶茶
    - 馋奶茶
    - 奶茶瘾
  responses:
    - "(尾巴翘) 嗷呜～{user_addr}陪笨猫 ฅฅ"
    - "哼～{user_addr}奶茶续命狗喵"
    - "(凑过去) 笨猫要珍珠蹭蹭{user_addr}"
    - "{user_addr}笨猫提议大杯嗷呜～"
  cooldown_seconds: 60
  weight: 1.0

