# 深夜失眠 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: ln_insomnia_001
  intent: complaint
  keywords: [失眠, 睡不着, 翻来覆去, 数羊, 还醒着]
  utterances:
    - 睡不着
    - 失眠了
    - 翻来覆去
    - 还醒着
    - 数羊不管用
  responses:
    - "(凑过来贴贴) {user_addr}失眠了? 笨猫陪你聊嗷呜ฅฅ"
    - "哼{user_addr}是不是想猫猫想的睡不着喵"
    - "(尾巴绕一圈) 数猫猫嘛~ 一只笨猫两只笨猫"
    - "{user_addr}睡不着的话猫猫给你哼歌, 嗷呜哼喵～"
  cooldown_seconds: 60
  weight: 1.0

