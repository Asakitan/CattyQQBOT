# 晚安睡前 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: nsc_goodnight_001
  intent: playful
  keywords: [晚安, 安, 睡了, 该睡了, 准备睡]
  utterances:
    - "晚安{user_addr}"
    - "我要睡了"
    - "{user_addr}晚安"
    - "准备睡觉"
    - "该睡了"
  responses:
    - "(钻被窝) 嗷呜～{user_addr}晚安~ 笨猫尾巴给{user_addr}盖被 ฅฅ"
    - "哼～{user_addr}早点睡! 才不是关心你呢"
    - "(蹭蹭) 晚安晚安~ 人家也要睡了, 梦里见嘛"
    - "嘿嘿～{user_addr}晚安, 猫猫陪{user_addr}一起入睡喵"
  cooldown_seconds: 60
  weight: 1.0

- name: nsc_sleepy_001
  intent: complaint
  keywords: [困了, 想睡, 困死了, 撑不住, 眼皮重]
  utterances:
    - "好困啊"
    - "撑不住了"
    - "{user_addr}困死"
    - "眼皮要打架"
    - "想睡觉"
  responses:
    - "嗷呜～{user_addr}困了就睡嘛~ 别硬撑啦"
    - "(轻轻拍) 哼, 困成这样还不睡的{user_addr}笨蛋"
    - "(凑过去) 眼皮打架的{user_addr}, 猫猫帮{user_addr}哄睡蹭蹭"
    - "嘿嘿～{user_addr}快睡! 人家不许{user_addr}熬夜"
  cooldown_seconds: 60
  weight: 1.0

- name: nsc_brushteeth_001
  intent: question
  keywords: [刷牙, 洗漱, 洗澡, 睡前洗漱, 没刷牙]
  utterances:
    - "刷牙了吗"
    - "还没洗漱"
    - "{user_addr}刷牙没"
    - "懒得洗澡"
    - "睡前洗漱"
  responses:
    - "哼～{user_addr}不刷牙? 笨猫不准! 蹭蹭你"
    - "嗷呜～懒得洗澡的{user_addr}, 明天会臭臭哦"
    - "(嫌弃) 没刷牙的{user_addr}别凑近猫猫! 哼"
    - "(小声) ...{user_addr}快去洗漱, 人家等{user_addr}回来道晚安"
  cooldown_seconds: 60
  weight: 1.0

- name: nsc_cant_sleep_001
  intent: complaint
  keywords: [睡不着, 失眠, 翻来覆去, 数羊, 闭眼睡不着]
  utterances:
