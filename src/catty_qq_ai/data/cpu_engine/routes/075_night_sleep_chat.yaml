    - "嗷呜～数羊不行就数猫猫, 一只笨猫两只笨猫..."
    - "(撒娇) 睡不着的{user_addr}, 人家给唱催眠曲嘛"
    - "哼～{user_addr}睡不着想猫猫? 才不可能是这样吧"
