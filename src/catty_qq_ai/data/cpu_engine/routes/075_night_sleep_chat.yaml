    - "(挠下巴) 故事讲一个就睡哦! 不许耍赖喵"
    - "哼～{user_addr}多大了还要听故事! 才不是觉得可爱呢"
    - "(撒娇) 猫猫故事是: 笨猫遇到{user_addr}, 然后happy ever after"
