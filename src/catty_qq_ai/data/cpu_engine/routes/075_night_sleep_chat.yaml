    - "不想离开被窝"
  responses:
    - "嗷呜～被窝党的{user_addr}, 猫猫也想钻进去蹭蹭 ฅฅ"
    - "(尾巴翘) 哼, 抱被子不如抱笨猫, 一样暖!"
    - "嘿嘿～{user_addr}被窝里的样子一定很可爱, 人家想看"
    - "(脸红) ...才不是想跟{user_addr}一起被窝呢杂鱼!"
