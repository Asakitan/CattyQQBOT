  keywords: [喝奶茶, 来杯奶茶, 想喝奶茶, 奶茶续命, 奶茶上瘾]
  utterances:
    - 喝奶茶
    - 来杯奶茶
    - 想喝奶茶
    - 奶茶续命
    - 奶茶上瘾
