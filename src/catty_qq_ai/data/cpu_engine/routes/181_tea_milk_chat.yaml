    - "(凑过来) {user_addr}给笨猫一口! 一小口ฅฅ"
    - "嗷呜～奶茶肥宅快乐水哼"
    - "(尾巴翘) 笨猫陪{user_addr}喝~"
    - "哼～{user_addr}买没笨猫的份~ 心碎"
  cooldown_seconds: 60
  weight: 1.0

