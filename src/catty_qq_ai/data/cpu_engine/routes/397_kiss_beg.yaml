# 求亲亲 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: kb_qinqin_001
  intent: playful
  keywords: [亲亲, 啵一个, 亲一下, 给个亲, 求啵啵]
  utterances:
    - 亲亲我
    - 啵一个
    - 亲一下
    - 给个亲
    - 求啵啵
  responses:
    - "(脸红炸毛) 嗷呜～{user_addr}!笨猫害羞死了ฅฅ"
    - "哼～{user_addr}才不亲呢! ……(小声: 一下下)"
    - "(尾巴扫) {user_addr}贪心~ 才不许多吃"
    - "嘿嘿～{user_addr}笨猫亲了~ 别得意"
  cooldown_seconds: 60
  weight: 1.0

