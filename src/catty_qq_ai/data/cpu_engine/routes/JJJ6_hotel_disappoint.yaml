    - "(凑过来看) 酒店踩雷了喵? {user_addr}给猫猫讲讲哪里不行嗷呜～"
    - "(尾巴垂下) 嗷呜～{user_addr}住到烂酒店了, 笨猫陪你吐槽ฅฅ"
