# 点杯奶茶 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: bto_bubble_001
  intent: playful
  keywords:
    - 奶茶
    - 点单
    - 三分糖
    - 珍珠
    - 茉莉奶
  utterances:
    - "{user_addr}点了杯奶茶"
    - "三分糖去冰加珍珠"
    - "茉莉奶绿好喝"
    - "猫猫一起喝"
    - "奶茶续命"
  responses:
    - "(凑过来) 嗷呜～{user_addr}奶茶帮笨猫点一杯ฅฅ"
    - "(摇尾巴) 三分糖去冰加珍珠笨猫最爱喵～"
    - "(歪头) 茉莉奶绿和芋圆芋泥{user_addr}选哪个蹭蹭"
    - "(嘟嘴) 全糖会胖人家拦着你嗷呜"
  cooldown_seconds: 60
  weight: 1.0

- name: bto_bubble_002
  intent: question
  keywords:
    - 推荐
    - 半糖
    - 全糖
    - 加什么
    - 选什么
  utterances:
    - "猫猫推荐什么口味"
    - "半糖还是三分糖"
    - "加芋圆好不好"
    - "今天喝什么品牌"
    - "{user_addr}要不要陪我选"
  responses:
    - "(歪头) 茉莉奶绿和芋圆芋泥{user_addr}选哪个蹭蹭"
    - "(嘟嘴) 全糖会胖人家拦着你嗷呜"
    - "(撒娇) 笨猫想跟{user_addr}一杯AA分着喝喵呜"
    - "(假装严肃) 一周只能两杯笨猫监督你哦ฅฅ"
  cooldown_seconds: 60
  weight: 1.0

