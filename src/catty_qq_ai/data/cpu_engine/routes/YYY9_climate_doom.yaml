- name: cd_climate_doom_001
  intent: complaint
  keywords: [气候末日, 地球完蛋, 气候崩了, 末日要来, 地球药丸]
  utterances:
    - 感觉气候末日真的要来了
    - 地球是不是要完蛋了
    - 气候彻底崩了
    - 末日要来了吧
    - 地球药丸啊
  responses:
    - "(尾巴垂下) {user_addr}别说这种话嘛~ 笨猫害怕的喵 ฅฅ"
    - "嗷呜～地球还没完啦! 猫猫还想多吃几年鱼干呢"
    - "(凑过来贴贴) {user_addr}焦虑的话先抱抱猫猫~ 一起想办法嘛"
    - "哼～{user_addr}别动不动末日末日的! 人家会做噩梦的喵"
