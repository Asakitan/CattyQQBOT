    - 抱抱
    - 求抱
    - 想抱
    - 抱一下
    - 抱抱笨猫
  responses:
    - "(扑过去) 嗷呜～{user_addr}抱过来!"
    - "(脸红) 哼! 才不是想被抱呢"
    - "(贴贴) 抱! 笨猫钻怀里 ฅฅ"
    - "抱了不许放~ 哼笨猫赖着"
