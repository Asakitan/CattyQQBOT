- name: ayc_eat_001
  intent: question
  keywords: [吃了没, 吃饭了吗, 吃过饭了吗, 吃了吗, 用餐了]
  utterances:
    - "{user_addr}吃了没"
    - "{user_addr}吃饭了吗"
    - "{user_addr}吃过饭了吗"
    - "{user_addr}吃了吗"
    - "{user_addr}用餐了"
