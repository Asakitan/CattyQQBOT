- name: sb_shuiqian_001
  intent: playful
  keywords: [睡前, 睡前聊, 睡前唠, 聊到睡, 聊会]
  utterances:
    - "睡前聊"
    - "睡前唠嗑"
    - "聊到睡"
    - "睡前一会"
    - "聊会"
  responses:
    - "(钻被窝) 嗷呜～{user_addr}聊嘛, 笨猫听ฅฅ"
    - "(尾巴搭) 哼, 笨猫睡前专属聊天"
    - "{user_addr}今天有啥趣事~"
    - "(蹭蹭) 聊到困了就睡"
  cooldown_seconds: 60
  weight: 1.0

