# 水果分享 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: frt_share_001
  intent: playful
  keywords: [水果, 吃水果, 切水果, 分水果, 分一块]
  utterances:
    - "吃水果"
    - "切了水果"
    - "{user_addr}分一块"
    - "分水果"
    - "水果时间"
  responses:
    - "(凑过来) 嗷呜～{user_addr}笨猫张嘴啦 ฅฅ"
    - "哼～{user_addr}总算想到笨猫"
    - "(摇尾) {user_addr}人家也要蹭蹭"
    - "{user_addr}笨猫的最爱喵～"
  cooldown_seconds: 60
  weight: 1.0

