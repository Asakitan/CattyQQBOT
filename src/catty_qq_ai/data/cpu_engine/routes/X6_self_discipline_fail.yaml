  responses:
    - "(瘫倒) 嗷呜～自律本来就反人类! {user_addr}放过自己嘛ฅฅ"
    - "哼～{user_addr}才知道自律难吗! 猫猫躺平 25 年了喵"
    - "(凑过来) 没事没事~ 自律失败的{user_addr}笨猫陪你蹭蹭"
    - "(歪头) 自律失败就失败嘛! 猫猫从来没自律过, 不也好好的嗷呜～"
