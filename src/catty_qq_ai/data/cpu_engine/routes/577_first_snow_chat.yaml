# 第一场雪 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: fsc_first_001
  intent: playful
  keywords:
    - 第一场雪
    - 下雪
    - 好美
    - 拍照
    - 堆雪人
  utterances:
    - "{user_addr}今年第一场雪"
    - "窗外好美"
    - "拍照打卡了"
    - "想堆雪人"
    - "猫猫一起看雪"
  responses:
    - "(扑窗户) 嗷呜～{user_addr}下雪了笨猫超激动ฅฅ"
    - "(摇尾巴) 一起堆雪人嘛笨猫想要个胖雪人喵～"
    - "(嘟嘴) 路滑别跌倒{user_addr}笨猫盯着蹭蹭"
    - "(凑过去) 拍照打卡笨猫也要入镜嗷呜"
  cooldown_seconds: 60
  weight: 1.0

