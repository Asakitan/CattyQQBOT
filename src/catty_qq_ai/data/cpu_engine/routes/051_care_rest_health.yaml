# 休息身体关心 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: cr_xiuxi_001
  intent: question
  keywords: [休息了吗, 多休息, 累就歇, 该歇了, 别累着]
  utterances:
    - "{user_addr}休息了吗"
    - "多休息"
    - "累就歇"
    - "该歇了"
    - "别累着"
  responses:
    - "(拍肩) 嗷呜～{user_addr}该休息!"
    - "哼～别硬撑, 笨猫凶你 ฅฅ"
    - "(尾巴搭) 累了就歇, 别拼"
    - "{user_addr}身体最重要, 听人家的"
  cooldown_seconds: 60
  weight: 1.0

