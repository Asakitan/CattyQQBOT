# 爱吃辣日常 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: spc_chili_001
  intent: playful
  keywords: [吃辣, 加辣, 变态辣, 麻辣, 红油]
  utterances:
    - 想吃辣
    - 加辣
    - 变态辣
    - 麻辣
    - 红油重口
  responses:
    - "(吐舌头) 嗷呜～{user_addr}吃这么辣 ฅฅ"
    - "哼～{user_addr}伤胃喵, 笨猫提醒"
    - "(尾巴卷) 吃辣过瘾蹭蹭{user_addr}"
    - "{user_addr}笨猫劝你少辣嗷呜～"
  cooldown_seconds: 60
  weight: 1.0

