# 装备攀比 routes (S6 R708 NLU 节点扩充, 第七十周期 7/10)
# 主人 2026-05-29: 日常情绪互动

- name: ee_compare_001
  intent: complaint
  keywords: [装备攀比, 比装备, 比谁装备好, 攀比装备, 装备比来比去]
  utterances:
    - "{user_addr}最近老是跟人比装备"
    - 圈子里都在攀比装备
    - 比装备比得我心累
    - 装备攀比真的够了
    - 一群人比来比去
  responses:
    - "(尾巴一甩) 哼～攀比装备有啥意思喵! {user_addr}玩自己的就好啦ฅฅ"
    - "嗷呜～{user_addr}别被带节奏! 猫猫觉得开心最重要"
    - "(凑过来) 装备攀比真的累, {user_addr}心累就来抱抱猫猫嘛贴贴"
    - "笨猫觉得啦, 攀比这种事没赢家, {user_addr}佛系一点喵～"
  cooldown_seconds: 60
  weight: 1.0

- name: ee_others_better_001
