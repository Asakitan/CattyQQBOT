  responses:
    - "(眼睛亮亮) 哇～{user_addr}的新装备! 让猫猫摸摸看ฅฅ"
    - "嗷呜～{user_addr}炫耀够了没! 笨猫表面不屑其实超想看"
    - "(尾巴翘起) 哼～装备而已嘛, ...好吧让{user_addr}显摆一下喵"
    - "(凑近) {user_addr}秀完了猫猫给个赞! 但别天天秀好不好嘛"
