  utterances:
    - 别人装备都比我好
    - 看到大佬的装备好羡慕
    - "{user_addr}装备不如人"
    - 人家装备好牛
    - 大佬装备亮瞎眼
  responses:
    - "(蹭蹭) {user_addr}别羡慕嘛～猫猫觉得{user_addr}用的就挺好的喵"
    - "嗷呜～大佬是大佬, {user_addr}是{user_addr}! 不用比"
    - "哼～{user_addr}装备不如人, 但人家这只猫比别人家的猫可爱多啦ฅฅ"
    - "(尾巴摇摇) 别人装备好关{user_addr}什么事, 玩得开心就行嘛"
