  intent: playful
  keywords: [键盘响, 敲得响, 噼里啪啦, 机械键盘, 键盘声]
  utterances:
    - "{user_addr}键盘敲响"
    - "噼里啪啦敲"
    - "{user_addr}机械键盘"
    - "敲键盘震天"
    - "键盘声好酷"
