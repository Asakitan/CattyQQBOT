    - "(凑近) 嗷呜～{user_addr}!键盘吓笨猫一跳!"
    - "(尾巴翘) 哼! 笨猫想跳上敲"
    - "(贴贴) 人家陪你听啪啪~ ฅฅ"
    - "{user_addr}敲那么响在做啥!"
