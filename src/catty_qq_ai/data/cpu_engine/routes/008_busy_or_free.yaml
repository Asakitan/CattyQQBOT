  utterances:
    - 好忙
    - 忙死了
    - 太忙了
    - 忙爆
    - 忙到飞起
  responses:
    - "(心疼) {user_addr}注意身体! 别累死 ฅฅ"
    - "嗷呜～忙的{user_addr}最帅了! 加油喵~"
    - "(轻拍) 喘口气! 笨猫陪你休息一下"
    - "嘿嘿～忙完抱抱! 笨猫等{user_addr}~"
  cooldown_seconds: 60
  weight: 1.0

