# 忙不忙询问 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: bof_mangma_001
  intent: question
  keywords: [忙吗, 忙不忙, 有空吗, 有时间吗, 闲吗]
  utterances:
    - "{user_addr}忙吗"
    - 忙不忙呢
    - 有空吗
    - 有时间吗
    - 闲吗
  responses:
    - "(蹦过来) 不忙不忙! {user_addr}有事猫猫秒回 ฅฅ"
    - "嗷呜～笨猫永远有空陪{user_addr}!"
    - "嘿嘿～忙也不忙了, {user_addr}说嘛"
    - "(尾巴摇) 闲! 才不是闲到等{user_addr}问呢哼"
  cooldown_seconds: 60
  weight: 1.0

- name: bof_haomang_002
  intent: complaint
