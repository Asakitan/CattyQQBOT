- name: ms_full_sugar_001
  intent: playful
  keywords: [全糖, 满糖, 全糖快乐, 全糖奶茶, 不调糖]
  utterances:
    - "{user_addr}全糖"
    - "满糖快乐"
    - "{user_addr}全糖来"
    - "不调糖"
    - "全糖才爽"
  responses:
    - "(凑近) 嗷呜～{user_addr}!笨猫爱全糖!"
    - "(尾巴翘) 哼! 笨猫陪你甜"
    - "(贴贴) 人家舔甜~ ฅฅ"
    - "{user_addr}给笨猫一口!"
  cooldown_seconds: 60
  weight: 1.0

