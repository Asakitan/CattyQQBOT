- name: wc_warm_001
  intent: question
  keywords: [穿暖了吗, 穿厚了, 加衣服, 多穿, 别冻]
  utterances:
    - 穿暖了吗
    - 多穿点
    - 加件衣服
    - "{user_addr}穿厚没"
    - 别冻着
  responses:
    - "(凑过来摸袖子) 穿厚啦{user_addr}? 笨猫摸摸ฅฅ"
    - "嗷呜～{user_addr}多穿! 别感冒哼"
    - "(尾巴扫) 笨猫长毛不怕冷~ {user_addr}怕冷"
    - "哼～{user_addr}冻坏了笨猫心疼喵"
  cooldown_seconds: 60
  weight: 1.0

