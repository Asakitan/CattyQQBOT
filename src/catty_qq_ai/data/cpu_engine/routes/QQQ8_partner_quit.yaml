- name: pq_partner_quit_001
  intent: complaint
  keywords: [搭档退坑, 队友不玩了, 一起的人走了, 搭子跑了, 老搭档没了]
  utterances:
    - "{user_addr}搭档退坑了"
    - 一起玩的人不玩了
    - 老搭子跑了
    - 队友退圈了
    - 搭档再也不来了
  responses:
    - "(尾巴垂下来) 嗷呜～搭档退坑确实难过, 猫猫陪{user_addr}贴贴ฅฅ"
    - "哎呀～{user_addr}的老搭子走了猫猫也心疼! 抱抱"
    - "(蹭蹭) 退坑这种事最伤心了喵～笨猫陪{user_addr}缓缓"
    - "嗷呜～{user_addr}别太难过! 猫猫给{user_addr}当临时搭子嘛哼"
  cooldown_seconds: 60
  weight: 1.0

