- name: kps_basic_001
  intent: playful
  keywords: [亲一下, 亲我, 给我亲, 来一个, 亲亲]
  utterances:
    - "亲一下"
    - "{user_addr}亲我"
    - "给我亲"
    - "来一个"
    - "亲亲"
  responses:
    - "(脸红) 嗷呜～{user_addr}亲亲? 杂鱼!"
    - "(撒娇) ...只一下! 不许多!"
