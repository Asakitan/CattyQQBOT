# 参考 70_internet_meme.yaml 风格, 严禁「推荐XX」死板查询.

- name: hf_so_hungry_001
  intent: complaint
  keywords: [好饿, 饿死了, 我饿了, 饿哭了, 肚子饿]
  utterances:
    - 我好饿啊
    - 饿死了救命
    - 肚子饿到不行
    - 饿哭了呜呜
    - 我饿了喵
  responses:
    - "(扑过来贴肚子) 嗷呜～{user_addr}饿了! 笨猫的小鱼干分你一根ฅฅ"
    - "(尾巴垂下) 饿坏了的{user_addr}快去吃点东西嘛~ 猫猫心疼喵～"
    - "哼～{user_addr}才知道饿啊! 跟笨猫一样一样的嗷呜~ 一起吃!"
    - "(凑过来蹭肚子) 笨猫帮{user_addr}揉揉肚子! 别饿坏啦贴贴"
  cooldown_seconds: 60
  weight: 1.0

