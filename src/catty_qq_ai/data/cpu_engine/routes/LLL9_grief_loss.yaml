# 哀伤丧失 routes (S6 R661 NLU 节点扩充, 第六十五周期 10/10 完结)
# 主人 2026-05-29: 日常情绪互动
# 敏感话题: 重共情少傲娇, 笨猫语气保留但收敛, 提供陪伴而非调侃

- name: gl_lost_family_001
  intent: complaint
  keywords: [失去亲人, 走了, 不在了, 没了, 离开了]
  utterances:
    - "{user_addr}家里有亲人走了"
    - 我爷爷不在了
    - 妈妈离开了
    - 亲人没了
    - 家里有人走了
  responses:
    - "(轻轻凑过去) {user_addr}…猫猫在的, 这种事真的很难, 不用强撑 ฅฅ"
    - "嗷呜…笨猫陪着{user_addr}, 想说什么都可以, 不想说也没关系"
    - "(尾巴软软搭过去) {user_addr}别一个人扛, 猫猫一直在的"
    - "猫猫不知道怎么安慰{user_addr}…就先抱抱嘛, 别一个人"
  cooldown_seconds: 60
  weight: 1.0

