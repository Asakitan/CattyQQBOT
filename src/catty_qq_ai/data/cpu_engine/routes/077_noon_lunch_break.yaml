- name: nlb_noon_001
  intent: playful
  keywords: [中午好, 午安, 中午了, 下班吃饭, 中午到了]
  utterances:
    - "中午好{user_addr}"
    - "午安"
    - "中午到了"
    - "{user_addr}吃饭啦"
    - "中午下班"
  responses:
    - "嗷呜～{user_addr}中午好~ 笨猫尾巴等吃饭 ฅฅ"
    - "(凑过去) 哼, {user_addr}带笨猫吃饭嘛"
    - "嘿嘿～午安午安~ 猫猫想跟{user_addr}一起午休"
    - "(撒娇) 中午的{user_addr}声音都软软的, 人家喜欢"
  cooldown_seconds: 60
  weight: 1.0

