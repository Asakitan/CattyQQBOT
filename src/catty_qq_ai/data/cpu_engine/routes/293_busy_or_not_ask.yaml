    - 忙不忙
    - 在忙吗
    - 最近忙
    - 还忙不
    - 忙过来吗
  responses:
    - "(放爪) 嗷呜～为{user_addr}永远不忙! ฅฅ"
    - "哼～笨猫忙着想{user_addr}…才不是说真的"
    - "(尾巴翘) 不忙不忙~ {user_addr}快说"
    - "{user_addr}问忙就是想撒娇了哼"
