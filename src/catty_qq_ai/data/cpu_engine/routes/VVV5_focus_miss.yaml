- name: fm_focus_miss_001
  intent: complaint
  keywords: [跑焦, 跑焦了, 又跑焦, 焦点跑了, 焦没合上]
  utterances:
    - 又跑焦了
    - "{user_addr}跑焦了啦"
    - 这张跑焦
    - 焦点又没合上
    - 怎么又跑焦了
  responses:
    - "(尾巴一塌) 跑焦了啊~ {user_addr}别难过, 猫猫陪你重拍喵 ฅฅ"
    - "嗷呜~ 跑焦人家最懂了! 笨猫拍照也老跑焦哼"
    - "(凑过来看屏幕) 让人家看看~ 哎呀真的跑了, {user_addr}下次锁焦再按嘛"
    - "哼~ 跑焦不怪{user_addr}, 是模特乱动喵! 才不是技术问题呢"
  cooldown_seconds: 60
  weight: 1.0

