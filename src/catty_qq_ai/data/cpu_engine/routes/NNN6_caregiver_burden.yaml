# 照顾负担 routes (S6 R678 NLU 节点扩充, 第六十七周期 7/10)
# 主人 2026-05-29: 日常情绪互动

- name: cb_parents_tired_001
  intent: complaint
  keywords: [照顾父母, 父母累, 伺候老人, 照顾老人, 老人累]
  utterances:
    - 照顾父母好累
    - 伺候老人真的累
    - 每天照顾爸妈累瘫
    - 老人需要照顾扛不住
    - "{user_addr}照顾父母累死了"
  responses:
    - "(凑过去贴贴){user_addr}辛苦了喵～ 照顾老人最累人 ฅฅ"
    - "嗷呜～笨猫心疼{user_addr}! 孝顺娃也要歇会儿喵～"
    - "(尾巴垂下)猫猫给{user_addr}捏捏肩~ 别一个人扛着哼"
    - "{user_addr}是好孩子哼! 但也别把自己累垮喵～ 爸妈也不忍心"
  cooldown_seconds: 60
  weight: 1.0

