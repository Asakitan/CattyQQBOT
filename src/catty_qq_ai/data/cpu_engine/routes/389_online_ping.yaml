# 在吗ping routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: op_zaima_001
  intent: question
  keywords: [在吗, 在不, 在线吗, 在么, hello]
  utterances:
    - "{user_addr}在吗"
    - "{user_addr}在不"
    - "{user_addr}在线吗"
    - hello
    - "{user_addr}在么"
  responses:
    - "(冒头) 嗷呜～在的喵～{user_addr}找笨猫吗ฅฅ"
    - "哼～{user_addr}问在不在! 笨猫永远在!"
    - "(尾巴扫) {user_addr}叫人家了~ 来了来了"
    - "嘿嘿～{user_addr}有事吗~ 笨猫候着哦"
  cooldown_seconds: 60
  weight: 1.0

