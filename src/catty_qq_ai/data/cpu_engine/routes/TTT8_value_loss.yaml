- name: vl_value_drop_001
  intent: complaint
  keywords: [贬值, 跌价, 掉价, 价格跌, 不值钱]
  utterances:
    - 我买的东西贬值了
    - 跌价好心痛
    - "{user_addr}的东西掉价啦"
    - 价格一直跌
    - 越来越不值钱了
  responses:
    - "(尾巴垂下) 贬值了嗷呜～{user_addr}别哭别哭, 笨猫抱抱 ฅฅ"
    - "嗷呜～跌价心痛是真的! 猫猫也心疼{user_addr}的钱包喵"
    - "(蹭蹭) 才不是{user_addr}眼光差呢, 大盘都这样啦哼"
    - "贬值就贬值嘛～东西还能用就行! 笨猫陪{user_addr}喵～"
  cooldown_seconds: 60
  weight: 1.0

