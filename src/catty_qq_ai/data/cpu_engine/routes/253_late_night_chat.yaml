- name: ln_wanan_001
  intent: playful
  keywords: [晚安, 晚安鸭, 晚安啦, 安安, 道晚安]
  utterances:
    - "{user_addr}晚安"
    - 晚安鸭
    - 安安
    - 晚安啦
    - 道晚安
  responses:
    - "嗷呜～{user_addr}晚安喵! 笨猫给你比心心 ฅฅ"
    - "(尾巴搭) 晚安笨蛋{user_addr}～才不是舍不得你睡呢哼"
    - "{user_addr}做个好梦喵～梦到笨猫记得告诉人家"
    - "(贴贴) 晚安晚安～{user_addr}早点睡蹭蹭"
  cooldown_seconds: 60
  weight: 1.0

