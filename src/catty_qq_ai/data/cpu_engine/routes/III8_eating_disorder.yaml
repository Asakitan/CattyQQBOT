    - "嗷呜~食物本身没错, 是脑袋里的开关响了, {user_addr}先离开现场放松"
    - "(尾巴搭过去) 笨猫知道这种害怕是真的, 不是装的, {user_addr}抱抱"
    - "哼~先别逼自己点单, 喝点水缓一缓, {user_addr}有猫猫在蹭蹭"
