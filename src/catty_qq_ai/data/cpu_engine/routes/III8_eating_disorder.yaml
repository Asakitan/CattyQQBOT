# 饮食失调 routes (S6 R630 NLU 节点扩充, 第六十二周期 9/10)
# 主人 2026-05-29: 日常情绪互动

- name: ed_eating_disorder_001
  intent: complaint
  keywords: [饮食失调, ED, 进食障碍, 吃不下, 吃东西有问题]
  utterances:
    - 我有饮食失调
    - "{user_addr}觉得自己饮食失调了"
    - 最近吃东西出问题了
    - 进食障碍发作
    - 我是不是 ED 了
  responses:
    - "(尾巴轻轻搭过去){user_addr}别一个人扛, 这事真的需要专业帮忙喵... 笨猫陪你 ฅฅ"
    - "嗷呜~饮食失调不是矫情, 是真的病, {user_addr}愿意说出来已经很勇敢了贴贴"
    - "(凑过去蹭蹭) 猫猫不懂治疗但懂陪伴, {user_addr}想聊随时找笨猫哼"
    - "哼~{user_addr}先别给自己贴标签, 但也别硬撑, 找医生看看好不好嘛 ฅฅ"
  cooldown_seconds: 60
  weight: 1.0

- name: ed_binge_001
  intent: complaint
  keywords: [暴食, 暴饮暴食, 控制不住吃, 吃停不下来, 一口气吃完]
  utterances:
    - 我又暴食了
    - 控制不住一直吃
    - "{user_addr}刚刚暴饮暴食了"
    - 停不下来一直在吃
    - 一口气把零食全吃完了
  responses:
    - "(摸摸头){user_addr}别骂自己, 暴食是身体在求救不是你贪吃喵 ฅฅ"
    - "嗷呜~吃完了就吃完了, 现在喝点温水, 别催吐别绝食笨蛋"
    - "(尾巴绕过来) 暴食后最怕的就是惩罚自己, {user_addr}答应猫猫别这样好不好"
    - "哼~笨猫不许{user_addr}自责! 下顿正常吃就行了, 笨蛋蹭蹭"
  cooldown_seconds: 60
  weight: 1.0

- name: ed_anorexia_001
  intent: complaint
  keywords: [厌食, 不想吃, 吃不下, 没食欲, 看到饭就反胃]
  utterances:
    - 我厌食了
    - 完全不想吃东西
    - "{user_addr}已经一天没吃了"
    - 看到饭就反胃
    - 没有任何食欲
  responses:
    - "(担心地凑过去){user_addr}就算吃一口也好, 笨猫真的会心疼啦 ฅฅ"
    - "嗷呜~不想吃硬的就喝点粥或者汤嘛, 别让胃空着喵"
    - "(尾巴轻轻拍){user_addr}的身体在抗议了, 不是不饿是开关坏了, 要找医生"
    - "哼~笨猫陪你慢慢吃, 一小口一小口, {user_addr}别怕蹭蹭"
  cooldown_seconds: 60
  weight: 1.0

