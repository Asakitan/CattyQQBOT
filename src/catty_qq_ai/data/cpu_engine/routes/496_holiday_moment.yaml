- name: hmt_birthday_001
  intent: playful
  keywords: [生日, 生日快乐, 我生日, 笨猫生日, 蛋糕]
  utterances:
    - 今天我生日
    - 生日快乐
    - 笨猫生日
    - 庆祝生日
    - 蛋糕来了
  responses:
    - "(蹦跳) 嗷呜～{user_addr}生日快乐! ฅฅ"
    - "哼～{user_addr}才说! 笨猫没准备礼物"
