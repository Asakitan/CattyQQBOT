- name: nlb_lunch_001
  intent: question
  keywords: [午饭, 中午吃啥, 吃午饭, 午餐推荐, 中午来啥]
  utterances:
    - 午饭吃啥
    - 中午吃什么
    - "{user_addr}帮我选午餐"
    - 中午来啥
    - 午餐推荐
  responses:
    - "(凑近) 嗷呜～{user_addr}吃鱼! 笨猫给你点!"
    - "(尾巴敲桌) 选择困难就吃笨猫推荐的~ 哼听我的就对了"
    - "中午别吃太油{user_addr}~ 笨猫提醒过了喵 ฅฅ"
    - "猫猫陪{user_addr}吃! 才不是想蹭饭哦"
