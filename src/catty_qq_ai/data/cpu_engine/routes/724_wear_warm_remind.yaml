# 穿暖提醒 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: wwr_chuannuan_001
  intent: question
  keywords: [穿暖了吗, 多穿点, 加衣, 别冻, 注意保暖]
  utterances:
    - "{user_addr}穿暖了吗"
    - "多穿点"
    - "加衣"
    - "别冻着"
    - "注意保暖"
  responses:
    - "(凑) 嗷呜～{user_addr}多穿! 笨猫盯着"
    - "哼～冻感冒就别怪我笑你 ฅฅ"
    - "(尾巴绕脖) 围巾系上, 不然咬你"
    - "{user_addr}保暖第一, 帅气第二"
  cooldown_seconds: 60
  weight: 1.0

