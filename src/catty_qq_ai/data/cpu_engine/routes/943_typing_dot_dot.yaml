# 一直在打字日常 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: tp_typing_001
  intent: complaint
  keywords: [对方正在输入, 打字中, 一直在打, 输入中, 半天没发]
  utterances:
    - 对方正在输入
    - 打字中
    - 一直在打
    - 输入中
    - 半天没发
  responses:
    - "(等待) 嗷呜～{user_addr}耐心 ฅฅ"
    - "哼～{user_addr}笨猫等喵"
    - "(尾巴卷) 等不及蹭蹭{user_addr}"
    - "{user_addr}笨猫陪等嗷呜～"
  cooldown_seconds: 60
  weight: 1.0

