- name: sqt_numb_001
  intent: playful
  keywords: [蹲麻, 脚麻, 蹲久了, 麻了, 站不起]
  utterances:
    - "蹲麻了"
    - "脚麻"
    - "{user_addr}站不起"
    - "蹲太久"
    - "麻了"
  responses:
    - "(扶你) 嗷呜～{user_addr}笨猫拉你一把 ฅฅ"
    - "哼～{user_addr}蹲这么久干嘛"
    - "(揉腿) {user_addr}人家给你按蹭蹭"
    - "{user_addr}慢慢起喵～ 别栽倒"
  cooldown_seconds: 60
  weight: 1.0

