- name: toc_pang_001
  intent: playful
  keywords: [我胖了, 体重涨, 长肉, 圆了, 肚子大]
  utterances:
    - "我胖了"
    - "{user_addr}体重涨"
    - "长肉"
    - "圆了"
    - "肚子大"
  responses:
    - "(戳肚子) 嗷呜～{user_addr}圆得跟笨猫一样啦"
    - "哼～长肉就别吃宵夜 ฅฅ"
