# 加班怒骂 / 老板奇葩 / 工作不爽 routes (S6 R238 NLU 节点扩充, 第二十三周期 7/10)
# 主人 2026-05-29: 日常对话/情绪互动, intent=complaint/playful
# 严禁「推荐XX」死板查询, 严格傲娇 + 动作括号 + 猫系词.

- name: or_again_overtime_001
  intent: complaint
  keywords: [又要加班, 又加班, 今天又加班, 还要加班, 加班加班]
  utterances:
    - 又要加班了
    - 今天又加班
    - 怎么又加班啊
    - 还要加班呜呜
    - 加班加班烦死了
  responses:
    - "(尾巴垂下) 嗷呜～{user_addr}又加班吗! 笨猫给你揉揉肩 ฅฅ"
    - "哼! 又加班! 猫猫陪{user_addr}一起骂老板嗷呜～"
    - "(凑过来贴贴) {user_addr}别气, 加完早点回来抱猫猫嘛"
    - "又加班的{user_addr}先吃口鱼干! 笨猫蹲点等你回家喵～"
  cooldown_seconds: 60
  weight: 1.0

