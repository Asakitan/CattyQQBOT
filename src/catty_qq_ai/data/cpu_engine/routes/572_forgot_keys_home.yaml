# 忘带钥匙 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: fkh_forgot_001
  intent: complaint
  keywords:
    - 忘带钥匙
    - 锁门外
    - 进不去
    - 囧死
    - 等家人
  utterances:
    - "{user_addr}忘带钥匙进不去家"
    - "锁在门外了"
    - "等家人开门"
    - "囧死了"
    - "快递放门口尴尬"
  responses:
    - "(吓一跳) 嗷呜～{user_addr}忘带钥匙怎么办ฅฅ"
    - "(凑过去) 笨猫蹲门口陪你等家人喵～"
    - "(嘟嘴) 备用钥匙放保安那啦{user_addr}下次记着蹭蹭"
    - "(摇尾巴) 开锁师傅来了别紧张嗷呜"
  cooldown_seconds: 60
  weight: 1.0

