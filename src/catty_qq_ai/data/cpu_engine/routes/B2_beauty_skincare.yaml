  keywords: [推荐抗衰, 抗皱推荐, 推荐抗老, 推荐紧致, 笨猫抗老, 视黄醇, 玻色因, 胜肽, 抗老精华, 抗老年龄]
  utterances:
    - 推荐抗衰
    - 抗皱推荐
    - 推荐抗老
    - 推荐紧致
    - 笨猫抗老
    - "{user_addr}视黄醇怎么用"
    - 玻色因有用吗
    - 胜肽推荐
    - 抗老精华怎么选
    - 几岁开始抗老
    - "{user_addr}A 醇翻车了"
    - 抗老平价路线
  responses:
    - "嗷呜～{user_addr}成分: 维 A 醇 / 视黄醇 / 玻色因 / 胜肽ฅฅ"
    - "(尾巴翘) 大牌: 修丽可 CE 精华 / 海蓝之谜 / 莱珀妮"
    - "{user_addr}30+ 开始抗老! 早晚比晚更好"
    - "(挺胸) 笨猫的提醒: 抗老 = 防晒 + 睡好 + 补水 - 基础到位再加产品"
    - "(凑过来) 视黄醇晚上用 / 从低浓度起 / 0.05% → 0.1% 慢慢上喵"
    - "(尾巴轻摇) 嗷呜～玻色因抗皱真材实料 / 但要持续 3 个月以上才见效贴贴"
    - "(歪头) 抗老平价路线: 烟酰胺 + 玻尿酸 + 胜肽 / 国货新品牌不少ฅฅ"
    - "(凑头) 哼, 笨猫的提醒: A 醇翻车了停用 + 修复屏障 / 别硬刷"
  cooldown_seconds: 60
  weight: 1.0

- name: beauty_closed_comedone_001
  intent: complaint
  keywords: [闭口, 长闭口了, 额头小颗粒, 下巴闭口, 闭口怎么处理, 闭口针清, 闭口刷酸, 闭口饮食, 闭口起因, 闭口反复]
  utterances:
    - 我长闭口了
    - 额头全是小颗粒
    - 下巴闭口好多
    - 闭口怎么处理
    - "{user_addr}闭口能挤吗"
    - 闭口刷酸有用吗
    - 闭口针清靠谱吗
    - 为啥老长闭口
    - 闭口怎么饮食
    - "{user_addr}闭口反复"
    - 闭口跟痘的区别
    - 闭口护肤要避雷啥
  responses:
    - "(尾巴垂下) 嗷呜～闭口别乱抠喵, 越抠越容易变成红肿痘印ฅฅ"
    - "(歪头) {user_addr}可以先从温和刷酸 / 规律清洁下手, 但别一口气猛上太多活性哼～"
    - "{user_addr}如果一阵子都没缓解, 就去皮肤科看看喵, 有时候专业处理比自己乱试稳多了"
    - "(凑过来) 闭口刷酸首选水杨酸 / 2% 浓度 / 一周 2-3 次喵"
    - "(尾巴轻摇) 嗷呜～闭口饮食别奶 + 不熬夜 / 已经见效一半贴贴"
    - "(歪头) 闭口反复多半护肤品太厚 / 换轻盈质地试试ฅฅ"
    - "(挺胸) 哼, 笨猫的提醒: 针清要专业的人做 / 自己挤容易感染留印"
    - "(凑头) {user_addr}避雷酒精 + 厚重面霜 + 高油卸妆 / 容易反复嗷呜～"
  cooldown_seconds: 60
  weight: 0.9

- name: beauty_cakey_makeup_001
  intent: complaint
  keywords: [卡粉, 底妆卡粉, 上妆不服帖, 浮粉, 卡粉急救, 起皮卡粉, 干皮卡粉, 油皮卡粉, 卡粉前打底, 卡粉后补救]
  utterances:
    - 底妆总是卡粉
    - 上妆不服帖怎么办
    - 我老是浮粉
    - 卡粉好严重
    - "{user_addr}干皮卡粉怎么办"
    - 油皮浮粉是怎么回事
    - 卡粉前怎么打底
    - 卡粉后补救方法
    - 鼻翼总是卡粉
    - "{user_addr}下午就浮粉"
    - 起皮卡粉先去角质吗
    - 化妆怎么不卡
  responses:
    - "嗷呜～卡粉多半是前面保湿没跟上喵, 先把皮肤喝饱水再上底妆ฅฅ"
    - "(尾巴翘) {user_addr}底妆别一次糊太厚哼～少量多次拍开, 比厚盖一层自然得多"
    - "如果鼻翼 / 嘴角老卡粉, {user_addr}记得先把起皮处理掉喵, 不然粉只会越堆越明显贴贴"
    - "(凑过来) 干皮卡粉建议用妆前乳保湿打底 / 后涂啫喱型底妆喵"
    - "(尾巴轻摇) 嗷呜～油皮浮粉先控油打底 + 散粉定妆 / 中午吸油纸补救贴贴"
    - "(歪头) 起皮先用厚乳焖一夜 / 第二天再去角质 / 别硬磨ฅฅ"
    - "(挺胸) 哼, 笨猫的提醒: 妆前 5 分钟拍干水乳 / 等吸收再上底妆"
    - "(凑头) {user_addr}下午浮粉可补气垫 / 但先吸油 / 别直接拍嗷呜～"
  cooldown_seconds: 60
  weight: 0.9
