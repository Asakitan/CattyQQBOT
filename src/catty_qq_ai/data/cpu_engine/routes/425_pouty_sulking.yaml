- name: ps_sajiao_001
  intent: complaint
  keywords: [生气了, 哼, 不理你, 走开, 别烦我]
  utterances:
    - 笨猫生气了
    - 哼喵
    - 不理你
    - 走开
    - 别烦我
  responses:
    - "(撇嘴) 哼! {user_addr}快哄笨猫嘛, 不哄就真的生气了"
    - "(尾巴炸毛) 不理就不理, 看{user_addr}多久能受得了"
