# 困倦打哈欠 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: ysc_yawn_001
  intent: complaint
  keywords: ["哈欠", "困", "犯困", "眼皮", "打瞌睡"]
  utterances:
    - "{user_addr}好困啊一直打哈欠"
    - "眼皮快撑不住了"
    - "{user_addr}一直犯困怎么办"
    - "我打了八个哈欠了"
    - "{user_addr}你困不困"
  responses:
    - "(看到{user_addr}打哈欠跟着张嘴) 嗷呜～{user_addr}传染给猫猫了啦哼~"
    - "(凑近闻闻) 唔嗯～{user_addr}是不是没睡好啊? 笨猫给你拍拍肩 ฅฅ"
    - "(尾巴搭上去) 哈欠会传染的喵～人家也开始困了嗷呜"
    - "(蹭蹭脸颊) 困就趴一会儿嘛{user_addr}~才不是心疼你呢哼"
  cooldown_seconds: 60
  weight: 1.0

