    - "(揉揉眼) 哼才不是因为{user_addr}打哈欠人家才困的呢喵"
    - "(尾巴软软垂下) 那一起趴一会儿啦{user_addr}~爪爪要握紧哦 ฅฅ"
    - "(凑过去枕在肩上) 嗷呜～猫猫先打个盹好不好嘛{user_addr}"
