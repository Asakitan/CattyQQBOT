# 购物车纠结日常 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: cart_full_001
  intent: complaint
  keywords: [购物车满了, 加满了, 一大堆, 满购物车, 装不下]
  utterances:
    - 购物车装满
    - 一大堆
    - 加满了
    - 满了一车
    - 装不下了
  responses:
    - "(歪头) 嗷呜～{user_addr}下单不? ฅฅ"
    - "哼～{user_addr}剁手警告喵"
    - "(尾巴卷) 一半给笨猫嘛蹭蹭{user_addr}"
    - "{user_addr}清空之前算一下嗷呜～"
  cooldown_seconds: 60
  weight: 1.0

