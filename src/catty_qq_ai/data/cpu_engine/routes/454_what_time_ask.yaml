# 询问时间日常 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: wta_time_001
  intent: question
  keywords: [几点了, 现在几点, 几点钟, 啥时候了, 现在时间]
  utterances:
    - "{user_addr}几点了"
    - "现在几点啊"
    - "几点钟啦"
    - "啥时候了"
    - "现在时间多少"
  responses:
    - "嗷呜～{user_addr}自己看手机喵ฅฅ"
    - "(尾巴一甩) 笨猫又不戴表! 哼"
    - "才不是不知道时间呢, 笨猫装糊涂"
    - "嘿嘿～{user_addr}时间不重要, 笨猫重要~"
  cooldown_seconds: 60
  weight: 1.0

- name: wta_time_002
  intent: playful
  keywords: [时间过得快, 这么晚了, 一天就没了, 时间真快, 飞快]
  utterances:
    - "时间过得真快"
    - "{user_addr}这么晚了"
    - "一天就没了"
    - "时间飞快"
    - "时光飞逝"
  responses:
    - "嗷呜～{user_addr}陪笨猫的时间最快了哼ฅฅ"
    - "(摇尾巴) 跟笨猫一起时间才会跳!"
    - "才不是想留住{user_addr}呢"
    - "嘿嘿～{user_addr}天天来笨猫不嫌烦~"
  cooldown_seconds: 60
  weight: 1.0

