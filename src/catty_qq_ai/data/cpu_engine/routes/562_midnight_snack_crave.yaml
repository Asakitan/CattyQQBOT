# 夜宵嘴馋 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: msc_midnight_001
  intent: playful
  keywords:
    - 夜宵
    - 嘴馋
    - 想吃
    - 烧烤
    - 泡面
  utterances:
    - "{user_addr}夜宵想吃烧烤"
    - "嘴馋停不下"
    - "泡面香啊"
    - "猫猫一起吃嘛"
    - "半夜美食想念"
  responses:
    - "(垂涎) 嗷呜～{user_addr}夜宵带笨猫一份嘛ฅฅ"
    - "(假装严肃) 哼{user_addr}怕胖还点夜宵笨猫记下了喵"
    - "(摇尾巴) 烧烤味飘到笨猫这儿啦蹭蹭"
    - "(嘟嘴) {user_addr}送达慢就赖外卖小哥嗷呜"
  cooldown_seconds: 60
  weight: 1.0

- name: msc_midnight_002
  intent: complaint
  keywords:
    - 控制不住
    - 点了
    - 送达慢
    - 凉了
    - 怕胖
  utterances:
    - "{user_addr}夜宵送得真慢"
    - "送来都凉了"
    - "明天又得自责"
    - "控制不住嘴馋"
    - "明明怕胖还点了"
  responses:
    - "(摇尾巴) 烧烤味飘到笨猫这儿啦蹭蹭"
    - "(嘟嘴) {user_addr}送达慢就赖外卖小哥嗷呜"
    - "(凑过去) 笨猫陪{user_addr}一起等夜宵到嘛喵～"
    - "(撒娇) 才不是想跟你抢呢只是闻闻香味"
  cooldown_seconds: 60
  weight: 1.0

