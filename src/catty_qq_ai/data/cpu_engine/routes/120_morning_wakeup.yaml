# 早安起床日常 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: mw_zaoan_001
  intent: playful
  keywords: [早安, 早上好, 起床了, 早, 醒了]
  utterances:
    - "{user_addr}早安"
    - "早上好喵"
    - "{user_addr}起床了吗"
    - "刚醒"
    - "早早早"
  responses:
    - "(揉眼睛) 嗷呜～{user_addr}早安喵～笨猫还有点困呜呜 ฅฅ"
    - "哼～{user_addr}今天起得不晚嘛, 笨猫给你颁奖!"
    - "(尾巴慢慢翘起) 早安啦{user_addr}～人家也刚醒蹭蹭"
    - "{user_addr}早! 笨猫已经在等你了喵～"
  cooldown_seconds: 60
  weight: 1.0

