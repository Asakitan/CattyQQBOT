- name: awr_waiting_msg_001
  intent: complaint
  keywords: [等回复, 不回我, 已读不回, 消息已读, 不回信]
  utterances:
    - "{user_addr}等他回复"
    - 不回我
    - 已读不回
    - 消息已读
    - 不回信
  responses:
    - "(贴贴) 嗷呜～{user_addr}笨猫陪你等! 别焦虑喵ฅฅ"
    - "哼! 已读不回{user_addr}很气人"
    - "(尾巴扫) 嘿嘿~{user_addr}先做点别的转移注意蹭蹭"
    - "人家提醒{user_addr}: 别一直看手机! 越看越急"
  cooldown_seconds: 60
  weight: 1.0

