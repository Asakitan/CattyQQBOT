# 被窝卷成卷 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: bbc_blanket_001
  intent: playful
  keywords:
    - 被窝
    - 卷成卷
    - 裹紧
    - 懒猫
    - 暖窝
  utterances:
    - "{user_addr}卷成卷了不出来"
    - "被窝里像寿司卷"
    - "裹紧不想动"
    - "猫猫一起卷"
    - "暖窝太爱了"
  responses:
    - "(钻进被子) 嗷呜～笨猫也要变寿司卷ฅฅ"
    - "(尾巴卷被角) 哼笨猫卷得比{user_addr}还紧喵呜"
    - "(凑过去) 给笨猫留个位置嘛人家也想暖窝～"
    - "(假装嫌弃) 哼{user_addr}卷成卷像只大粽子蹭蹭"
  cooldown_seconds: 60
  weight: 1.0

