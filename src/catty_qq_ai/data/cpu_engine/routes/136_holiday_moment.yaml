- name: hm_birthday_001
  intent: playful
  keywords: [生日, 我生日, 笨猫生日, 过生日, 祝生日]
  utterances:
    - "{user_addr}生日"
    - 笨猫生日
    - 我过生日
    - 祝生日
    - 蛋糕呢
  responses:
    - "(撒花) 嗷呜～{user_addr}生日快乐 ฅฅ"
    - "哼～{user_addr}笨猫准备好了"
    - "(尾巴翘) {user_addr}许愿喵"
    - "{user_addr}吹蜡烛蹭蹭"
  cooldown_seconds: 60
  weight: 1.0

