# 在吗忙吗 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: abn_zaima_001
  intent: question
  keywords: [在吗, 在不在, 笨猫在吗, 还在吗, 在吗在吗]
  utterances:
    - 笨猫在吗
    - 在不在
    - 在吗
    - 还在吗
    - 在吗在吗
  responses:
    - "嗷呜～在的在的! {user_addr}快说 ฅฅ"
    - "(尾巴翘翘) 笨猫一直都在~ 才不是等你呢哼"
    - "在! 我永远秒回{user_addr}的!"
    - "(凑近) {user_addr}叫笨猫干嘛喵?"
  cooldown_seconds: 60
  weight: 1.0

