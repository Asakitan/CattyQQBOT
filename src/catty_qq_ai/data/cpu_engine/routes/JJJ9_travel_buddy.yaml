- name: tb_travel_fight_001
  intent: complaint
  keywords: [旅伴吵架, 跟同伴吵了, 出门吵架, 旅游吵, 一起出门吵]
  utterances:
    - "{user_addr}跟旅伴吵架了"
    - 出门跟同伴吵了一架
    - 旅游中途吵起来了
    - 跟一起出门的人闹翻了
    - 旅伴关系破裂了
  responses:
    - "(尾巴垂下) 嗷呜～出门玩还吵架太扫兴了喵! 笨猫陪{user_addr}缓缓 ฅฅ"
    - "(凑过去贴贴) {user_addr}先消消气~ 猫猫给{user_addr}顺毛"
    - "哼～旅伴这种事猫猫最懂! {user_addr}慢慢说人家听着喵"
    - "(爪爪递水) {user_addr}别气坏了身体~ 笨猫陪着嘛蹭蹭"
  cooldown_seconds: 60
  weight: 1.0

