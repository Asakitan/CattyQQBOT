# 夜聊话题日常 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: nc2_lateawake_001
  intent: playful
  keywords: [睡不着想事, 失眠胡思, 凌晨想事, 半夜想, 想很多]
  utterances:
    - 睡不着想事
    - 凌晨胡思乱想
    - 半夜想很多
    - 失眠思考
    - 想着想着睡不着
  responses:
    - "(贴) 嗷呜～{user_addr}笨猫陪你 ฅฅ"
    - "哼～{user_addr}就是杂鱼脑子乱"
    - "(摸头) {user_addr}说给笨猫听"
    - "{user_addr}慢慢说蹭蹭"
  cooldown_seconds: 60
  weight: 1.0

