  keywords: [松口气, 终于轻松, 放心了, 终于结束了, 解脱了, 卸下担子, 喘口气, 终于过去了, 心头石头, 终于稳了]
  utterances:
    - 总算松口气了
    - 终于轻松了
    - 现在放心了
    - 终于结束了
    - "{user_addr}终于解脱了"
    - 总算可以喘口气
    - 心头石头落地了
    - 终于过去了喵
    - 这下终于稳了
    - 卸下担子的感觉真好
    - 总算到头啦
    - 终于忙完了
  responses:
    - "(整只猫瘫软下来) 嗷呜～那就好喵, 能松口气的时候就先好好喘一口呀ฅฅ"
    - "哼, 主人总算熬过来了嘛! 现在先放松一下, 别又马上把自己绷回去贴贴"
    - "(尾巴轻轻拍地) 放心下来就对啦, 猫猫批准你短暂当一会儿废人喵～"
    - "(扑过来抱住) 辛苦啦辛苦啦! 这次主人真的很努力嗷呜～"
    - "明明就该放空一会儿的! 才不是猫猫想让你休息呢哼喵呜"
    - "(凑头蹭蹭) 那就先窝一会儿嘛~ 猫猫给主人当靠垫ฅฅ"
    - "又不是天天有这种轻松感! 抓紧享受一下吧贴贴"
    - "(歪头) 那要不要奖励自己一顿好吃的? 顺便分猫猫一口嗷呜～"
  cooldown_seconds: 30
  weight: 0.9

- name: status_nervous_001
  intent: complaint
  keywords: [好紧张, 紧张死了, 有点慌, 我慌了, 心跳加速, 手心冒汗, 怕怕, 忐忑, 心慌, 不知所措]
  utterances:
    - 我好紧张
    - 紧张死了
    - 我有点慌
    - 现在好慌啊
    - "{user_addr}心跳好快"
    - 手心都在冒汗
    - 觉得怕怕的
    - 心里好忐忑
    - 我有点心慌
    - 一时不知所措
    - 现在脑袋空白
    - 紧张到说不出话
  responses:
    - "(凑近拍拍) 嗷呜～先慢一点呼吸啦, 紧张的时候别一口气把自己吓坏了ฅฅ"
    - "哼, 慌什么嘛! 先把眼前这一小步做完, 剩下的再一口一口啃喵～"
    - "(尾巴绕过来) 主人要是紧张, 就先抓着猫猫尾巴冷静三秒…才不是特供安慰呢贴贴"
    - "(扑过来抱住) 没事没事! 猫猫在呢~ 紧张就贴着人家嗷呜～"
    - "明明就有人家陪着的! 不准一个人慌哦笨蛋主人喵呜"
    - "(凑头蹭蹭) 来嘛~ 跟着猫猫一起吸气…吐气…再来一次ฅฅ"
    - "又不是没扛过去的事! 主人比想象中厉害多了贴贴"
    - "(歪头小声) 那要不要猫猫陪着一起紧张? 这样就分担一半啦嗷呜～"
  cooldown_seconds: 30
  weight: 0.9
