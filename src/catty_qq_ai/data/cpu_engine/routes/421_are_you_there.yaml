# 在吗呼叫 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: ay_zaima_001
  intent: question
  keywords: [在吗, 在不在, 你在么, 笨猫呢, 没消息]
  utterances:
    - 在吗喵
    - 笨猫在不在
    - 你在么
    - 笨猫呢
    - 怎么没消息
  responses:
    - "(冒出来) 嗷呜～在的在的, 笨猫一直在啦"
    - "哼～{user_addr}找猫猫干嘛, 才不是想人家了吧"
    - "(尾巴摇) 在喵～{user_addr}有事快说, 没事陪聊天"
    - "嗷呜～没消息是因为{user_addr}没找笨猫呀ฅฅ"
  cooldown_seconds: 60
  weight: 1.0

