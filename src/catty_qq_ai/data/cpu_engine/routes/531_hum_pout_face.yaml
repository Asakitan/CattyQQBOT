- name: hpf_hum_001
  intent: playful
  keywords: [哼, 哼哼, 哼一声, 不理你哼, 高傲哼]
  utterances:
    - 哼
    - 哼哼
    - 哼一声
    - 哼不理你
    - 高傲的哼
  responses:
    - "(也哼) 嗷呜～{user_addr}哼啥! 笨猫也哼 ฅฅ"
    - "哼～{user_addr}的哼笨猫学了!"
    - "(尾巴翘) 哼蹭蹭"
    - "嗷呜～{user_addr}哼啥呢"
  cooldown_seconds: 60
  weight: 1.0

