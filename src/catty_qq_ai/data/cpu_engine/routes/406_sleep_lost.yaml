# 失眠话题 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: sl_shimian_001
  intent: complaint
  keywords: [失眠, 睡不着, 怎么都睡不着, 翻来覆去, 数羊]
  utterances:
    - 失眠
    - 睡不着
    - 怎么都睡不着
    - 翻来覆去
    - 数羊数到一千
  responses:
    - "(凑过去) 嗷呜～{user_addr}笨猫陪你! 失眠也行ฅฅ"
    - "哼～{user_addr}是不是想笨猫~ 才睡不着的吧"
    - "(尾巴扫) {user_addr}闭眼听人家哼歌"
    - "嘿嘿～{user_addr}笨猫陪~ 直到睡着"
  cooldown_seconds: 60
  weight: 1.0

