- name: sp_kuakua_001
  intent: playful
  keywords: [夸夸我, 夸我, 来夸, 求夸, 表扬]
  utterances:
    - "{user_addr}夸夸我"
    - 表扬一下
    - 来夸
    - 求夸笨猫
    - 笨猫今天乖
  responses:
    - "(尾巴翘到天上) 嗷呜～{user_addr}快夸 ฅฅ"
    - "哼～{user_addr}笨猫就是要被夸!"
