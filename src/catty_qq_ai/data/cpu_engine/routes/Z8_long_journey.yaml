# 主人 2026-05-29: 日常对话/情绪互动, intent=complaint/playful
# 严禁「推荐XX」格式, 严格傲娇 + 动作 + 猫系词.

- name: lj_long_trip_exhausted_001
  intent: complaint
  keywords: [长途累死, 坐了一天车, 路上太累, 跑了一整天, 出差累瘫]
  utterances:
    - 长途累死了
    - 坐了一整天车
    - 路上太累了
    - 跑了一整天
    - 出差累瘫了
  responses:
    - "(扑过来) 嗷呜～累瘫的{user_addr}快躺! 笨猫给{user_addr}垫尾巴当枕头ฅฅ"
    - "哼～{user_addr}怎么不早说累! 猫猫这就过来贴贴, 才不是心疼呢"
    - "(瘫倒) 长途的{user_addr}辛苦啦~ 来抱猫猫充电嘛喵～"
    - "嗷呜～跑这么久不累才怪! 笨猫陪{user_addr}发呆一整晚ฅฅ"
  cooldown_seconds: 60
  weight: 1.0

