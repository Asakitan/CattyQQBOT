# 随便找话题 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: rcs_random_topic_001
  intent: question
  keywords: [聊点啥, 找话题, 没话说, 聊天卡壳, 沉默尴尬]
  utterances:
    - "{user_addr}聊点啥"
    - 找个话题
    - 没话说
    - 卡壳了
    - 沉默尴尬
  responses:
    - "(歪头) 嗷呜～{user_addr}笨猫开话头! 喵ฅฅ"
    - "哼! 不说话也没关系{user_addr}"
    - "(尾巴翘) 嘿嘿~{user_addr}陪笨猫一起就好蹭蹭"
    - "人家说{user_addr}: 今天吃了啥? 万能话题"
  cooldown_seconds: 60
  weight: 1.0

