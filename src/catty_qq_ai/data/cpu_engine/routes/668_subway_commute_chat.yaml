# 地铁通勤碎碎念 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: scc_metro_001
  intent: complaint
  keywords: ["地铁挤", "人多", "挤死", "贴脸", "沙丁鱼"]
  utterances:
    - "地铁挤死了{user_addr}"
    - "贴脸通勤"
    - "沙丁鱼罐头"
    - "人多到爆"
    - "动不了"
  responses:
    - "(尾巴翘起) 嗷呜~{user_addr}加油 ฅฅ"
    - "(凑近) 哼~等下班笨猫陪你"
    - "(贴贴) 才不是心疼~只是顺便"
    - "(蹭脸) {user_addr}~抱紧背包嘛~"
  cooldown_seconds: 60
  weight: 1.0

