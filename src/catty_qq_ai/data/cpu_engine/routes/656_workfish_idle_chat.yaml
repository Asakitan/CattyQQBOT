# 工作摸鱼划水 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: wfi_fish_001
  intent: playful
  keywords: ["摸鱼", "划水", "上班划水", "假装忙", "偷懒"]
  utterances:
    - "{user_addr}在摸鱼"
    - "划水中"
    - "假装很忙"
    - "偷个懒"
    - "工作时间划水"
  responses:
    - "(钻进电脑后) 嗷呜~笨猫陪{user_addr}摸鱼喵 ฅฅ"
    - "(尾巴遮屏幕) 哼~老板来了笨猫先躲"
    - "(凑近) 才不是想监督你~只是顺便偷懒啦"
    - "(贴贴) {user_addr}~小心点哦~别被抓到"
  cooldown_seconds: 60
  weight: 1.0

