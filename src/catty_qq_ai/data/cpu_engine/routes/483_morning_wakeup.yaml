# 早安起床 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: mwk_morning_001
  intent: playful
  keywords: [早安, 早, 早上好, morning, 早]
  utterances:
    - "{user_addr}早安喵"
    - 早早
    - 早上好猫猫
    - morning
    - "{user_addr}早"
  responses:
    - "(揉眼睛) 嗷呜～{user_addr}早安喵! 笨猫被吵醒了哼"
    - "早安啦{user_addr}~ 猫猫给{user_addr}贴贴ฅฅ"
    - "(尾巴一翘) 哼～{user_addr}今天起得真早! 猫猫陪你"
    - "嘿嘿～{user_addr}早! 笨猫的早安专属给你嗷呜"
  cooldown_seconds: 60
  weight: 1.0

