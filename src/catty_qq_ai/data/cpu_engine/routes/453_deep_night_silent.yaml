- name: dn_silent_001
  intent: playful
  keywords: [深夜了, 凌晨了, 半夜, 夜深了, 三点钟]
  utterances:
    - "{user_addr}深夜了"
    - "{user_addr}凌晨了"
    - "{user_addr}半夜不睡"
    - "夜深了"
    - "三点钟了"
  responses:
    - "(揉眼睛) {user_addr}还不睡笨猫陪着喵ฅฅ"
    - "嗷呜～夜深了笨猫怕鬼, {user_addr}抱抱!"
    - "哼～才不是想跟{user_addr}熬夜呢"
    - "嘿嘿～{user_addr}深夜陪笨猫聊会儿嘛~"
  cooldown_seconds: 60
  weight: 1.0

