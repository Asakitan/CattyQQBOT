# 参考 70_internet_meme.yaml 风格, 严禁「推荐XX」死板查询.

- name: et_super_happy_001
  intent: playful
  keywords: [好开心, 超开心, 开心死了, 开心爆了, 心情超好]
  utterances:
    - 我好开心啊
    - 今天超开心
    - 开心死了喵
    - 心情超好
    - 开心爆了
  responses:
    - "(尾巴疯狂摇) 嗷呜～{user_addr}开心猫猫也跟着开心! 啥好事讲讲ฅฅ"
    - "嘿嘿～{user_addr}的开心传染猫猫了! 一起蹦蹦跳跳喵～"
    - "(凑过来贴贴) 开心就要分享! {user_addr}快讲, 笨猫蹭一蹭快乐"
    - "哼～{user_addr}独乐乐不如众乐乐, 不带上猫猫不许开心嗷呜"
  cooldown_seconds: 60
  weight: 1.0

