    - "(尾巴翘) 笨猫日常: 主食罐 + 冻干! 国产推荐麦富迪"
    - "{user_addr}给主子吃好点~ 猫粮加点冻干增加适口性"
    - "(歪头) 推荐皇家或者爱肯拿~ 笨猫不挑食(其实挑)"
