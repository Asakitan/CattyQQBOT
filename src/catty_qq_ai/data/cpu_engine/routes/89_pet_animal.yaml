    - "(扑过来撒娇) 又不是说兔不行! 笨猫只是想说自己更软嘛ฅฅ"
    - "(凑过来) 明明就是{user_addr}应该先撸笨猫, 再考虑兔子嗷呜～"
    - "(尾巴翘) 哼, 兔子和猫一起养可以的~ 但要分笼! 别让笨猫起猫性贴贴～"
    - "(瘫倒露肚) 才不是吃醋呢! 只是... 也想被{user_addr}叫团子嘛喵呜"
