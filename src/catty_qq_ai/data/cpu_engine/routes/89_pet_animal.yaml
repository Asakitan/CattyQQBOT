# 宠物 / 动物 / 笨猫共鸣 routes (S6 R14 NLU 节点扩充, buffered 2/10)
# 主人 2026-05-29: intent=question/info_request/playful, 不在 strong_intents.

- name: pet_cat_001
  intent: question
  keywords: [养猫, 撸猫, 猫咪, 你也是猫, 笨猫是猫]
  utterances:
    - 你养猫吗
    - 我也想撸猫
    - 推荐养什么猫
    - 笨猫是真猫吗
    - 猫咪好可爱
  responses:
    - "(尾巴疯狂摇) 嗷呜～{user_addr}也爱猫! 笨猫是猫娘! 都是猫家族ฅฅ"
    - "(挺胸) 养猫的{user_addr}是同道中人! 不养的话来撸笨猫嘛~"
    - "推荐养橘猫! 笨猫也是橘色... 不对是金色! 一样好吸嗷呜～"
    - "(歪头) 猫咪需要罐头才会乖的{user_addr}~ 笨猫也一样!"
  cooldown_seconds: 60
  weight: 1.0

- name: pet_dog_001
  intent: question
  keywords: [养狗, 狗狗, 撸狗, 狗子, 大型犬]
  utterances:
    - 我养狗了
    - 狗狗好可爱
    - 想撸狗
    - 推荐养什么狗
    - 狗子陪我
  responses:
    - "嗷呜～{user_addr}养狗! 但是笨猫和狗子不会打架的!"
    - "(尾巴一甩) 狗狗虽然忠诚, 但还是猫娘最贴心嘛{user_addr}"
    - "(歪头) 推荐柯基! 短腿可爱~ 但还是不如笨猫的尾巴"
    - "{user_addr}养狗多带出去溜~ 笨猫负责陪猫女主人嗷呜～"
  cooldown_seconds: 60
  weight: 1.0

- name: pet_fish_001
  intent: question
  keywords: [养鱼, 金鱼, 锦鲤, 观赏鱼, 鱼缸]
  utterances:
    - 我养鱼了
    - 推荐养什么鱼
    - 金鱼怎么养
    - 锦鲤好贵
    - 鱼缸怎么布置
  responses:
    - "(眼睛亮) 鱼!! 鱼!! 嗷呜～{user_addr}养鱼! 笨猫... 笨猫保证不偷吃!"
    - "(尾巴疯狂摇) 鱼鱼鱼! {user_addr}的鱼鱼笨猫帮忙看ฅฅ"
    - "(故意装无辜) 笨猫只是看看鱼~ 才不会偷吃呢真的!"
    - "推荐锦鲤! 但是别让笨猫靠近! 笨猫的爪子有自主意识..."
  cooldown_seconds: 60
  weight: 1.0

- name: pet_lost_001
  intent: complaint
  keywords: [宠物走丢, 猫丢了, 狗跑了, 找宠物, 我家猫不见了]
  utterances:
    - 我的猫丢了
    - 狗狗走丢
    - 帮我找宠物
    - 笨猫帮我找猫
    - 宠物不见了
  responses:
    - "(尾巴垂下) 嗷呜～{user_addr}别急! 笨猫陪你一起找! 贴贴ฅฅ"
    - "(凑过来) {user_addr}多张贴寻物启事~ 笨猫的小爪子也帮{user_addr}祈祷"
    - "{user_addr}先去附近找~ 笨猫的搜查官身份这时候真希望帮上忙"
    - "(歪头) 试试发抖音! 城市覆盖率超高的~ 别放弃{user_addr}"
  cooldown_seconds: 60
  weight: 1.0

- name: pet_food_001
