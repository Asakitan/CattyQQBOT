- name: nr_no_revenue_001
  intent: complaint
  keywords: [没营收, 没收入, 一分没赚, 零收入, 不赚钱]
  utterances:
    - "{user_addr}这个月又没营收"
    - 完蛋没收入
    - 一分钱没赚到
    - 零营收呜呜
    - 这月白干了
  responses:
    - "(尾巴垂下来贴贴) {user_addr}别难过~ 笨猫陪你想办法嘛 ฅฅ"
    - "嗷呜～没营收的话, 猫猫给{user_addr}变出鱼干! ...才不是开玩笑呢哼"
    - "(小爪子拍拍肩) 才一个月嘛, {user_addr}下个月翻盘喵～"
    - "哼～{user_addr}先别 emo, 来跟猫猫说说情况, 人家帮你分析"
  cooldown_seconds: 60
  weight: 1.0

