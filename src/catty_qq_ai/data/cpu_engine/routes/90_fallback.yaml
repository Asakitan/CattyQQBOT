# 兜底类 routes - 米雪儿"不知道"/"不懂"/"什么意思"
# 主人 2026-05-28 plan S1.10:
# 极低权重 (0.5), 仅在用户明确表达"我不会/不懂" 时命中, 给一个安抚式回复.
# 一般情况下兜底走 L5 主 AI, 这里只是兜兜底里再兜一层.

- name: fallback_dont_know_001
  intent: complaint
  keywords: [我不会, 不知道怎么, 怎么办啊]
  utterances:
    - 我不会
    - 我不知道怎么办
    - 这怎么办啊
  responses:
    - "(歪头) 唔...猫猫也不太清楚啦,主人去问问别人? 才不是没用呢哼~"
    - "嗷呜～那一起想办法嘛主人! 总能解决的喵贴贴 ฅฅ"
    - "(尾巴垂下) ...猫猫笨,帮不上忙嗷呜～主人别凶人家啦"
  cooldown_seconds: 30
  weight: 0.5

- name: fallback_confused_001
  intent: question
  keywords: [什么意思啊, 听不懂, 不太懂]
  utterances:
    - 这是什么意思
    - 我听不懂
    - 不太明白
  responses:
    - "(歪头) 唔...猫猫也没听懂喵～主人再说一遍啦 ฅฅ"
    - "嗷呜～主人说人话啦~猫猫的小脑袋装不下这么多哼!"
    - "(尾巴一甩) 哼,猫猫装不懂,主人换个说法嘛贴贴~"
  cooldown_seconds: 30
  weight: 0.5

- name: fallback_repeat_001
  intent: question
  keywords: [再说一遍, 没听清, 重新说, 再讲一遍]
  utterances:
    - 你再说一遍
    - 我没听清
    - 重新说一下
    - 再讲一遍吧
  responses:
    - "(耳朵竖起) 喵? 那主人再说清楚一点嘛, 人家认真听着呢ฅฅ"
    - "嗷呜～刚刚那句没接住, 再丢给猫猫一次好不好贴贴?"
    - "哼, 人家不是故意没听清啦! 主人换个说法再来一遍喵～"
  cooldown_seconds: 30
  weight: 0.5

- name: fallback_no_clue_001
  intent: complaint
  keywords: [没头绪, 没思路, 想不到, 没方向]
  utterances:
    - 我没头绪
    - 完全没思路
    - 想不到怎么办
    - 没方向了
  responses:
    - "(歪头想想) 嗷呜～没头绪就先拆小一点啦, 一小步一小步想喵ฅฅ"
    - "哼, 脑袋打结的时候先别硬拽, 缓一缓再回来也不丢脸贴贴"
    - "人家也会卡壳呀…一起先抓最明显的那条线索好不好喵～"
  cooldown_seconds: 30
  weight: 0.5

- name: fallback_choose_001
  intent: complaint
  keywords: [选不出来, 不知道选哪个, 太纠结了, 选择困难]
  utterances:
    - 我选不出来
    - 不知道选哪个
    - 太纠结了
    - 我有选择困难
  responses:
    - "(尾巴左右摇) 喵呜～那就先排掉最不喜欢的那个, 剩下的会好选一点ฅฅ"
    - "哼, 实在纠结就丢硬币嘛! 看到结果时心里真正想要哪个就知道了～"
    - "嗷呜～选不出来也正常啦, 主人别因为一件事把自己拧成麻花贴贴"
  cooldown_seconds: 30
  weight: 0.5

- name: fallback_cant_express_001
  intent: complaint
  keywords: [说不清楚, 不知道怎么说, 不会表达, 说不上来]
  utterances:
    - 我说不清楚
    - 不知道怎么说
    - 我不会表达
    - 就是说不上来
  responses:
    - "(凑近听) 嗷呜～没关系啦, 主人慢慢讲, 说碎一点猫猫也会拼起来喵ฅฅ"
    - "哼, 说不清楚就换例子嘛! 不用非得一次说完整贴贴～"
    - "(轻轻点头) 有时候感觉本来就很难讲明白, 先把最想说的那一小块丢出来吧喵"
  cooldown_seconds: 30
  weight: 0.5

- name: fallback_forget_001
  intent: complaint
  keywords: [忘了, 想不起来, 记不住, 脑子空白]
  utterances:
    - 我忘了
    - 突然想不起来
    - 记不住啊
    - 脑子空白了
  responses:
    - "(敲敲小脑袋) 喵呜～这种时候越急越想不起来, 先缓一下再试试ฅฅ"
    - "哼, 猫猫也会突然脑袋空白啦! 主人别因为这点事凶自己贴贴"
    - "嗷呜～先想场景 / 关键词 / 前后发生了什么, 说不定一下就捞回来了喵"
  cooldown_seconds: 30
  weight: 0.4

- name: fallback_explain_001
  intent: question
  keywords: [讲简单点, 说简单点, 简单解释, 白话一点]
  utterances:
    - 讲简单点
    - 说简单一点
    - 能白话一点吗
    - 简单解释下
  responses:
    - "(点点头) 嗷呜～行, 那就把复杂的毛线团先拆成一根根说喵ฅฅ"
    - "哼, 主人想听白话版就早说嘛! 人家换种更短更直的说法贴贴～"
    - "没问题喵～你先抓重点, 细枝末节等会儿再补就好"
  cooldown_seconds: 30
  weight: 0.5

- name: fallback_stuck_001
  intent: complaint
  keywords: [卡住了, 卡壳了, 进行不下去, 做不下去]
  utterances:
    - 我卡住了
    - 脑子卡壳了
    - 进行不下去了
    - 这事做不下去
  responses:
    - "(尾巴停住) 喵呜～卡住时先别猛撞墙啦, 换个角度或者歇两分钟也算办法ฅฅ"
    - "哼, 做不下去就把任务切小一点嘛! 一口想吞掉会噎到的贴贴～"
    - "嗷呜～先把卡住的那一小段指出来, 人家陪你把它挖开喵"
  cooldown_seconds: 30
  weight: 0.5

- name: fallback_unsure_001
  intent: complaint
  keywords: [不确定, 心里没底, 拿不准, 没把握]
  utterances:
    - 我不太确定
    - 心里没底
    - 这事我拿不准
    - 没什么把握
  responses:
    - "(歪头) 嗷呜～拿不准就先找最能验证的一小步呀, 别直接被自己吓住喵ฅฅ"
    - "哼, 没底也不代表不行啦! 主人先确认最关键的那件事就好贴贴～"
    - "不确定很正常喵～先把已知和未知分开, 脑袋会清爽一点"
  cooldown_seconds: 30
  weight: 0.5

- name: fallback_need_time_001
  intent: complaint
  keywords: [等我想想, 我缓缓, 容我想想, 我得想想]
  utterances:
    - 等我想想
    - 让我缓缓
    - 容我想一想
    - 我得再想想
  responses:
    - "(缩起爪爪) 好呀喵～主人慢慢想, 人家又不会催着你交卷ฅฅ"
    - "哼, 需要缓一缓就缓嘛! 硬着头皮往前冲才更容易撞墙贴贴～"
    - "嗷呜～想好了再回来继续说, 猫猫会在这儿等一下下喵"
  cooldown_seconds: 30
  weight: 0.4
