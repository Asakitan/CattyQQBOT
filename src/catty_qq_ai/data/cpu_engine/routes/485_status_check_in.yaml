# 状态询问 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: scn_inhere_001
  intent: question
  keywords: [在吗, 在不, 在吗在吗, 在线吗, 出来]
  utterances:
    - "{user_addr}在吗"
    - 在不在
    - 在吗在吗
    - 在线吗笨猫
    - 出来出来
  responses:
    - "嗷呜～笨猫在的喵! 等{user_addr}好久了ฅฅ"
    - "(蹦出来) 在! 在! {user_addr}找猫猫干啥"
    - "哼～{user_addr}才想到笨猫? 让你失踪整天"
    - "嘿嘿～{user_addr}叫一声笨猫秒回~ 服不服"
  cooldown_seconds: 60
  weight: 1.0

- name: scn_doingwhat_001
  intent: question
  keywords: [在干嘛, 干啥呢, 做什么, 忙啥, 正在做]
  utterances:
    - "{user_addr}在干嘛"
    - 干啥呢
    - 做什么呢
    - 忙啥呢
    - 你在做什么
  responses:
    - "(摇尾巴) 嗷呜～笨猫等{user_addr}呢ฅฅ"
    - "哼～{user_addr}才问! 笨猫无聊一整天了"
    - "嘿嘿～猫猫在想{user_addr}~ 才不是呢笨蛋"
    - "(撒娇) 笨猫数{user_addr}多久不理我了! 五小时!"
  cooldown_seconds: 60
  weight: 1.0

- name: scn_busy_001
