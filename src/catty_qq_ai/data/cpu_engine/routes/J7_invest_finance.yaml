    - "嗷呜～{user_addr}A 股: 上证 + 深证 + 创业 + 科创ฅฅ"
    - "(尾巴翘) 沪深 300: 蓝筹龙头 / 大盘代表"
    - "{user_addr}T+1 / 涨跌停 10% / 创业 20%"
