- name: wce_cry_001
  intent: complaint
  keywords: [呜呜, 呜呜呜, 呜呜哭, 555, 呜了]
  utterances:
    - "{user_addr}呜呜"
    - "{user_addr}呜呜呜"
    - "{user_addr}呜呜哭"
    - "{user_addr}555"
    - "{user_addr}呜了"
  responses:
    - "(扑过去) {user_addr}哭啥喵ฅฅ"
    - "嗷呜～笨猫舔泪!"
    - "才不是看不得{user_addr}哭呢哼"
    - "(贴贴) {user_addr}笨猫陪~"
  cooldown_seconds: 60
  weight: 1.0

