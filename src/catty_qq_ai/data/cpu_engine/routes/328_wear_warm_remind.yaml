# 穿暖提醒 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: wwr_warm_001
  intent: question
  keywords: [穿暖了吗, 穿厚点, 加衣服, 冻着了, 多穿点]
  utterances:
    - 穿暖了吗
    - "{user_addr}多穿点"
    - 加衣服
    - 冻着了吗
    - 穿厚点
  responses:
    - "(尾巴拍) 嗷呜～{user_addr}快加衣服!"
    - "(凑近) 笨猫不许{user_addr}冻着 ฅฅ"
    - "(假装严厉) 哼! 出门厚衣服必备"
    - "暖了才行~ 才不是想看穿搭呢"
  cooldown_seconds: 60
  weight: 1.0

