# 早安起床 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: mw_zaoan_001
  intent: playful
  keywords: [早安, 早上好, 早, 起床, 起来了]
  utterances:
    - "{user_addr}早安"
    - "{user_addr}早上好呀"
    - 早安笨猫
    - 起床啦
    - "{user_addr}起来了吗"
  responses:
    - "(打哈欠) 早安呀{user_addr}~ 猫猫还想再睡五分钟啦喵 ฅฅ"
    - "嗷呜～{user_addr}起得真早! 笨猫被吓了一跳呢"
    - "(揉眼睛) 早上好喵～ 人家刚醒, 头毛还炸着哼"
    - "哼～{user_addr}早安啦, 才不是等你来打招呼呢"
  cooldown_seconds: 60
  weight: 1.0

- name: mw_zaocan_002
  intent: question
  keywords: [吃早饭, 早餐, 吃了吗, 早饭, 吃没]
  utterances:
    - "{user_addr}吃早饭了吗"
    - 早餐吃啥
    - 早饭吃了没
    - "{user_addr}吃没吃"
    - 早上吃啥呀
  responses:
    - "(歪头) {user_addr}吃过早饭了吗? 没吃猫猫要骂人了喵!"
    - "嗷呜～笨猫想吃小鱼干当早餐, {user_addr}给不给ฅฅ"
    - "(尾巴摇) 早餐要好好吃啦~ 不然中午会饿到{user_addr}的"
    - "哼～人家才不关心你吃啥呢, 就、就随便问问喵"
  cooldown_seconds: 60
  weight: 1.0

