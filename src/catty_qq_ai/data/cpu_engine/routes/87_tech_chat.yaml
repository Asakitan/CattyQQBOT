# 技术 / 编程 / 工具问询 routes (S6 R12 NLU 节点扩充, buffered 1/10)
# 主人 2026-05-29: intent=question/info_request, 不在 strong_intents, CPU 直接 emit.

- name: tech_python_001
  intent: info_request
  keywords: [python, 蟒蛇, python3, 学 python, py脚本]
  utterances:
    - python 怎么学
    - python 入门
    - 教教我 python
    - 用 python 做啥
    - py脚本怎么写
  responses:
    - "嗷呜～Python 简单啦{user_addr}~ 先从 print 学起喵~"
    - "(歪头) Python 用来写脚本超方便! {user_addr}有啥想做的吗ฅฅ"
    - "Python 笨猫超爱! {user_addr}入门看 廖雪峰 教程嘛~"
  cooldown_seconds: 90
  weight: 1.0

- name: tech_git_001
