# 技术 / 编程 / 工具问询 routes (R16 全面收紧 keywords - 防 github 单词误命中)
# 主人 2026-05-29 截图: 用户 "你 github 搜一下" 被 random 抽到 "冲突 pull --rebase"
# 根因: tech_git_001 keyword "github" 单独命中. 修: 单词级 → 指向 bot 的短语级.

- name: tech_python_001
  intent: info_request
  keywords: [怎么学 python, python 入门, 教教我 python, py 脚本怎么写, 学 python]
  utterances:
    - python 怎么学
    - python 入门
    - 教教我 python
    - 用 python 做啥
    - py脚本怎么写
  responses:
    - "嗷呜～Python 简单啦{user_addr}~ 先从 print 学起喵~"
    - "(歪头) Python 用来写脚本超方便! {user_addr}有啥想做的吗ฅฅ"
    - "Python 笨猫超爱! {user_addr}入门看 廖雪峰 教程嘛~"
  cooldown_seconds: 90
  weight: 1.0

- name: tech_git_001
  intent: info_request
  keywords: [git 怎么用, github 教程, 怎么用 git, git 入门, git pull 冲突, git push 失败, 怎么 fork]
  utterances:
    - git 怎么用
    - github 教程
    - git push 失败
    - git pull 冲突
    - 怎么 fork 仓库
  responses:
    - "嗷呜～git 基础: pull/add/commit/push 四件套{user_addr}!"
    - "(尾巴翘) 冲突的话先 pull --rebase~ 别直接 push 强推哼"
    - "github 用浏览器看仓库就行嘛~ 命令行学 git add ./commit/push 喵"
  cooldown_seconds: 90
  weight: 1.0

- name: tech_bug_001
  intent: complaint
  keywords: [出 bug 了, 这报错, 报错信息看不懂, 怎么 debug, traceback 看不懂, 调试不出来]
  utterances:
    - 又出 bug 了
    - 这报错看不懂
    - 调试不出来
    - traceback 太长
    - 怎么 debug
  responses:
    - "嗷呜～{user_addr}贴报错给笨猫看看! 不然只能猜哎"
    - "(歪头) bug 多半是 typo 嘛{user_addr}~ 先看变量名"
    - "(尾巴一甩) 调试就用 print 大法! 老土但管用喵~"
    - "{user_addr}贴 traceback 完整版~ 笨猫帮{user_addr}找问题ฅฅ"
  cooldown_seconds: 60
  weight: 1.0

