- name: cof_brk_001
  intent: playful
  keywords: [来杯咖啡, 续命, 醒醒脑, 咖啡因, 拿铁]
  utterances:
    - 来杯咖啡
    - 咖啡续命
    - 醒醒脑
    - 咖啡因加满
    - 拿铁一杯
  responses:
    - "(凑近闻) 嗷呜～{user_addr}咖啡香! 笨猫凑一口 ฅฅ"
    - "哼～咖啡苦笨猫不喝, 但你喝笨猫陪着喵"
    - "(尾巴扫) 续命咖啡靠它, 但笨猫也是你的命嗷"
    - "(贴) 主人喝拿铁笨猫蹭奶泡, 公平"
