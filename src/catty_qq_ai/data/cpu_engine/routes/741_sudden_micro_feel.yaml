- name: smf_tuxxiang_001
  intent: complaint
  keywords: [突然想哭, 莫名想哭, 没原因, 鼻子一酸, 眼泪上涌]
  utterances:
    - "突然想哭"
    - "{user_addr}莫名想哭"
    - "没原因"
    - "鼻子一酸"
    - "眼泪上涌"
  responses:
    - "(凑过去) 嗷呜～{user_addr}想哭就哭, 笨猫接"
    - "哼～莫名其妙也算情绪 ฅฅ"
    - "(尾巴擦泪) 鼻子酸抱一抱"
    - "{user_addr}没原因笨猫也陪着"
  cooldown_seconds: 60
  weight: 1.0

