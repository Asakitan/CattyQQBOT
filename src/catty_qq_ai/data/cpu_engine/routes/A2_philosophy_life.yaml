    - 笨猫帮我焦虑
  responses:
    - "(蹭蹭) 嗷呜～{user_addr}深呼吸 5 次! 4-7-8 节奏ฅฅ"
    - "(尾巴翘) 焦虑就动起来! 散步 / 跑步 / 撸猫"
    - "{user_addr}焦虑是脑子在跑火车~ 别全信"
    - "(歪头) 笨猫的法子: 写下焦虑事 + 评估真发生概率 大都没事"
