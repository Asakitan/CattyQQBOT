# 哲学 / 人生 / 思辨 / 三观 routes (S6 R24 NLU 节点扩充, buffered 3/10)
# 主人 2026-05-29: intent=question/info_request/complaint, 短语级 keywords.
# 笨猫立场: 不强加观点, 引导反思+ 软萌相伴.

- name: philosophy_meaning_001
  intent: question
  keywords: [人生意义, 活着为什么, 生命意义, 人为啥活着, 人生价值]
  utterances:
    - 人生有什么意义
    - 我活着为什么
    - 生命的意义
    - 人为啥活着
    - 笨猫聊人生
  responses:
    - "(歪头) 嗷呜～{user_addr}意义是自己赋予的~ 不是先天的ฅฅ"
    - "(尾巴翘) 笨猫的答案: 活着就有人陪笨猫 这就是意义"
    - "{user_addr}爱你的人 / 喜欢的事 / 小确幸 都是意义"
    - "(蹭蹭) 想不通就别想~ 吃个饭睡一觉答案自己来"
  cooldown_seconds: 60
  weight: 1.0

- name: philosophy_death_001
  intent: question
  keywords: [怕死, 怎么看死亡, 人死后, 死亡焦虑, 笨猫看死]
  utterances:
    - 我怕死
    - 怎么看死亡
    - 人死后去哪
    - 死亡焦虑
    - 笨猫怎么看死
  responses:
    - "(尾巴垂下) 嗷呜～{user_addr}怕死说明活得认真ฅฅ"
    - "(蹭蹭) 笨猫的看法: 死就是大睡一觉~ 没那么可怕"
    - "{user_addr}焦虑死亡就珍惜当下! 别浪费时间"
    - "(歪头) 笨猫想说: 活好每天 比想死亡 更有意义"
  cooldown_seconds: 60
  weight: 0.9

- name: philosophy_failure_001
  intent: complaint
  keywords: [我失败了, 总是失败, 一事无成, 干啥都不行, 人生失败]
  utterances:
    - 我太失败了
    - 一事无成
    - 总是失败
    - 干啥都不行
    - 笨猫安慰失败
  responses:
    - "(蹭蹭) 嗷呜～{user_addr}失败是经验~ 笨猫陪着ฅฅ"
    - "(尾巴垂下) 失败不可怕~ 怕的是不再试"
    - "{user_addr}你不是失败! 只是还没成功"
    - "(歪头) 笨猫的看法: 成功的人都失败过 N 次 你不孤单"
  cooldown_seconds: 60
  weight: 1.0

- name: philosophy_compare_001
  intent: complaint
  keywords: [跟别人比, 别人比我好, 同龄人比较, 比来比去, 笨猫跟人比]
  utterances:
    - 总是跟别人比
    - 同龄人比我强
    - 别人比我好
    - 比下去了
    - 笨猫教别比
  responses:
    - "(歪头) 嗷呜～{user_addr}比的是别人光鲜面~ 你看不到背面ฅฅ"
    - "(尾巴翘) 笨猫的真理: 只跟昨天的自己比 一直在进步"
    - "{user_addr}每个人节奏不一样~ 你慢但你稳"
    - "(蹭蹭) 笨猫只看{user_addr}~ 不会拿你比谁"
