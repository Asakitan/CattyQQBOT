    - "(尾巴翘) 笨猫的方法: 列优劣 + 跟过来人聊 + 听内心"
    - "{user_addr}两难就抛硬币! 翻看时心里偏向就是答案"
    - "(蹭蹭) 笨猫陪{user_addr}~ 怎么选都支持你"
