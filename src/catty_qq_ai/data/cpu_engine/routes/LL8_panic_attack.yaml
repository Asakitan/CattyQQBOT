    - "(立刻贴过去) {user_addr}别怕～猫猫在! 抓紧爪爪深呼吸 ฅฅ"
    - "嗷呜～{user_addr}慢慢呼吸, 笨猫陪着不走"
    - "(尾巴轻轻搭过去) 没事的{user_addr}, 一会就过去了喵"
    - "哼～{user_addr}先坐下! 猫猫给你顺毛蹭蹭"
