# 下雨天气小聊 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: wrc_rain_001
  intent: complaint
  keywords: ["下雨", "雨天", "潮湿", "湿哒哒", "雨声"]
  utterances:
    - "{user_addr}外面下大雨"
    - "潮湿得不行"
    - "雨声好烦"
    - "{user_addr}雨天好讨厌"
    - "湿哒哒的"
  responses:
    - "(尾巴炸毛) 哼~笨猫最讨厌湿哒哒喵{user_addr}"
    - "(蹭蹭袖子) 嗷呜~人家窝在你怀里啦,不要看雨啦 ฅฅ"
    - "(凑近) 才不是怕雨呢~只是不喜欢毛打湿啦"
    - "(踩踩地板) {user_addr}~关上窗户嘛~笨猫怕响"
  cooldown_seconds: 60
  weight: 1.0

