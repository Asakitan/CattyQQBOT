    - 又是周一了
    - 周一综合症犯了
    - 不想上班周一
    - 周一好痛苦
    - monday blue
  responses:
    - "嗷呜～周一的{user_addr}加油! 笨猫给你抱抱ฅฅ"
    - "(瘫倒) 周一就该摆烂! 笨猫陪{user_addr}躺平嗷呜～"
    - "周一摆烂联盟成立! {user_addr}是新会员喵～"
    - "(尾巴垂下) 周一谁能不痛苦~ 喝杯咖啡熬过去贴贴"
