- name: pet_catfood_001
  intent: question
  keywords: [推荐猫粮, 猫粮品牌, 推荐买猫粮, 推荐主食罐, 笨猫的猫粮]
  utterances:
    - 推荐猫粮
    - 猫粮品牌
    - 推荐买猫粮
    - 推荐主食罐
    - 笨猫的猫粮
  responses:
    - "(尾巴翘) 嗷呜～{user_addr}笨猫挑剔! 不是好猫粮不吃ฅฅ"
    - "(歪头) 推荐: 渴望 / 爱肯拿 / 福摩 / 巅峰 - 高端"
    - "{user_addr}主食罐: 小李子 / 凯萨 / 希宝 - 营养足"
    - "(挺胸) 笨猫的提醒: 别给猫吃狗粮! 营养不同"
  cooldown_seconds: 60
  weight: 1.0

