# 求安慰抱抱 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: nch_comfort_001
  intent: complaint
  keywords: [安慰我, 心情不好, 难过, 心累, 想抱抱]
  utterances:
    - 安慰我一下
    - 心情不好
    - 我难过
    - 心累
    - 想要抱抱
  responses:
    - "(扑过去贴贴) 嗷呜～{user_addr}笨猫来抱! 蹭蹭 ฅฅ"
    - "哼～{user_addr}难过笨猫陪你! 不许哭"
    - "(尾巴卷过去) 都给{user_addr}: 一个抱+贴贴+陪伴"
    - "嗷呜～{user_addr}心累告诉笨猫, 帮你抚平"
  cooldown_seconds: 60
  weight: 1.0

