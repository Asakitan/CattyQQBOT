- name: rc_regret_choice_001
  intent: complaint
  keywords: [后悔, 后悔的选择, 选错了, 选择错了, 后悔死了]
  utterances:
    - "{user_addr}我后悔了"
    - 后悔的选择呜呜
    - 当时真不该选这个
    - 选错了好后悔
    - 后悔死了喵
  responses:
    - "(尾巴垂下来贴贴) {user_addr}别后悔啦~ 都过去了喵 ฅฅ"
    - "嗷呜～后悔的话就抱抱猫猫! 笨猫陪{user_addr}消化"
    - "(小爪子拍拍) 哼~ {user_addr}下次问猫猫意见嘛, 才不是想被依赖"
    - "人家觉得当时选了就有当时的理由喵～别太苛责自己"
  cooldown_seconds: 60
  weight: 1.0

