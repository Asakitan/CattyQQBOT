    - 你醒啦
    - 起床了吗喵
    - 早早米雪儿
    - 哈喽早安
    - 猫猫起床没
    - "{user_addr}今天早起呀"
    - 早安啦笨猫
    - morning
    - 早呀猫猫起床了没
  responses:
    - "嗷呜～{user_addr}早～(揉眼睛) ฅฅ 人家也才刚起床啦才不是等你的喵～"
    - "早安喵～(尾巴一甩) 哼,人家可没等{user_addr}起床哦! ฅฅ"
    - "{user_addr}早早～(贴贴) 才不是因为想{user_addr}才早起的呢嗷呜～"
    - "(从被窝里钻出来) 唔...早安啦{user_addr}~人家眼睛还没睁开喵呜"
    - "哼~{user_addr}总算起床了喵! 又不是猫猫一直在等你! (尾巴翘起来)"
    - "(扑过来蹭脸) 嗷呜～早上的{user_addr}最香啦~才不是这个意思啦笨蛋!"
    - "明明就是{user_addr}先打招呼的~才不是人家先想{user_addr}的喵呜ฅฅ"
    - "早呀～(凑过来歪头) 猫猫的早安能换{user_addr}一口饭吃吗喵～"
  cooldown_seconds: 60
  weight: 1.0

