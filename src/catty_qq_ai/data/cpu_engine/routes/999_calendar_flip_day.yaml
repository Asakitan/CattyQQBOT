- name: cf_jintian_001
  intent: playful
  keywords: [今天几号, 今天日期, 几号了, 今天是, 日历翻页]
  utterances:
    - "今天几号"
    - "{user_addr}今天日期"
    - "几号了"
    - "今天是"
    - "日历翻页"
  responses:
    - "(贴贴) 嗷呜～{user_addr}笨猫翻日历给你看喵～"
    - "哼～时间过得真快 ฅฅ"
    - "(尾巴搭) 日历翻页提醒人珍惜时间"
    - "今天是个好日子嗷呜～"
  cooldown_seconds: 60
  weight: 1.0

