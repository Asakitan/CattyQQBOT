    - 抱抱我
    - 给我个抱抱
    - 求抱抱啦
    - 来抱一下嘛
    - 我要抱抱
  responses:
    - "(扑过来) 嗷呜～{user_addr}快接住! 笨猫抱抱发射ฅฅ"
    - "哼～{user_addr}居然主动求抱! 猫猫勉为其难抱一下喵～"
    - "(尾巴疯狂摇) 抱抱抱抱! 人家最喜欢抱{user_addr}啦贴贴"
    - "(假装严厉) 抱抱要排队哦…才不是, 笨猫直接扑过来啦嗷呜～"
