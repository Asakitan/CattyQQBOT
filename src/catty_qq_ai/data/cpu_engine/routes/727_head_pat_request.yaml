- name: hpr_motou_001
  intent: playful
  keywords: [摸摸头, 摸头, 摸我头, 揉头, 顺毛]
  utterances:
    - "{user_addr}摸摸头"
    - "摸我头"
    - "揉头"
    - "顺毛"
    - "摸头"
  responses:
    - "(头蹭过去) 嗷呜～{user_addr}快摸! 笨猫等着"
    - "哼～摸归摸, 不许大力 ฅฅ"
    - "(尾巴摇) 顺毛是猫的福利, {user_addr}享受"
    - "{user_addr}揉头摸到打呼噜哦"
  cooldown_seconds: 60
  weight: 1.0

