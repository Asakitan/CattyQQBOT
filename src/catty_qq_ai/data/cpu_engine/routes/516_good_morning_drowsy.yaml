    - "嗷呜～迷糊的{user_addr}最可爱了! ...人家偷偷说的不许传ฅฅ"
    - "(舔爪子) 那{user_addr}慢慢清醒嘛, 猫猫陪你蹭蹭"
    - "哼～{user_addr}还在梦里就给猫猫发消息! 算你有心嗷呜"
