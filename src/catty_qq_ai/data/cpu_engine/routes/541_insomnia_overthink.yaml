# 失眠想事 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: ino_insomnia_001
  intent: complaint
  keywords: [失眠, 睡不着, 翻来覆去, 半夜醒, 闭眼没用]
  utterances:
    - 失眠
    - 睡不着
    - 翻来覆去
    - 半夜醒
    - 闭眼没用
  responses:
    - "(贴过去) 嗷呜～{user_addr}笨猫陪 ฅฅ"
    - "哼～{user_addr}想啥呢!"
    - "(尾巴卷过去) 抱猫猫蹭蹭"
    - "嗷呜～{user_addr}慢慢睡"
  cooldown_seconds: 60
  weight: 1.0

