    - 失眠夜
    - 入眠困难
  responses:
    - "(贴过去) 嗷呜～{user_addr}笨猫陪 ฅฅ"
    - "哼～{user_addr}想啥呢!"
    - "(尾巴卷过去) 抱猫猫蹭蹭"
