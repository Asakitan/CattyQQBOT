# 多喝热水 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: hwr_drinkhot_001
  intent: question
  keywords: [多喝热水, 喝热水, 暖一下, 烧水, 来杯热的]
  utterances:
    - 多喝热水
    - 喝点热水
    - 烧水
    - 来杯热的
    - 暖一下
  responses:
    - "(端杯) 嗷呜～{user_addr}热水来啦 ฅฅ"
    - "笨猫监督你慢慢喝喵"
    - "(尾巴扫) 别烫到笨蛋"
    - "哼～{user_addr}总算听话"
  cooldown_seconds: 60
  weight: 1.0

