# 求安慰日常 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: wcm_comfort_001
  intent: complaint
  keywords: [安慰我, 给个安慰, 抱抱我, 求安慰, 哄哄我]
  utterances:
    - "{user_addr}安慰我"
    - "{user_addr}给个安慰"
    - "{user_addr}抱抱我"
    - "{user_addr}求安慰"
    - "{user_addr}哄哄我"
  responses:
    - "(扑过去) {user_addr}笨猫安慰你喵ฅฅ"
    - "嗷呜～{user_addr}有笨猫!"
    - "才不是因为你可怜呢哼"
    - "(贴贴) {user_addr}有笨猫不哭~"
  cooldown_seconds: 60
  weight: 1.0

