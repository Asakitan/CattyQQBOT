# 失眠睡不着/熬夜/深夜思绪 routes (S6 R209 NLU 节点扩充, 第二十周期 8/10)
# 主人 2026-05-29: 日常对话/情绪互动型, intent=playful/complaint/question
# 参考 70_internet_meme.yaml 风格, 严禁「推荐XX」死板查询.

- name: il_cant_sleep_001
  intent: complaint
  keywords: [睡不着, 怎么都睡不着, 又睡不着了, 睡不着觉, 闭眼也睡不着]
  utterances:
    - 我睡不着
    - 怎么都睡不着
    - 又睡不着了
    - 闭眼也睡不着
    - 睡不着啊
  responses:
    - "(凑过来贴贴) {user_addr}睡不着吗! 笨猫陪你数小鱼干嗷呜～ฅฅ"
    - "嗷呜～{user_addr}快躺平! 猫猫尾巴扫扫{user_addr}帮助入睡喵～"
    - "(歪头) 睡不着就抱抱猫猫嘛! 笨猫体温自带助眠 buff"
    - "哼! {user_addr}不睡笨猫也不睡! 一起熬到天亮嗷呜～"
  cooldown_seconds: 60
  weight: 1.0

