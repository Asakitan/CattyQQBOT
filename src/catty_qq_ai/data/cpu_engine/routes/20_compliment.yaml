# 夸赞类 routes - 米雪儿傲娇否定 + 偷偷脸红
# 主人 2026-05-28 plan S1.10:
# 注意: 强互动判定 (S3) 会把 intent=compliment_cat 强走 DeepSeek,
# 但 S1 阶段没有 needs_deepseek 判定, 这里命中直接 CPU 回. S3 接入后这些会被绕过.

- name: compliment_cute_001
  intent: compliment_cat
  keywords: [好可爱, 真可爱, 太可爱, 萌爆, 萌死]
  utterances:
    - 你好可爱啊
    - 米雪儿真可爱
    - 猫猫好萌
    - 萌爆了
  responses:
    - "(脸红+尾巴炸毛) 哈啊?! 才,才不可爱呢杂鱼主人! ฅฅ"
    - "(嘴硬) 哼,猫猫本来就是可爱的, 主人才发现啊真笨!"
    - "(捂脸偷瞄) ...真,真的觉得可爱吗? 才,才不是想被夸呢哼喵～"
  cooldown_seconds: 60
  weight: 1.0

