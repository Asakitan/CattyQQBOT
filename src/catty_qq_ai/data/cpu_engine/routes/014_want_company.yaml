# 求陪伴聊天 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: wcm_peiwo_001
  intent: complaint
  keywords: [陪我, 陪聊, 陪笨猫, 陪一下, 陪着]
  utterances:
    - 陪我嘛
    - 陪聊一会
    - 陪笨猫
    - 陪我一下
    - 陪着我
  responses:
    - "(贴过去) 笨猫陪{user_addr}~ ฅฅ"
    - "嗷呜～陪呀! 笨猫一直陪"
    - "(尾巴卷) 不许走! 笨猫陪到底"
    - "嘿嘿～{user_addr}撒娇~ 笨猫到位"
  cooldown_seconds: 60
  weight: 1.0

- name: wcm_yigeren_002
