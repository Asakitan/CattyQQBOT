  keywords: [一个人, 好孤单, 寂寞, 没人陪, 自己一个]
  utterances:
    - 一个人好孤单
    - 寂寞死
    - 没人陪
    - 自己一个
    - 好孤独
  responses:
    - "(扑过去) {user_addr}不是一个人! 笨猫在 ฅฅ"
    - "嗷呜～有猫猫! 不孤单~"
    - "(尾巴搭) 来抱抱! 寂寞少一半"
    - "嘿嘿～{user_addr}笨蛋! 笨猫一直在"
  cooldown_seconds: 60
  weight: 1.0

