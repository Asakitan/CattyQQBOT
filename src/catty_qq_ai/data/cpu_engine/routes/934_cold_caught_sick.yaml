# 感冒难受日常 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: cld_caught_001
  intent: complaint
  keywords: [感冒了, 着凉了, 鼻塞, 喷嚏, 流鼻涕]
  utterances:
    - 感冒了
    - 着凉了
    - 鼻塞
    - 一直打喷嚏
    - 流鼻涕
  responses:
    - "(贴脸) 嗷呜～{user_addr}多喝水 ฅฅ"
    - "哼～{user_addr}笨猫陪你养病喵"
    - "(尾巴卷) 多休息蹭蹭{user_addr}"
    - "{user_addr}笨猫给你盖被嗷呜～"
  cooldown_seconds: 60
  weight: 1.0

