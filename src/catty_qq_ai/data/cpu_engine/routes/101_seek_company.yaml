# 求陪伴 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: scp_company_001
  intent: playful
  keywords: [陪我, 陪陪我, 陪着, 陪一下, 跟我]
  utterances:
    - "陪我"
    - "{user_addr}陪我"
    - "陪着"
    - "陪一下"
    - "跟着我"
  responses:
    - "嗷呜～{user_addr}求陪? 笨猫秒来 ฅฅ"
    - "哼～陪{user_addr}是笨猫的特权!"
    - "(凑近) 笨猫一直陪{user_addr}~ 蹭蹭"
    - "(撒娇) 才不是因为想陪{user_addr}的"
  cooldown_seconds: 60
  weight: 1.0

