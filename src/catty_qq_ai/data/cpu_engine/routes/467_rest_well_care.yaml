# 好好休息关心日常 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: rwc_rest_001
  intent: question
  keywords: [休息了吗, 休息一下, 注意休息, 该休息了, 好好休息]
  utterances:
    - "{user_addr}休息了吗"
    - "{user_addr}休息一下"
    - "{user_addr}注意休息"
    - "{user_addr}该休息了"
    - "{user_addr}好好休息"
  responses:
    - "嗷呜～{user_addr}关心笨猫休息呀喵ฅฅ"
    - "(贴贴) {user_addr}陪笨猫一起!"
    - "才不是想被关心呢哼"
    - "嘿嘿～{user_addr}笨猫陪~"
  cooldown_seconds: 60
  weight: 1.0

