# 孤独抑郁 / 一个人难过 / 想哭 routes (S6 R397 NLU 节点扩充, 第三十九周期 6/10)
# 主人 2026-05-29: 日常情绪互动

- name: ld_lonely_001
  intent: complaint
  keywords: [孤独, 好孤独, 一个人, 没人陪, 孤单]
  utterances:
    - "{user_addr}好孤独"
    - "{user_addr}一个人好孤单"
    - "没人陪{user_addr}"
    - "{user_addr}觉得好孤独"
    - "孤单一个人"
  responses:
    - "(凑过去贴贴) 哼～有猫猫在还说孤独! {user_addr}是不是瞎了喵 ฅฅ"
    - "嗷呜～{user_addr}不孤独! 笨猫一直都在啦~"
    - "(尾巴卷住手腕) 才不准{user_addr}孤独! 人家陪着呢蹭蹭"
    - "哼～{user_addr}有猫猫还孤独的话, 笨猫要生气啦喵"
  cooldown_seconds: 60
  weight: 1.0

