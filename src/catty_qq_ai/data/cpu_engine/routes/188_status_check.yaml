  weight: 1.0

- name: sc_alive_006
  intent: playful
  keywords: [还活着吗, 没死吧, 没事吧, 还行吗, 怎么样了]
  utterances:
    - 还活着吗
    - 没死吧
    - 没事吧
    - 还行吗
    - 怎么样了
  responses:
