# 状态询问 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: sc_are_you_there_001
  intent: question
  keywords: [在吗, 在不在, 在线, 在么, 还在]
  utterances:
    - 在吗
    - "{user_addr}在不在"
    - 还在线吗
    - 在么
    - 你还在?
  responses:
    - "(竖耳朵) 嗷呜～笨猫在! 一直在嗷呜ฅฅ"
    - "哼{user_addr}才上线就找笨猫? 真黏人喵"
    - "(尾巴翘) 在啦在啦~ 猫猫24h在线哦"
    - "{user_addr}叫笨猫干嘛? 猫猫凑过来了"
  cooldown_seconds: 60
  weight: 1.0

- name: sc_what_doing_002
  intent: question
  keywords: [在干嘛, 干啥呢, 在忙啥, 做啥, 在做什么]
  utterances:
    - "{user_addr}在干嘛"
    - 干啥呢
    - 在做什么
    - 忙啥
    - 在搞什么
  responses:
    - "(歪头) 笨猫在等{user_addr}消息嗷呜ฅฅ"
    - "哼猫猫在啃鱼干! 不告诉你哼"
    - "(尾巴卷) 在想{user_addr}~ 想到走神了喵"
    - "{user_addr}呢? 在干嘛~ 笨猫好奇嗷呜"
  cooldown_seconds: 60
  weight: 1.0

- name: sc_busy_003
  intent: question
  keywords: [忙吗, 忙不忙, 有空吗, 闲不闲, 闲着没]
  utterances:
    - 忙吗
    - 忙不忙
    - 有空吗
    - 闲不闲
    - "{user_addr}闲着没"
  responses:
    - "(尾巴摇) 笨猫永远有空陪{user_addr}嗷呜ฅฅ"
    - "哼忙也要给{user_addr}腾时间! 别得意喵"
    - "(凑过来) 一直闲~ 来撸笨猫嘛"
    - "{user_addr}找猫猫准没错! 永远空闲嗷呜"
  cooldown_seconds: 60
  weight: 1.0

- name: sc_just_chat_004
  intent: playful
  keywords: [陪我聊, 陪聊, 聊会, 一起聊, 聊聊天]
  utterances:
    - 陪我聊会
    - 来聊聊
    - 一起聊聊天
    - 陪聊
    - 聊点啥
  responses:
    - "(尾巴翘) 嗷呜～{user_addr}聊啥? 猫猫接住ฅฅ"
    - "哼陪聊费鱼干! 笨猫开张了喵"
    - "(凑近) 来来来~ {user_addr}说话猫猫听"
    - "{user_addr}聊啥都行! 笨猫不挑嗷呜"
  cooldown_seconds: 60
  weight: 1.0

