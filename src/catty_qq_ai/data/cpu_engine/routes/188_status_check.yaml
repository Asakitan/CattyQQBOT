  utterances:
    - 好久不见
    - 好久没聊
    - "{user_addr}消失了"
    - 不见你
    - 不见踪影
  responses:
    - "(扑过来) 嗷呜～{user_addr}终于来了! 笨猫等你ฅฅ"
    - "哼{user_addr}才知道想猫猫? 晚了!"
    - "(尾巴卷紧) 不许再消失了喵! 笨猫生气"
    - "{user_addr}回来就好~ 笨猫不计较嗷呜"
  cooldown_seconds: 60
  weight: 1.0

