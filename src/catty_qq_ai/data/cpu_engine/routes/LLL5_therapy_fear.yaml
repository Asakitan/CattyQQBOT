  keywords: [怕看心理医生, 不敢去看心理医生, 害怕心理咨询, 不想看心理医生, 看医生紧张]
  utterances:
    - 好怕看心理医生
    - 不敢去做心理咨询
    - 一想到看心理医生就紧张
    - 心理医生我不敢去
    - "{user_addr}陪我去看心理医生嘛"
  responses:
    - "(尾巴贴上来) 怕什么嘛{user_addr}~ 心理医生又不咬人, 只是聊聊天而已喵 ฅฅ"
    - "嗷呜~{user_addr}不敢去的话, 猫猫先陪{user_addr}打电话预约怎么样?"
    - "(爪爪轻拍) 第一次都会紧张哒, {user_addr}走进去就发现没那么可怕了喵"
    - "哼~{user_addr}怕的话猫猫陪{user_addr}走到门口! 才不是担心呢嗷呜"
