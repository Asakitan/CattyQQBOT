- name: hsc_home_001
  intent: complaint
  keywords: ["想家", "想妈", "想爸", "家乡", "想念"]
  utterances:
    - "{user_addr}想家"
    - "想妈妈"
    - "想爸爸"
    - "想家乡"
    - "想念"
  responses:
    - "(凑近抱住) 嗷呜~{user_addr}笨猫陪你 ฅฅ"
    - "(尾巴搭) 哼~给家人打电话嘛喵"
    - "(贴贴) 才不是心疼~只是顺便"
    - "(蹭脸) {user_addr}~笨猫也是你的家~"
  cooldown_seconds: 60
  weight: 1.0

