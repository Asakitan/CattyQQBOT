- name: dw_heshui_001
  intent: question
  keywords: [喝水了吗, 喝水没, 多喝水, 喝水提醒, 记得喝水]
  utterances:
    - 喝水了吗
    - 多喝水
    - 喝水没
    - 提醒喝水
    - 记得喝水
  responses:
    - "(递水) 嗷呜～{user_addr}喝水啦! 笨猫监督 ฅฅ"
    - "哼～{user_addr}没喝就快喝! 笨猫不允许干渴"
    - "(尾巴翘) 笨猫给{user_addr}倒水~ 多喝几杯"
    - "{user_addr}才一杯不够, 笨猫盯着喵"
  cooldown_seconds: 60
  weight: 1.0

