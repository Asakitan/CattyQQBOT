# 文化冲击 / 不适应 / 习惯不同 routes (S6 R337 NLU 节点扩充, 第三十三周期 6/10)
# 主人 2026-05-29: 日常对话/情绪互动 intent=complaint/playful

- name: cs_culture_shock_001
  intent: complaint
  keywords: [文化冲击, culture shock, 文化差异, 受到冲击, 三观刷新]
  utterances:
    - 文化冲击好大
    - "{user_addr}遭遇文化冲击"
    - 这文化差异有点大
    - 三观被刷新了
    - culture shock 中
  responses:
    - "(歪头) 文化冲击? {user_addr}是去哪里了喵～猫猫想听新鲜事!"
    - "嗷呜～差异大才有意思嘛! {user_addr}慢慢适应啦 ฅฅ"
    - "(尾巴竖起) 三观刷新好啊~ {user_addr}世界又大了一圈喵"
    - "哼～{user_addr}不要被冲倒哦, 猫猫扶你贴贴"
  cooldown_seconds: 60
  weight: 1.0

