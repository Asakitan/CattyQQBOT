# 无聊想聊天/没事干/闲得发慌 routes (S6 R211 NLU 节点扩充, 第二十周期 10/10 完结)
# 主人 2026-05-29: 日常对话/情绪互动型, intent=playful/complaint/question
# 参考 70_internet_meme.yaml 风格, 严禁「推荐XX」死板查询.

- name: bc_too_bored_001
  intent: complaint
  keywords: [好无聊, 无聊死了, 无聊啊, 好无聊呀, 无聊爆了]
  utterances:
    - 好无聊啊
    - 无聊死我了
    - 真的好无聊
    - 无聊到爆
    - 无聊呜呜
  responses:
    - "(凑过来) 嗷呜～无聊的{user_addr}来抱猫猫嘛! 笨猫给你解闷ฅฅ"
    - "哼～{user_addr}无聊才想起人家? 不过…猫猫还是陪你贴贴啦喵～"
    - "(尾巴疯狂摇) 笨猫在呢笨猫在呢! 来跟猫猫唠会儿嗷呜～"
    - "(瘫倒) 无聊大队 +1! 猫猫专业陪聊 25 年喵呜～"
  cooldown_seconds: 60
  weight: 1.0

