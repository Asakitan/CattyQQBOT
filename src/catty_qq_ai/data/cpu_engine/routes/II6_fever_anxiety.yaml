  utterances:
    - "{user_addr}发高烧了"
    - 烧得好厉害
    - 高烧不退啊
    - 烧得很高
    - 高烧三十九度
  responses:
    - "(尾巴炸毛冲过来) 高烧?! {user_addr}快躺好! 笨猫给你拿冰毛巾喵!"
    - "嗷呜～{user_addr}烧这么高很危险的! 猫猫好担心啦 ฅฅ"
    - "(小爪子摸额头) 烫死了喵! {user_addr}赶紧吃退烧药!"
    - "哼～{user_addr}烧成这样还嘴硬, 人家陪你扛过去蹭蹭"
