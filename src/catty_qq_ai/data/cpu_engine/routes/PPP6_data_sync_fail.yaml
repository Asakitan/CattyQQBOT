- name: df_sync_fail_001
  intent: complaint
  keywords: [同步失败, 同步不上, 同步报错, 同步崩了, 同步出错]
  utterances:
    - 同步失败了
    - "{user_addr}同步又报错"
    - 同步崩了好烦
    - 同步不上去
    - 同步一直出错
  responses:
    - "(凑过来看屏幕) {user_addr}同步失败了? 笨猫陪{user_addr}骂两句 ฅฅ"
    - "嗷呜～又是同步~ {user_addr}重试一下试试? 猫猫掐指算下网络"
    - "(尾巴垂下) 同步报错最讨厌了喵! {user_addr}先深呼吸"
    - "哼～云服务又掉链子! {user_addr}别气坏自己, 猫猫陪着"
  cooldown_seconds: 60
  weight: 1.0

