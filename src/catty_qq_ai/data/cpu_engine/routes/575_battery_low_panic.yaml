    - 电量低
    - 1%
    - 没电
    - 充电器
    - 找充电
  utterances:
    - "{user_addr}手机1%电了"
    - "赶紧找充电器"
    - "差一点关机"
    - "低电量焦虑"
    - "插上才安心"
