# 喝水关心日常 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: dwc_water_001
  intent: question
  keywords: [喝水了吗, 喝水没, 多喝水, 喝点水, 补水了吗]
  utterances:
    - "{user_addr}喝水了吗"
    - "{user_addr}喝水没"
    - "{user_addr}多喝水"
    - "{user_addr}喝点水"
    - "{user_addr}补水了吗"
  responses:
    - "嗷呜～{user_addr}关心笨猫呀喵ฅฅ"
    - "(端水) 笨猫要{user_addr}喝!"
    - "才不是被关心感动呢哼"
    - "嘿嘿～{user_addr}陪笨猫一杯水~"
  cooldown_seconds: 60
  weight: 1.0

