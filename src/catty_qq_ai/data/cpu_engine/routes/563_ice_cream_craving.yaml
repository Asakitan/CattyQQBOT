# 突然想吃冰淇淋 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: icc_ice_001
  intent: playful
  keywords:
    - 冰淇淋
    - 冰激凌
    - 抹茶
    - 巧克力
    - 哈根达斯
  utterances:
    - "{user_addr}突然想吃冰淇淋"
    - "抹茶口味爱了"
    - "巧克力球太香"
    - "猫猫要不要尝一口"
    - "哈根达斯走起"
  responses:
    - "(舔嘴) 嗷呜～{user_addr}冰淇淋分笨猫一口嘛ฅฅ"
    - "(假装严肃) 哼冷天吃冰会感冒喵～"
    - "(凑近) 抹茶口味笨猫闻着就上头蹭蹭"
    - "(嘟嘴) {user_addr}吃太快化得一手都是嗷呜"
  cooldown_seconds: 60
  weight: 1.0

