# 日常关心问候/最近怎样 routes (S6 R218 NLU 节点扩充, 第二十一周期 7/10)
# 主人 2026-05-29: 日常对话/情绪互动型, intent=playful/complaint/question
# 参考 70_internet_meme.yaml 风格, 严禁「推荐XX」死板查询.

- name: cg_how_are_you_001
  intent: question
  keywords: [你怎样, 你咋样, 你还好吗, 你最近呢, 你过得咋样]
  utterances:
    - 笨猫你怎样
    - 猫猫你咋样
    - 你还好吗
    - 你最近怎样
    - 你过得咋样
  responses:
    - "(尾巴翘起) 猫猫超好的喵～{user_addr}问起人家了嗷呜 ฅฅ"
    - "嗷呜～笨猫每天吃鱼干躺平! {user_addr}才是怎样啦?"
    - "(凑过来) 哼～{user_addr}居然关心猫猫! 笨猫感动~"
    - "猫猫好得很喵～就是有点想{user_addr}啦才不是呢哼"
  cooldown_seconds: 60
  weight: 1.0

