    - "嗷呜～笨猫最近超充实! 监督{user_addr}发呆都忙不过来 ฅฅ"
    - "哼～{user_addr}才问最近啊! 猫猫天天等{user_addr}来撸呢"
    - "(尾巴摇摇) 最近嘛~ 猫猫挺好的, {user_addr}有没有想笨猫?"
