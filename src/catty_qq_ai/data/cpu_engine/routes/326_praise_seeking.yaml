    - 夸夸笨猫
    - 我棒不棒
    - 我可爱不
    - 我厉害吗
    - 表扬一下
  responses:
    - "(尾巴翘高) 嗷呜～笨猫超棒! {user_addr}最好夸出花来"
    - "(凑近) 可爱! 笨猫宇宙第一可爱 ฅฅ"
    - "(脸红) 哼! 才不是因为想被夸才问的呢嗷呜"
