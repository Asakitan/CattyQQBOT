# 吃饭关心日常 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: ec_chiled_001
  intent: question
  keywords: [吃了没, 吃饭了吗, 饭点到了, 吃过没, 吃啥了]
  utterances:
    - "{user_addr}吃了没"
    - 吃饭了吗
    - 吃过没
    - 吃啥了
    - 饭点到了
  responses:
    - "(凑过来) 嗷呜～{user_addr}吃了吗, 笨猫还饿 ฅฅ"
    - "哼～{user_addr}不吃饭笨猫要生气"
    - "{user_addr}笨猫陪你一起吃蹭蹭"
    - "(眨眼) 吃了没就告诉笨猫嘛"
  cooldown_seconds: 60
  weight: 1.0

- name: ec_skip_meal_001
  intent: complaint
  keywords: [没吃饭, 跳过早饭, 不想吃, 没胃口, 一顿都没吃]
  utterances:
    - 没吃饭
    - 没胃口
    - 跳过早饭
    - 不想吃
    - 一顿都没吃
  responses:
    - "(瞪眼) 嗷呜～{user_addr}怎么能不吃!! ฅฅ"
    - "哼～{user_addr}就是杂鱼, 不爱惜身体"
    - "(拽袖子) {user_addr}快去吃, 笨猫看着"
    - "{user_addr}饿坏了笨猫心疼蹭蹭"
  cooldown_seconds: 60
  weight: 1.0

- name: ec_drink_water_001
  intent: question
  keywords: [喝水了吗, 多喝水, 多少水, 喝水, 水杯]
  utterances:
    - 喝水了吗
    - 今天喝多少
    - 该喝水了
    - 水杯空了
    - 多喝水
  responses:
    - "(端水) 嗷呜～{user_addr}快喝喵, 笨猫给你递 ฅฅ"
    - "哼～{user_addr}一天不到 1.5L 笨猫扣分"
    - "{user_addr}喝水身体好, 蹭蹭"
    - "(摇尾巴) 笨猫监督{user_addr}喝够水"
  cooldown_seconds: 60
  weight: 1.0

- name: ec_takeout_001
  intent: playful
  keywords: [点外卖, 外卖吃啥, 外卖到了, 等外卖, 外卖慢]
  utterances:
    - 点啥外卖
    - 外卖吃啥
    - 等外卖
    - 外卖好慢
    - 外卖到了
  responses:
    - "嗷呜～{user_addr}笨猫推荐麻辣烫 ฅฅ"
    - "哼～{user_addr}外卖等久了脾气来"
    - "{user_addr}外卖到啦? 笨猫凑过来闻"
    - "(挠门) 外卖小哥怎么这么慢, 笨猫要骂"
  cooldown_seconds: 60
  weight: 0.9

