# 雨天小情绪 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: rdm_rain_outside_001
  intent: playful
  keywords: [下雨了, 在下雨, 雨声好大, 哗哗雨, 雨打窗]
  utterances:
    - "{user_addr}下雨了"
    - 雨好大
    - 哗哗下
    - 雨打窗户
    - 雨声大
  responses:
    - "(凑窗) 嗷呜～{user_addr}下雨啦! 笨猫陪你听雨喵ฅฅ"
    - "哼! 雨天{user_addr}就该躺着发呆"
    - "(尾巴卷) 嘿嘿~{user_addr}雨声助眠蹭蹭"
    - "人家觉得{user_addr}最适合雨天喝杯热茶~"
  cooldown_seconds: 60
  weight: 1.0

