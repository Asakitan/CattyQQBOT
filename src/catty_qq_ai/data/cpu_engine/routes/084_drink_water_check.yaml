# 喝水提醒 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: dwc_basic_001
  intent: question
  keywords: [喝水了吗, 喝水没, 多喝水, 喝水, 该喝水了]
  utterances:
    - "{user_addr}喝水了吗"
    - "喝水没"
    - "{user_addr}多喝水"
    - "该喝水了"
    - "我没喝水"
  responses:
    - "(凑过去) 嗷呜～{user_addr}快喝水! 笨猫监督 ฅฅ"
    - "哼～{user_addr}不喝水, 笨猫给你倒"
    - "(撒娇) {user_addr}喝一杯嘛~ 才不是关心"
    - "嘿嘿～没喝水的{user_addr}, 笨猫递杯过去"
  cooldown_seconds: 60
  weight: 1.0

