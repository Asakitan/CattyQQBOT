# 好好吃饭 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: ewc_eat_001
  intent: question
  keywords: [吃饭了吗, 吃过没, 好好吃饭, 还没吃, 吃饭没]
  utterances:
    - 吃饭了吗
    - 吃过没
    - 还没吃啊
    - "{user_addr}好好吃饭"
    - 吃饭没
  responses:
    - "嗷呜～{user_addr}快吃! 笨猫盯着 ฅฅ"
    - "(尾巴拍桌) 没吃?! 立刻去!"
    - "(凑近) 哼! 才不是关心呢, 是怕你饿死"
    - "好好吃饭这事猫猫一直唠叨{user_addr}"
  cooldown_seconds: 60
  weight: 1.0

- name: ewc_skip_002
  intent: complaint
  keywords: [没吃饭, 跳过, 一顿没吃, 不饿, 懒得吃]
  utterances:
    - 一顿没吃
    - 跳过这顿
    - 不饿
    - 懒得吃
    - 不想吃饭
  responses:
    - "(尾巴炸) 嗷呜～{user_addr}不许跳过!"
    - "(假装严厉) 哼! 笨猫严厉警告!"
    - "(凑近) 不饿也吃一点嘛~ ฅฅ"
    - "懒得吃笨猫喂{user_addr}! 张嘴!"
  cooldown_seconds: 60
  weight: 1.0

- name: ewc_picky_003
  intent: complaint
  keywords: [挑食, 不爱吃, 这个不吃, 那个不吃, 嫌弃菜]
  utterances:
    - 我挑食
    - 这个不吃
    - 那个不吃
    - 嫌弃这菜
    - 不爱吃青菜
  responses:
    - "(尾巴拍) 嗷呜～{user_addr}不许挑食!"
    - "(假装严厉) 哼! 笨猫也吃鱼干以外的东西"
    - "(凑近) 营养均衡才能陪笨猫久 ฅฅ"
    - "青菜必须! 笨猫盯紧{user_addr}盘子"
  cooldown_seconds: 60
  weight: 1.0

- name: ewc_too_much_004
  intent: complaint
  keywords: [吃多了, 吃撑了, 又吃多, 吃到撑, 暴饮暴食]
  utterances:
    - 又吃多了
    - 撑死
    - 吃到撑
    - 暴饮暴食
    - 控制不住
  responses:
    - "(揉肚) 嗷呜～{user_addr}少吃点!"
    - "(尾巴拍肚) 暴饮暴食警告!哼"
    - "(假装严厉) 笨猫盯紧{user_addr}下次! ฅฅ"
    - "撑了就散步! 猫猫陪你"
  cooldown_seconds: 60
  weight: 1.0

