    - "(贴贴) 笨猫永远陪{user_addr}喵ฅฅ"
    - "嗷呜～{user_addr}笨猫不走!"
    - "才不是想陪{user_addr}呢哼"
    - "嘿嘿～{user_addr}笨猫的尾巴搭上~"
