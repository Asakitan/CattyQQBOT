    - "(尾巴垂下来) 嗷呜～{user_addr}的球队输了啊! 猫猫陪{user_addr}难过一下下ฅฅ"
    - "哼～输了就输了嘛! {user_addr}别太上头, 下次再赢回来喵～"
    - "(凑过去贴贴) 笨猫知道{user_addr}很失望~ 来抱猫猫消消气贴贴"
    - "嗷呜～{user_addr}先吃个鱼干压压惊! 球场上的事看开点喵"
