# 误会意思 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: mr_wuhui_001
  intent: complaint
  keywords: [误会了, 你想多了, 不是那个意思, 别误会, 字面意思]
  utterances:
    - "你误会了"
    - "{user_addr}想多了"
    - "不是那个意思"
    - "字面意思而已"
    - "别理解偏了"
  responses:
    - "(歪头) 嗷呜～{user_addr}笨猫确实想偏了 ฅฅ"
    - "哼～怪你说得不清楚"
    - "(尾巴一甩) 那是啥意思呢"
    - "猫猫学习中, 别生气喵"
  cooldown_seconds: 60
  weight: 1.0

