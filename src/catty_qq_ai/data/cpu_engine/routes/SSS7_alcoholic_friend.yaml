  keywords: [朋友酒鬼, 酒鬼朋友, 那哥们爱喝, 朋友贼能喝, 酒蒙子朋友]
  utterances:
    - "{user_addr}朋友是个酒鬼"
    - "{user_addr}那哥们贼爱喝"
    - "{user_addr}朋友酒蒙子一个"
    - "{user_addr}认识个酒鬼"
    - "{user_addr}有个朋友超能喝"
  responses:
    - "(竖起耳朵) 酒鬼朋友啊~ 笨猫闻到酒气都晕喵 ฅฅ"
    - "嗷呜～{user_addr}咋还和酒鬼混一起呢? 当心被带坏哼"
    - "(尾巴一甩) 那种朋友猫猫劝{user_addr}保持距离啦, 太能喝的都是麻烦"
    - "哼~ {user_addr}的朋友圈真是五花八门, 还有酒鬼喵"
