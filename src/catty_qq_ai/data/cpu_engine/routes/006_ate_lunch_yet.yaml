    - "嗷呜～没胃口也得吃点! 笨猫不许 {user_addr} 饿着!"
    - "(叉腰) 跳餐会胃疼! 喝粥也行嘛"
    - "哼～{user_addr}再饿肚子, 笨猫就生气啦"
