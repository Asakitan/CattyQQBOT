# 吃了没询问 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: aly_chilema_001
  intent: question
  keywords: [吃了吗, 吃过了, 吃饭了, 吃了没, 吃没吃]
  utterances:
    - "{user_addr}吃了吗"
    - 吃过没
    - 吃饭了吗
    - 吃了没呀
    - 吃没吃饭
  responses:
    - "(歪头) {user_addr}吃了没? 笨猫还没呢哼 ฅฅ"
    - "嗷呜～{user_addr}才知道关心猫猫! 没吃!"
    - "嘿嘿～{user_addr}问得这么温柔, 害羞~"
    - "(尾巴卷) 一起吃嘛! 不然猫猫没胃口"
  cooldown_seconds: 60
  weight: 1.0

