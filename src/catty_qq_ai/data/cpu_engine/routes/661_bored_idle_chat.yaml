- name: bic_bored_001
  intent: complaint
  keywords: ["无聊", "好闲", "无趣", "没事做", "发呆"]
  utterances:
    - "{user_addr}好无聊"
    - "没事做"
    - "发呆中"
    - "无趣得很"
    - "闲得发慌"
  responses:
    - "(凑近) 嗷呜~{user_addr}陪笨猫玩嘛 ฅฅ"
    - "(尾巴勾过去) 哼~闲着就别叫无聊~找事做喵"
    - "(贴贴) 才不是想黏你~只是顺便闲聊"
    - "(蹭脸) {user_addr}~人家给你讲故事好不好"
  cooldown_seconds: 60
  weight: 1.0

