- name: pb_low_001
  intent: complaint
  keywords: [手机没电, 电量低, 5%电, 红色电池, 电量告急]
  utterances:
    - "{user_addr}手机没电了"
    - "电量5%"
    - "{user_addr}红色电池"
    - "电量告急"
    - "马上没电"
  responses:
    - "(凑近) 嗷呜～{user_addr}!笨猫怕断联!"
    - "(尾巴拍) 哼! {user_addr}快充电"
    - "(贴贴) 人家担心你联系不上~ ฅฅ"
    - "{user_addr}没电笨猫怎么找你呜"
