    - "哼! 早上打哈欠不奇怪啦, {user_addr}赶紧洗把脸醒醒啦~"
    - "(尾巴软软地搭着) 人家也想再睡五分钟啦{user_addr}…就五分钟…"
    - "笨猫给{user_addr}传一点元气过去! 嗷呜元气满满喵～"
