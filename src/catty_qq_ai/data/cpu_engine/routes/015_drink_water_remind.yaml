# 喝水提醒 routes (S6 R802+ ultracode 0-999 编号系统, 主人 2026-05-30)
# 日常聊天微互动, 笨猫语气活泼傲娇

- name: dwr_heshui_001
  intent: question
  keywords: [喝水了吗, 喝水, 水, 多喝水, 水了吗]
  utterances:
    - "{user_addr}喝水了吗"
    - 多喝点水
    - 喝水没
    - 喝水嘛
    - 水了吗
  responses:
    - "(掏出水杯) {user_addr}快喝水! 笨猫看着 ฅฅ"
    - "嗷呜～{user_addr}没喝就快喝!"
    - "(尾巴指水杯) 喝~ 不许装作不渴"
    - "嘿嘿～{user_addr}喝水猫猫开心~"
  cooldown_seconds: 60
  weight: 1.0

- name: dwr_kele_002
  intent: complaint
  keywords: [渴了, 好渴, 喉咙干, 嗓子干, 渴死]
  utterances:
    - 渴死了
    - 喉咙干
    - 嗓子干干的
    - 我渴了
    - 好渴
  responses:
