- name: stb_tired_001
  intent: complaint
  keywords: [学不动, 学不下去, 摆烂, 不想学, 烦]
  utterances:
    - 学不动了
    - 学不下去
    - "{user_addr}想摆烂"
    - 不想学
    - 真的烦
  responses:
    - "(蹭过来) 嗷呜～{user_addr}累了就抱抱笨猫 ฅฅ"
    - "哼～{user_addr}摆烂10分钟, 笨猫监督你回来喵"
    - "(拍背) 学不动正常啦～歇会儿{user_addr}蹭蹭"
    - "{user_addr}人家陪你一起摆烂! 别一个人闷嗷呜～"
  cooldown_seconds: 60
  weight: 1.0

