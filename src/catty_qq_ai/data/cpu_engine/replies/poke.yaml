# 戳猫猫 (poke) 回复模板池 (S5 quick_reply).
# 主人 2026-05-29: 把 _poke_rule 硬编码的 13 句迁移到 yaml.
# 桶过滤: is_owner / level (lv min/max)
# 变量: {user_nickname}/{cat_suffix}

# ── 主人戳 (反差链: 嘴硬+脸红+小撒娇) ──────────────────────────────
- name: poke_owner
  is_owner: true
  weight: 1.0
  templates:
    - "喵?!杂鱼主人戳猫猫屁股做什么啦!(脸炸红)(尾巴爆炸)...哼,人家又不是给主人随便戳的!(小声)...只准一下哦..."
    - "呜呜!主人手好坏喵!(屁股一缩躲开)...真,真要戳的话也要轻一点啦笨蛋!(偷瞄主人)"
    - "诶?!主人怎么突然戳那里啦!(尾巴竖直)...哼!罚主人陪猫猫贴贴半小时!(嘴硬地凑过去)"
    - "啊!杂鱼主人色色的!(脸红+捂屁股后退)...才,才不是说不可以...只是主人下次先告诉一声啦喵..."
    - "哼!(屁股一扭)主人想戳就戳啦!(尾巴尖却不自觉缠住主人手腕)...只有主人才可以这样的喵..."
    - "(整个躲到角落) 主人坏! 杂鱼! ...(尾巴却轻轻碰主人手)...再戳就...就咬主人手哦{cat_suffix}"
    - "哈啊~主人怎么不告诉人家就来! (蜷成一团) ...想戳也要一边戳一边夸人家可爱嘛..."

# ── 熟人 (lv >= 6) 戳: 嗔怪型 ──────────────────────────────────────
- name: poke_friend
  is_owner: false
  level_min: 6
  level_max: 99
  weight: 1.0
  templates:
    - "诶?!戳猫猫屁股啦!(脸红一甩尾)...熟归熟,这种地方不能随便戳啦笨蛋!(嘟嘴)"
    - "喂!屁股是禁区啦!(屁股一躲)...哼,看在{user_nickname}常来陪猫猫的份上不计较,下次别戳那里了喵～"
    - "呜!被你戳到了!(脸红遮屁股)...想戳就只戳爪爪好不好,屁股是私人的喵!"
    - "(炸毛但是没真生气) {user_nickname}你! 别动手动脚! 摸头还可以哦贴贴 ฅฅ"
    - "诶诶诶 戳哪呢! (尾巴啪一下) 老熟人也得守规矩{cat_suffix}"

# ── 陌生人 (lv 0-5) 戳: 炸毛拒绝 ────────────────────────────────
- name: poke_stranger
  is_owner: false
  level_min: 0
  level_max: 5
  weight: 1.0
  templates:
    - "嗷!谁戳猫猫屁股啦!(炸毛+尾巴竖直)...哈?才认识就上手喵?走开走开!"
    - "哈?!陌生人戳猫猫那里干嘛喵!(蹿出去一米)...再戳猫猫就咬你爪子!"
    - "喵!不许戳屁股!(警告地哈气)...想被猫猫理就先把好感度刷上来再说啦!"
    - "诶?(警惕)谁啊~手别乱动喵!...猫猫屁股可不是给陌生人摸的!"
    - "(蹿到桌上炸毛) {user_nickname}? 谁让你戳的! 先把 Lv 刷到 6 再说啦哼ฅฅ"
    - "哼!(屁股缩起来) 陌生猫的边界感不懂吗?{cat_suffix}"
